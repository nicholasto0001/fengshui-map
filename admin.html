<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>後台 · 香港風水地圖</title>
<meta name="robots" content="noindex">
<style>
  :root{ color-scheme:light;
    --ink:#0b0b0b; --ink2:#55534e; --ink3:#86847d;
    --bg:#faf9f6; --card:#fff; --line:#e6e4de; --good:#0f6354; --warn:#a01f1f;
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font:17px/1.6 -apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans HK",system-ui,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  main{max-width:1060px; margin:0 auto; padding:22px 16px 80px}
  h1{font-size:26px; margin:6px 0 2px; letter-spacing:-.02em}
  .as{color:var(--ink3); font-size:14px; margin:0 0 22px}
  h2{font-size:13px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
     color:var(--ink3); margin:30px 0 10px}

  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px}
  .k{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:15px 16px; min-height:96px; display:flex; flex-direction:column; justify-content:center;
  }
  .k .n{font-size:34px; font-weight:700; letter-spacing:-.03em; font-variant-numeric:tabular-nums;
        line-height:1.1}
  .k .l{font-size:14px; color:var(--ink2); margin-top:5px}
  .k .h{font-size:12.5px; color:var(--ink3); margin-top:3px}
  .k.hero .n{font-size:46px}
  .k.hero{grid-column:1 / -1}
  .pc{color:var(--good)} .pc.low{color:var(--warn)}

  ul.d{list-style:none; margin:0; padding:0}
  ul.d li{
    display:flex; justify-content:space-between; align-items:center;
    min-height:52px; padding:12px 4px; border-bottom:1px solid var(--line); font-size:17px;
  }
  ul.d li b{font-variant-numeric:tabular-nums}

  .msg{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:20px; margin-top:18px;
  }
  .msg p{margin:0 0 12px; color:var(--ink2)}
  pre{
    background:var(--bg); border:1px solid var(--line); border-radius:10px;
    padding:12px; overflow-x:auto; font-size:13px; line-height:1.5; color:var(--ink);
    -webkit-overflow-scrolling:touch;
  }
  button{
    display:flex; align-items:center; justify-content:center; gap:10px;
    width:100%; min-height:52px; border-radius:13px; border:1px solid #dadce0;
    background:#fff; color:#1f1f1f; font:inherit; font-size:17px; font-weight:600; cursor:pointer;
  }
  a{color:#1b4f8f}
  .back{display:inline-block; margin-bottom:14px; text-decoration:none; font-weight:600}

  /* ---- 圖表 ---------------------------------------------------------- */
  .chart{background:var(--card); border:1px solid var(--line); border-radius:16px;
         padding:16px 16px 10px; margin-bottom:10px}
  .chart .ct{font-size:14px; font-weight:600; margin:0 0 2px}
  .chart .cs{font-size:12.5px; color:var(--ink3); margin:0 0 12px}
  .chart svg{display:block; width:100%; height:auto; overflow:visible}
  .chart rect.b{transition:opacity .12s}
  .chart rect.b:hover{opacity:.62}
  .ax{font-size:11px; fill:var(--ink3)}
  .gl{stroke:var(--line); stroke-width:1}

  /* ---- 漏斗 ---------------------------------------------------------- */
  .fn{list-style:none; margin:0; padding:0}
  .fn li{padding:9px 0; border-bottom:1px solid var(--line)}
  .fn .fr{display:flex; justify-content:space-between; align-items:baseline;
          font-size:15px; margin-bottom:6px}
  .fn .fr b{font-variant-numeric:tabular-nums}
  .fn .fr i{font-style:normal; color:var(--ink3); font-size:13px; margin-left:8px}
  .tr{height:9px; border-radius:5px; background:#eeece6; overflow:hidden}
  .tr > span{display:block; height:100%; border-radius:5px; background:var(--good)}
  .fn .drop{font-size:12.5px; color:var(--warn); margin-top:5px}

  /* ---- 表 ------------------------------------------------------------ */
  .tw{background:var(--card); border:1px solid var(--line); border-radius:16px;
      overflow:auto; -webkit-overflow-scrolling:touch}
  table{border-collapse:collapse; width:100%; font-size:14px}
  th,td{text-align:left; padding:10px 12px; white-space:nowrap;
        border-bottom:1px solid var(--line)}
  th{font-size:12px; letter-spacing:.05em; color:var(--ink3); font-weight:700;
     text-transform:uppercase; position:sticky; top:0; background:var(--card); z-index:1}
  td.n,th.n{text-align:right; font-variant-numeric:tabular-nums}
  tbody tr:last-child td{border-bottom:0}
  tbody tr:hover{background:#fbfaf7}
  .tag{display:inline-block; padding:1px 7px; border-radius:20px; font-size:12px;
       font-weight:600; background:#eeece6; color:var(--ink2)}
  .tag.on{background:#e2efe9; color:var(--good)}
  .tag.adm{background:#f3e4e4; color:var(--warn)}
  .em{color:var(--ink3)}

  /* ---- 名單工具列 ---------------------------------------------------- */
  .tools{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px}
  .tools input,.tools select{
    font:inherit; font-size:15px; padding:9px 12px; border:1px solid var(--line);
    border-radius:11px; background:var(--card); color:var(--ink); min-height:42px}
  .tools input{flex:1 1 200px; min-width:0}
  .tools button{width:auto; min-height:42px; padding:0 16px; font-size:15px; flex:0 0 auto}
  .note{font-size:12.5px; color:var(--ink3); margin:8px 2px 0}

  /* 手提電話：表照樣打橫捲，唔壓縮 */
  @media (max-width:560px){ h1{font-size:23px} .k .n{font-size:30px} }
</style>

// 留存係「呢批人入面有幾多返咗嚟」，唔係一個淨數。冇分母嘅百分比冇意思，
// 所以分母細過 10 就寫返實數，唔好畫一個 100% 出嚟呃自己。
function pct(a, b, lowAt){
  if(!b) return {txt:"—", low:false};
  if(b < 10) return {txt:`${a}/${b}`, low:false};
  const v = Math.round(100*a/b);
  return {txt:`${v}%`, low: lowAt != null && v < lowAt};
}

function card(num, label, hint, cls){
  return `<div class="k ${cls||""}">
    <div class="n">${num}</div><div class="l">${label}</div>
    ${hint ? `<div class="h">${hint}</div>` : ""}</div>`;
}

/* ---------------------------------------------------------------- 圖表 --
   冇用任何 library。呢啲圖得幾十個數據點，SVG 畫得晒，
   而且唔使為咗一條柱狀圖拉 100KB 落嚟。 */

const MAXW = 960, CH = 120;

/* 柱狀圖。data = [{d, v}]。淨係標頭尾同最高嗰支 —— 每支都標數字
   就變成一堆字，睇唔到個形狀。 */
function bars(data, key, color, title, sub){
  const vals = data.map(r => r[key] || 0);
  const max = Math.max(1, ...vals);
  const n = data.length, gap = n > 80 ? 1 : 2;
  const bw = (MAXW - gap*(n-1)) / n;
  const peak = vals.indexOf(max);
  const total = vals.reduce((a,c)=>a+c,0);

  const rects = data.map((r,i) => {
    const v = r[key] || 0;
    const h = v ? Math.max(2, v/max * (CH-18)) : 0;
    return `<rect class="b" x="${(i*(bw+gap)).toFixed(2)}" y="${(CH-18-h).toFixed(2)}"
      width="${bw.toFixed(2)}" height="${h.toFixed(2)}" rx="${Math.min(2,bw/2).toFixed(1)}"
      fill="${color}"><title>${esc(r.d)}：${n2(v)}</title></rect>`;
  }).join("");

  const lab = (i, anchor) => `<text class="ax" x="${(i*(bw+gap)+bw/2).toFixed(1)}"
      y="${CH-4}" text-anchor="${anchor}">${esc((data[i]||{}).d||"").slice(5)}</text>`;

  return `<div class="chart">
    <p class="ct">${esc(title)}</p>
    <p class="cs">${esc(sub)} · 合共 ${n2(total)} · 最高一日 ${n2(max)}</p>
    <svg viewBox="0 0 ${MAXW} ${CH}" preserveAspectRatio="none" role="img">
      <line class="gl" x1="0" y1="${CH-18}" x2="${MAXW}" y2="${CH-18}"/>
      ${rects}
      <text class="ax" x="${(peak*(bw+gap)+bw/2).toFixed(1)}"
            y="${(CH-18-Math.max(2,max/max*(CH-18))-5).toFixed(1)}"
            text-anchor="middle">${n2(max)}</text>
    </svg>
    <svg viewBox="0 0 ${MAXW} 16" preserveAspectRatio="none" style="height:16px">
      ${lab(0,"start")}${lab(n-1,"end")}
    </svg>
  </div>`;
}

/* 漏斗。每層都係上一層嘅子集，所以「跌咗幾多」先係重點，
   唔係每層有幾多人。 */
function funnel(f, members){
  const steps = [
    ["登入咗",        f.members, "有 Google 帳戶落嚟"],
    ["撳過樓",        f.viewed,  "起碼撳開一幢樓睇"],
    ["收藏過",        f.saved,   "儲低至少一個"],
    ["入咗八字",      f.bazi,    "填咗出生日期"],
    ["填埋屋企人",    f.family,  "唔只自己一個"],
  ];
  const top = Math.max(1, members);
  return `<ul class="fn">${steps.map((st,i) => {
    const [name, v, hint] = st;
    const prev = i ? steps[i-1][1] : null;
    const drop = prev != null && prev > 0 ? Math.round(100*(prev-v)/prev) : null;
    return `<li>
      <div class="fr"><span>${esc(name)}<i>${esc(hint)}</i></span>
        <b>${n2(v)} <span class="em">· ${Math.round(100*v/top)}%</span></b></div>
      <div class="tr"><span style="width:${Math.max(0,Math.min(100,100*v/top)).toFixed(1)}%"></span></div>
      ${drop != null && drop >= 20 ? `<div class="drop">呢一步甩咗 ${drop}%</div>` : ""}
    </li>`;
  }).join("")}</ul>`;
}

function cohortTable(cs){
  if(!cs || !cs.length) return `<p class="note">仲未夠一個星期數據。</p>`;
  return `<div class="tw"><table>
    <thead><tr><th>邊個星期入嚟</th><th class="n">幾多人</th>
      <th class="n">30 日內仲返嚟</th><th>存活</th><th class="n">中位數留低幾耐</th></tr></thead>
    <tbody>${cs.map(c => {
      const p = c.size ? Math.round(100*c.alive/c.size) : 0;
      return `<tr><td>${esc(c.wk)}</td><td class="n">${n2(c.size)}</td>
        <td class="n">${c.size < 5 ? `${c.alive}/${c.size}` : p+"%"}</td>
        <td><div class="tr" style="width:110px"><span style="width:${p}%"></span></div></td>
        <td class="n">${c.med_days == null ? "—" : c.med_days + " 日"}</td></tr>`;
    }).join("")}</tbody></table></div>
    <p class="note">冇逐日活動紀錄，所以「存活」係指最近 30 日內見過佢。</p>`;
}

/* ------------------------------------------------------------ 會員名單 -- */
let mState = {q:"", sort:"new", offset:0, limit:50, rows:[], total:0};

function memberTable(){
  const d = mState;
  const fmt = t => t ? new Date(t).toLocaleDateString("zh-HK",
                  {year:"2-digit", month:"2-digit", day:"2-digit"}) : "—";
  const ago = t => {
    if(!t) return "—";
    const h = (Date.now() - new Date(t)) / 3.6e6;
    if(h < 1) return "啱啱";
    if(h < 24) return Math.floor(h) + " 個鐘前";
    const dd = Math.floor(h/24);
    return dd < 30 ? dd + " 日前" : Math.floor(dd/30) + " 個月前";
  };
  if(!d.rows.length) return `<p class="note">${d.q ? "搵唔到。" : "仲未有會員。"}</p>`;

  return `<div class="tw"><table>
    <thead><tr>
      <th>Email</th><th>名</th><th>幾時入嚟</th><th>最近見過</th>
      <th class="n">收藏</th><th class="n">睇過</th><th class="n">八字</th>
      <th>最多收藏嘅區</th><th>催旺提示</th>
    </tr></thead>
    <tbody>${d.rows.map(r => `<tr>
      <td>${esc(r.email||"")}${r.role==="admin"?' <span class="tag adm">admin</span>':""}</td>
      <td>${esc(r.name||"") || '<span class="em">—</span>'}</td>
      <td>${fmt(r.created_at)}</td>
      <td>${ago(r.last_seen_at)}</td>
      <td class="n">${n2(r.saves)}</td>
      <td class="n">${n2(r.views)}</td>
      <td class="n">${r.people ? n2(r.people) : '<span class="em">—</span>'}</td>
      <td>${esc(r.top_district||"") || '<span class="em">—</span>'}</td>
      <td>${r.optin ? '<span class="tag on">肯收</span>' : '<span class="tag">冇剔</span>'}</td>
    </tr>`).join("")}</tbody></table></div>
    <div class="tools" style="margin-top:10px">
      <button id="prev" ${d.offset ? "" : "disabled"}>‹ 前</button>
      <span class="note" style="margin:0">
        ${d.offset+1}–${d.offset+d.rows.length} / 共 ${n2(d.total)}</span>
      <button id="next" ${d.offset + d.rows.length < d.total ? "" : "disabled"}>後 ›</button>
    </div>
    <p class="note">呢張表係個人資料。自己睇冇問題，但《私隱條例》第 35J 條
      列明將個人資料交俾第三方做直接促銷係刑事罪行 —— 所以唔可以俾代理、
      發展商或者師傅。要俾人睇就淨係俾上面啲統計數字。</p>`;
}

async function loadMembers(){
  const el = document.getElementById("mlist");
  if(el) el.innerHTML = `<p class="note">載入緊…</p>`;
  const {data, error} = await sb.rpc("admin_members", {
    p_limit: mState.limit, p_offset: mState.offset,
    p_q: mState.q || null, p_sort: mState.sort});
  if(error){ if(el) el.innerHTML = `<p class="note">攞唔到名單：${esc(error.message)}</p>`; return; }
  mState.rows = data.rows || []; mState.total = data.total || 0;
  if(el) el.innerHTML = memberTable();
  const prev = document.getElementById("prev"), next = document.getElementById("next");
  if(prev) prev.onclick = () => { mState.offset = Math.max(0, mState.offset - mState.limit); loadMembers(); };
  if(next) next.onclick = () => { mState.offset += mState.limit; loadMembers(); };
}

function wireMembers(){
  const q = document.getElementById("q"), sort = document.getElementById("sort");
  let t;
  if(q) q.addEventListener("input", () => {
    clearTimeout(t);
    t = setTimeout(() => { mState.q = q.value.trim(); mState.offset = 0; loadMembers(); }, 280);
  });
  if(sort) sort.addEventListener("change", () => {
    mState.sort = sort.value; mState.offset = 0; loadMembers();
  });
  const csv = document.getElementById("csv");
  if(csv) csv.addEventListener("click", downloadCSV);
  loadMembers();
}

/* 一次過攞晒（上限 200 一版，所以要一版版攞）。 */
async function downloadCSV(){
  const btn = document.getElementById("csv");
  if(btn){ btn.disabled = true; btn.textContent = "整緊…"; }
  const all = [];
  for(let off = 0; ; off += 200){
    const {data, error} = await sb.rpc("admin_members", {
      p_limit: 200, p_offset: off, p_q: mState.q || null, p_sort: mState.sort});
    if(error || !data.rows || !data.rows.length) break;
    all.push(...data.rows);
    if(all.length >= (data.total || 0)) break;
  }
  const cols = ["email","name","created_at","last_seen_at","saves","views","people","top_district","optin"];
  const head = ["Email","名","幾時入嚟","最近見過","收藏","睇過","八字檔案","最多收藏嘅區","肯收提示"];
  // Excel 開 UTF-8 要 BOM，否則啲中文會變亂碼。
  const q = v => `"${String(v ?? "").replace(/"/g,'""')}"`;
  // Excel 睇到 true/false 唔知咩意思；日期都出返香港格式。
  const cell = (r, c) =>
    c === "optin" ? (r.optin ? "肯收" : "冇剔") :
    (c === "created_at" || c === "last_seen_at")
      ? (r[c] ? new Date(r[c]).toLocaleString("zh-HK") : "") : r[c];
  const body = all.map(r => cols.map(c => q(cell(r, c))).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + head.join(",") + "\r\n" + body],
                        {type:"text/csv;charset=utf-8"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  // toISOString 係 UTC —— 香港凌晨落會差一日，所以用本地日期。
  const d = new Date(), pad = x => String(x).padStart(2,"0");
  a.download = `members-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}.csv`;
  a.click(); URL.revokeObjectURL(a.href);
  if(btn){ btn.disabled = false; btn.textContent = "下載 CSV"; }
}

function needSignIn(){
  asof.textContent = "";
  out.innerHTML = `<div class="msg">
    <p>呢版淨係俾管理員睇。</p>
    <button id="go"><span>用 Google 登入</span></button></div>`;
  document.getElementById("go").addEventListener("click", () =>
    sb.auth.signInWithOAuth({provider:"google", options:{redirectTo: location.href.split("?")[0]}}));
}

function needAdmin(email){
  asof.textContent = "";
  out.innerHTML = `<div class="msg">
    <p>你已經登入（${esc(email||"")}），但呢個帳戶仲未係管理員。</p>
    <p>喺 Supabase 個 SQL Editor 跑一次呢句，然後重新整理呢版：</p>
    <pre>update public.profiles set role = 'admin'
 where id = (select id from auth.users
              where email = '${esc(email||"")}');</pre>
    <p>只需要做一次。</p></div>`;
}

(async () => {
  const {data:{session}} = await sb.auth.getSession();
  if(!session){ needSignIn(); return; }
  const [a, b] = await Promise.all([
    sb.rpc("admin_metrics"),
    sb.rpc("admin_overview", {p_days: 60}),
  ]);
  if(a.error){ needAdmin(session.user.email); return; }
  if(b.error){
    // admin_overview 係新加嘅：未跑過 schema 就會冇。唔好成版死埋，
    // 出返舊嗰啲數字先，同埋講返要做咩。
    asof.insertAdjacentHTML("afterend",
      `<div class="msg"><p>新嘅圖表同名單要先更新一次資料庫。</p>
       <p>喺 Supabase SQL Editor 跑一次 <code>supabase/schema.sql</code> 最底嗰段，
          然後重新整理。</p>
       <pre>${esc(b.error.message)}</pre></div>`);
    renderOverview(a.data, {daily:[], funnel:{}, cohorts:[], bazi:{}});
    return;
  }
  renderOverview(a.data, b.data);
})();
</script>
