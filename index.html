<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#1b4f8f">
<title>香港風水地圖 · 九運</title>
<meta name="description" content="香港逐棟樓宇九運風水評分地圖">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    color-scheme: light;
    --bg:#f4f3f0; --card:#ffffff; --line:#e3e2dd;
    --ink:#0b0b0b; --ink2:#55534e; --ink3:#86847d;
    --brand:#1b4f8f;
    /* diverging: red = below average, neutral hinge, teal = above */
    --s1:#a01f1f; --s2:#d76f6f; --s3:#e6e4de; --s4:#4da79a; --s5:#0f6354;
    --shadow: 0 2px 10px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden;
  }
  #map{position:fixed; inset:0; background:#dfe6ea}

  /* ---------- top search ---------- */
  #top{
    position:fixed; z-index:600; top:0; left:0; right:0;
    padding:10px 10px 0; display:flex; gap:8px; align-items:flex-start;
    pointer-events:none;
  }
  #searchwrap{flex:1; min-width:0; pointer-events:auto; max-width:560px}
  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border-radius:26px; box-shadow:var(--shadow); padding:0 6px 0 14px; height:48px;
  }
  .searchbar svg{flex:0 0 18px; opacity:.5}
  #q{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font:inherit; font-size:16px; height:100%; color:var(--ink);
  }
  #q::placeholder{color:var(--ink3)}
  #clear{
    border:0; background:transparent; font-size:20px; color:var(--ink3);
    width:34px; height:34px; border-radius:50%; cursor:pointer; display:none;
  }
  #clear:hover{background:var(--bg)}
  #results{
    margin:6px 0 0; padding:6px; list-style:none; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); max-height:46vh; overflow-y:auto; display:none;
  }
  #results.show{display:block}
  #results li{padding:10px 12px; border-radius:10px; cursor:pointer}
  #results li:active,#results li:hover{background:var(--bg)}
  #results .nm{font-weight:600; font-size:14.5px}
  #results .ad{color:var(--ink3); font-size:12.5px; margin-top:1px}
  #results .pill{
    float:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    color:#fff; border-radius:999px; padding:2px 9px; margin-left:8px;
  }
  #results .empty{color:var(--ink3); font-size:13.5px; padding:10px 12px; cursor:default}

  /* ---------- right buttons ---------- */
  #tools{display:flex; flex-direction:column; gap:8px; pointer-events:auto}
  .tbtn{
    width:48px; height:48px; border-radius:50%; border:0; background:var(--card);
    box-shadow:var(--shadow); cursor:pointer; display:grid; place-items:center;
    font-size:19px; color:var(--ink2); padding:0;
  }
  .tbtn:active{background:var(--bg)}
  .tbtn.on{background:var(--brand); color:#fff}

  /* ---------- layer menu ---------- */
  #layers{
    position:fixed; z-index:620; top:66px; right:10px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); padding:6px; display:none; width:186px;
  }
  #layers.show{display:block}
  #layers button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    font:inherit; font-size:14px; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
  }
  #layers button:hover{background:var(--bg)}
  #layers button.sel{background:var(--bg); font-weight:600}
  #layers button.sel::after{content:"✓"; float:right; color:var(--brand)}
  #layers{width:auto; min-width:150px}

  /* ---------- basemap treatment ----------
     The Lands Department topographic sheet is drawn for reading terrain, not
     for sitting under a choropleth: strong greens, contour hatching and road
     fills all compete with the building colours. Desaturating and lifting it
     toward white turns it into a quiet ground plane. */
  .muted-base{filter:saturate(.35) brightness(1.1) contrast(.92)}
  .muted-sat{filter:saturate(.7) brightness(1.04)}
  .leaflet-highlight-pane path{filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}

  /* ---------- status toast ---------- */
  #toast{
    position:fixed; z-index:610; top:70px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,20,.86); color:#fff; border-radius:999px;
    padding:7px 16px; font-size:13px; box-shadow:var(--shadow);
    pointer-events:none; opacity:0; transition:opacity .18s; max-width:88vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1}

  /* ---------- bottom sheet ---------- */
  #sheet{
    position:fixed; z-index:640; left:0; right:0; bottom:0;
    background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -3px 18px rgba(0,0,0,.14);
    transform:translateY(calc(100% - 62px)); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:min(72vh, 620px); display:flex; flex-direction:column;
  }
  #sheet.open{transform:translateY(0)}
  #grip{
    flex:0 0 auto; padding:9px 16px calc(12px + var(--safe-b)); cursor:pointer; user-select:none;
  }
  #grip .bar{width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 9px}
  #griptext{font-size:13.5px; color:var(--ink2); text-align:center}
  #sheetbody{
    flex:1 1 auto; overflow-y:auto; padding:0 16px calc(22px + var(--safe-b));
    -webkit-overflow-scrolling:touch;
  }
  .bname{font-size:19px; font-weight:700; margin:0 0 2px; line-height:1.25}
  .ben{font-size:12.5px; color:var(--ink3); margin:0 0 14px}
  .scorerow{display:flex; align-items:center; gap:14px; margin-bottom:16px}
  .bigscore{
    width:76px; height:76px; flex:0 0 76px; border-radius:50%; display:grid; place-items:center;
    font-size:27px; font-weight:700; font-variant-numeric:tabular-nums;
    box-shadow:0 2px 8px rgba(0,0,0,.14);
  }
  /* The verdict is the thing people read first; as plain text it disappeared. */
  .verdict{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 5px;
    padding:4px 13px; border-radius:999px; line-height:1.3;
  }
  .vsub{font-size:12.5px; color:var(--ink3); margin:0}
  .bars{margin-bottom:16px}
  .bars .r{display:grid; grid-template-columns:64px 1fr 38px; align-items:center; gap:10px; margin:6px 0}
  .bars .lb{font-size:13px; color:var(--ink2)}
  .bars .tk{background:#edebe4; border-radius:4px; height:11px}
  /* The mid-band colour is deliberately low-chroma, which is right on the map
     but leaves a bar almost invisible against its track. A hairline gives every
     value a defined edge whatever its colour. */
  .bars .fl{height:11px; border-radius:0 4px 4px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .bars .vl{text-align:right; font-size:13px; font-variant-numeric:tabular-nums}
  dl.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 16px}
  dl.facts dt{color:var(--ink3); font-size:13px}
  dl.facts dd{margin:0; font-size:13.5px; font-variant-numeric:tabular-nums}
  .gmaps{
    display:block; text-align:center; text-decoration:none; font-size:14px; font-weight:600;
    color:var(--brand); border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:14px;
  }
  .gmaps:active{background:var(--bg)}
  /* ---------- explanatory block ----------
     Previously one dense paragraph. Split into labelled rows so each fact can
     be read on its own instead of being hunted for inside a block of text. */
  .note-block{border-top:1px solid var(--line); margin-top:4px; padding-top:14px}
  .note-block h4{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink3); margin:0 0 10px;
  }
  .note-row{display:grid; grid-template-columns:52px 1fr; gap:10px; margin-bottom:9px}
  .note-row .k{
    font-size:11.5px; font-weight:600; color:var(--ink2); text-align:right;
    font-variant-numeric:tabular-nums; padding-top:1px;
  }
  .note-row .v{font-size:12.5px; color:var(--ink2); line-height:1.55}
  .note-foot{
    font-size:11.5px; color:var(--ink3); line-height:1.6; margin:14px 0 0;
    padding-top:12px; border-top:1px dashed var(--line);
  }
  .note-foot b{color:var(--ink2); font-weight:600}

  /* ---------- method explanation ----------
     Collapsed by default: it is reference material, not something to read on
     every building. Opened, it walks the four steps with this building's own
     numbers filled in, so the figures above stop being arbitrary. */
  .method{border-top:1px solid var(--line); margin-top:4px}
  .method>summary{
    list-style:none; cursor:pointer; padding:14px 2px; display:flex;
    align-items:center; justify-content:space-between;
    font-size:13.5px; font-weight:600; color:var(--ink2);
  }
  .method>summary::-webkit-details-marker{display:none}
  .method .chev{color:var(--ink3); font-size:12px; transition:transform .18s}
  .method[open] .chev{transform:rotate(180deg)}
  .method-body{padding:0 0 4px}

  .step{display:grid; grid-template-columns:24px 1fr; gap:11px; margin-bottom:20px}
  .sn{
    width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:700;
  }
  .sb h5{font-size:14px; margin:2px 0 6px; color:var(--ink)}
  .sb p{font-size:12.5px; line-height:1.65; color:var(--ink2); margin:0 0 8px}
  .sb p.mine{
    background:var(--bg); border-radius:8px; padding:8px 10px; font-size:12.5px;
    color:var(--ink); margin:8px 0 0;
  }

  table.mwds{border-collapse:collapse; width:100%; margin:10px 0; font-size:12px}
  table.mwds th{
    text-align:left; font-weight:600; color:var(--ink3); font-size:10.5px;
    letter-spacing:.05em; padding:0 8px 5px 0; border-bottom:1px solid var(--line);
  }
  table.mwds td{padding:4px 8px 4px 0; color:var(--ink2); border-bottom:1px solid #f2f1ed}
  table.mwds td:last-child{text-align:right; font-variant-numeric:tabular-nums; padding-right:0}
  table.mwds tr.hit td{background:#fff5e6; color:var(--ink); font-weight:700}
  table.mwds tr.hit td:first-child{border-radius:6px 0 0 6px; padding-left:7px}
  table.mwds tr.hit td:last-child{border-radius:0 6px 6px 0; padding-right:7px}
  table.mwds tr.zero td{color:var(--ink3)}

  .wbar{display:flex; gap:3px; margin-top:10px; height:40px}
  .wbar div{
    border-radius:6px; background:var(--brand); color:#fff; display:grid; place-content:center;
    font-size:12px; font-weight:700; text-align:center; min-width:0; overflow:hidden;
  }
  .wbar div:nth-child(2){background:#5f8fb8}
  .wbar div:nth-child(3){background:#a8c4d6; color:var(--ink2)}
  .wbar span{display:block; font-size:10px; font-weight:500; opacity:.9}

  .limits{background:var(--bg); border-radius:12px; padding:13px 14px; margin-bottom:14px}
  .limits h5{font-size:13px; margin:0 0 8px; color:var(--ink)}
  .limits ul{margin:0 0 9px; padding-left:17px}
  .limits li{font-size:12.5px; line-height:1.6; color:var(--ink2); margin-bottom:3px}
  .limits p{font-size:12px; line-height:1.6; color:var(--ink3); margin:0}
  .build{
    font-size:10.5px; color:var(--ink3); text-align:center; margin:14px 0 0;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .build-inline{color:var(--ink3); font-variant-numeric:tabular-nums}
  .src{font-size:11px; line-height:1.6; color:var(--ink3); margin:0; padding-top:11px;
       border-top:1px dashed var(--line)}

  /* ---------- 理氣 block ---------- */
  .liqi{
    background:linear-gradient(180deg,#fbf9f4,#f7f4ec); border:1px solid #ece6d8;
    border-radius:14px; padding:14px 15px; margin:0 0 16px;
  }
  .liqi-hd{
    font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:#9b8b63; margin-bottom:6px;
  }
  .liqi-now{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 4px;
    padding:3px 12px; border-radius:999px; line-height:1.35;
  }
  .liqi-now.t-good{background:#0f6354; color:#fff}
  .liqi-now.t-mid {background:#e6e4de; color:#3a3833}
  .liqi-now.t-bad {background:#a01f1f; color:#fff}
  .liqi-sub{font-size:12.5px; color:var(--ink2); margin:0}
  .liqi-warn{
    font-size:11px; color:var(--ink3); line-height:1.5; margin:11px 0 0;
    padding-top:9px; border-top:1px dashed #e0d7c2;
  }
  .liqi-none{background:var(--bg); border-color:var(--line)}
  .liqi-none .liqi-hd{color:var(--ink3)}

  /* legend inside sheet */
  .legend{margin:2px 0 16px}
  .legend .lbar{display:flex; height:14px; border-radius:4px; overflow:hidden; gap:2px}
  .legend .lbar span{flex:1; border-radius:2px}
  .legend .lt{display:flex; justify-content:space-between; margin-top:6px}
  .legend .lt b{font-size:11.5px; font-weight:600; color:var(--ink2)}
  .legend .lt i{font-size:11.5px; font-style:normal; color:var(--ink3)}
  .dlist{list-style:none; margin:0 0 16px; padding:0}
  .dlist li{display:grid; grid-template-columns:66px 1fr 36px; align-items:center; gap:9px; padding:3px 0; font-size:13px; cursor:pointer; border-radius:6px}
  .dlist li:active{background:var(--bg)}
  .dlist .dn{color:var(--ink2)}
  .dlist .tk{background:#edebe4; border-radius:3px; height:9px}
  .dlist .fl{height:9px; border-radius:0 3px 3px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .dlist .dv{text-align:right; font-variant-numeric:tabular-nums}

  /* ---------- onboarding ---------- */
  #intro{
    position:fixed; inset:0; z-index:900; background:rgba(12,14,18,.62);
    display:grid; place-items:center; padding:22px; backdrop-filter:blur(3px);
  }
  #intro.hide{display:none}
  .card{
    background:var(--card); border-radius:20px; padding:26px 22px 20px; max-width:380px; width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
  }
  .card h1{font-size:21px; margin:0 0 4px}
  .card .tag{font-size:13px; color:var(--ink3); margin:0 0 18px}
  .card ol{margin:0 0 18px; padding-left:20px; font-size:14.5px; line-height:1.85; color:var(--ink2)}
  .card ol b{color:var(--ink)}
  .card .warn{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0 0 16px}
  .card button{
    width:100%; border:0; background:var(--brand); color:#fff; font:inherit; font-size:16px;
    font-weight:600; padding:14px; border-radius:13px; cursor:pointer;
  }
  .card button:active{opacity:.85}

  .leaflet-container{font:inherit}
  .leaflet-control-attribution{font-size:10px; padding:0 5px}
  .leaflet-control-zoom{display:none}
  .dmark{
    display:grid; place-items:center; border-radius:50%; color:#fff; font-weight:700;
    font-size:12px; font-variant-numeric:tabular-nums; border:2px solid rgba(255,255,255,.9);
    box-shadow:0 1px 5px rgba(0,0,0,.3);
  }
  .dlabel{
    position:absolute; left:50%; transform:translateX(-50%); top:100%; margin-top:2px;
    font-size:11px; color:#1a1a1a; white-space:nowrap; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
    font-weight:600;
  }
  @media (min-width:760px){
    #sheet{left:auto; right:14px; bottom:14px; width:390px; border-radius:18px;
           transform:translateY(calc(100% - 62px)); max-height:min(80vh,700px)}
    #sheet.open{transform:translateY(0)}
    #grip{padding-bottom:12px}
    #sheetbody{padding-bottom:20px}
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="top">
  <div id="searchwrap">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="搜尋屋苑、大廈或地址" autocomplete="off" enterkeyhint="search">
      <button id="clear" aria-label="清除">×</button>
    </div>
    <ul id="results"></ul>
  </div>
  <div id="tools">
    <button class="tbtn" id="btnLayers" title="地圖樣式" aria-label="地圖樣式">◲</button>
    <button class="tbtn" id="btnLoc" title="我的位置" aria-label="我的位置">◉</button>
  </div>
</div>

<div id="layers">
  <button data-base="street" class="sel">街道圖</button>
  <button data-base="satellite">衛星圖</button>
</div>

<div id="toast"></div>

<div id="sheet">
  <div id="grip"><div class="bar"></div><div id="griptext">撳任何一棟樓睇風水評分</div></div>
  <div id="sheetbody"></div>
</div>

<div id="intro">
  <div class="card">
    <h1>香港風水地圖</h1>
    <p class="tag">三元九運 · 第九運（2024–2043）</p>
    <ol>
      <li><b>搜尋</b>屋苑或地址，或者直接喺地圖揾</li>
      <li><b>放大</b>之後每棟樓都會上色，顏色越深風水分越高</li>
      <li><b>撳一撳</b>任何一棟樓，睇佢嘅評分拆解</li>
    </ol>
    <p class="warn">評分根據公開地理數據同三元九運山水方位計算，屬於「外巒頭」地理分析，並唔包括坐向飛星盤或室內風水。僅供參考，不構成置業建議。</p>
    <button id="introGo">開始</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================================
   Data sources
   basemap/label tiles : Lands Department  (mapapi.geodata.gov.hk, no key)
   address lookup      : Digital Policy Office ALS (als.gov.hk, no key)
   scores + footprints : our own pipeline, rebuilt daily from CSDI
   ========================================================================= */
const ALS  = "https://www.als.gov.hk/lookup";
const TILE = "https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz";
const DATA = "data/tiles";
// Bump on every release. Shown in the overview sheet so a stale cached page is
// identifiable at a glance — otherwise there is no way to tell.
const APP_VERSION = "v5";
const TILE_Z = 14;              // must match pipeline/build_tiles.py
const BUILDING_ZOOM = 15;       // below this, show the district overview

// Tile rows arrive as arrays; COLUMNS in build_tiles.py is the contract.
let COLS = null;
function rowToObj(row){
  const o = {};
  for(let i=0;i<COLS.length;i++) o[COLS[i]] = row[i];
  return o;
}
// Footprints are stored as a first vertex plus integer deltas of 1e-5 degrees.
function decodeRing(enc){
  if(!enc || enc.length < 6) return null;
  let lon = enc[0], lat = enc[1];
  const pts = [[lat, lon]];
  let x = Math.round(lon*1e5), y = Math.round(lat*1e5);
  for(let i=2;i<enc.length;i+=2){
    x += enc[i]; y += enc[i+1];
    pts.push([y/1e5, x/1e5]);
  }
  return pts;
}

// ---------------------------------------------------------------------------
// Diverging scale: red = below average, neutral = middle, teal = above.
//
// A single-hue blue ramp (the earlier version) encodes magnitude but not
// polarity — you cannot tell good from bad without consulting a legend, which
// is exactly the failure this replaces. A diverging scale carries the verdict
// in the hue itself.
//
// Validated with the data-viz palette checker against a white surface:
// worst adjacent CVD ΔE 19.9 (deutan) and normal-vision ΔE 20.5, against
// thresholds of 8 and 15. The neutral hinge is deliberately low-chroma — that
// is what keeps the two pale ends from colliding under colour blindness, and
// it is why an amber bridge (the obvious "traffic light") had to be dropped:
// amber against yellow-green measured ΔE 2.6.
//
// 50 is the Hong Kong median, so the hinge sits on the middle band.
// ---------------------------------------------------------------------------
const BREAKS = [41, 46, 52, 58];
const RAMP   = ["#a01f1f", "#d76f6f", "#e6e4de", "#4da79a", "#0f6354"];
const NODATA = "#cfcdc6";

const LEVELS = [
  {max: 41,       label: "差",   sub: "全港最低約兩成",   ink: "#fff"},
  {max: 46,       label: "欠佳", sub: "低於全港中位",     ink: "#fff"},
  {max: 52,       label: "平穩", sub: "接近全港中位",     ink: "#3a3833"},
  {max: 58,       label: "吉",   sub: "高於全港中位",     ink: "#fff"},
  {max: Infinity, label: "大吉", sub: "全港最高約一成",   ink: "#fff"},
];

function levelFor(v){
  if (v == null || isNaN(v)) return null;
  return LEVELS[BREAKS.findIndex(b => v < b) === -1 ? LEVELS.length - 1
                                                    : BREAKS.findIndex(b => v < b)];
}
const colorFor = v => {
  if (v == null || isNaN(v)) return NODATA;
  const i = BREAKS.findIndex(b => v < b);
  return RAMP[i === -1 ? RAMP.length - 1 : i];
};
const inkOn = v => (levelFor(v) || {}).ink || "#3a3833";

function verdict(v){
  const l = levelFor(v);
  return l ? [l.label, l.sub] : ["未有評分", ""];
}

const DIR_TC={N:"北",NE:"東北",E:"東",SE:"東南",S:"南",SW:"西南",W:"西",NW:"西北"};
const dirTC = d => (d&&DIR_TC[d]) ? DIR_TC[d] : "—";
const num = (v,d=1)=> (v==null||isNaN(v)) ? "—" : Number(v).toFixed(d);
const clean = s => (!s||s==="N/A"||s==="NULL"||!String(s).trim()) ? null : String(s).trim();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const toastEl=document.getElementById("toast"); let toastT=null;
function toast(msg,ms=2200){
  clearTimeout(toastT);
  if(!msg){toastEl.classList.remove("show");return;}

let minSel=null, reqSeq=0;
const tileCache = new Map();

const buildingLayer=L.layerGroup().addTo(map);

function styleFor(score){
  const c = colorFor(score);
  return {fillColor:c, fillOpacity:.88, color:c, weight:.6, opacity:.55};
}

// Selection is drawn as its own two-ring halo in a pane above everything, so it
// reads against a dark fill, a light fill, or the satellite image alike.
map.createPane("highlight");
map.getPane("highlight").style.zIndex = "645";
map.getPane("highlight").style.pointerEvents = "none";
const highlight = L.layerGroup([], {pane:"highlight"}).addTo(map);

function showHighlight(latlngs, centre){
  highlight.clearLayers();
  if(!latlngs && !centre) return;
  if(latlngs){
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#12161c",weight:6,
                       opacity:.5,lineJoin:"round"}).addTo(highlight);
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#ffffff",weight:2.5,
                       opacity:1,lineJoin:"round"}).addTo(highlight);
  }
  // A small building is only a few pixels across, so the outline alone is easy
  // to lose. An accent dot makes the selection unmistakable at any zoom.
  L.circleMarker(centre,{pane:"highlight", radius:7, color:"#ffffff", weight:2.5,
                         fillColor:"#e0562a", fillOpacity:1}).addTo(highlight);
}

function lonLat2tile(lon,lat,z){
  const n=2**z, rad=lat*Math.PI/180;
  return [Math.floor((lon+180)/360*n),
          Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n)];
}

async function getTile(x,y){
  const key=`${x}/${y}`;
  if(tileCache.has(key)) return tileCache.get(key);
  const pr = fetch(`${DATA}/${TILE_Z}/${x}/${y}.json`)
    .then(r => r.ok ? r.json() : null)
    .catch(() => null);
  tileCache.set(key, pr);
  return pr;
}

async function loadBuildings(){
  const z=map.getZoom();
  if(z<BUILDING_ZOOM){ buildingLayer.clearLayers(); return; }
  districtLayer.clearLayers();

  const b=map.getBounds(), my=++reqSeq;
  const [x0,y1]=lonLat2tile(b.getWest(), b.getNorth(), TILE_Z);
  const [x1,y0]=lonLat2tile(b.getEast(), b.getSouth(), TILE_Z);

  const wanted=[];
  for(let x=x0;x<=x1;x++) for(let y=y1;y<=y0;y++) wanted.push([x,y]);
  if(wanted.length>12){ toast("範圍太大，請放大啲"); return; }

  const tiles=await Promise.all(wanted.map(([x,y])=>getTile(x,y)));
  if(my!==reqSeq) return;

  buildingLayer.clearLayers();
  let n=0, selLayer=null;
  for(const t of tiles){
    if(!t) continue;
    COLS = t.c;
    for(const row of t.b){
      const o=rowToObj(row);
      if(!b.contains([o.lat,o.lon])) continue;
      const ring=decodeRing(o.ring);
      const lyr = ring
        ? L.polygon(ring, styleFor(o.total))
        : L.circleMarker([o.lat,o.lon], {...styleFor(o.total), radius:5});
      lyr.on("click",()=>select(o,lyr));
      lyr.on("mouseover",()=>{ if(o.id!==minSel) lyr.setStyle({weight:1.6,opacity:1}); });
      lyr.on("mouseout", ()=>{ if(o.id!==minSel) lyr.setStyle(styleFor(o.total)); });
      lyr.addTo(buildingLayer);
      if(o.id===minSel) selLayer={o,lyr};
      n++;
    }
  }
  if(selLayer) showHighlight(selLayer.lyr.getLatLngs ? selLayer.lyr.getLatLngs() : null,
                             [selLayer.o.lat, selLayer.o.lon]);
  if(n===0) toast("此範圍未有收錄樓宇");
}

const qEl=document.getElementById("q"), resEl=document.getElementById("results"), clearBtn=document.getElementById("clear");
let searchT=null;

  clearBtn.style.display=qEl.value?"block":"none";
  clearTimeout(searchT);
  if(qEl.value.trim().length<2){ resEl.classList.remove("show"); return; }
  searchT=setTimeout(doSearch,320);
});
qEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ clearTimeout(searchT); doSearch(); qEl.blur(); }});
clearBtn.addEventListener("click",()=>{ qEl.value=""; clearBtn.style.display="none"; resEl.classList.remove("show"); qEl.focus(); });

let searchIndex=null, searchLoading=null;
async function ensureIndex(){
  if(searchIndex) return searchIndex;
  if(!searchLoading){
    searchLoading = fetch(`${DATA}/search.json`).then(r=>r.json()).then(d=>{
      searchIndex = d.b.map(row=>{
        const o={}; d.c.forEach((k,i)=>o[k]=row[i]); return o;
      });
      return searchIndex;
    }).catch(()=>{ searchIndex=[]; return searchIndex; });
  }
  return searchLoading;
}

async function doSearch(){
  const q=qEl.value.trim(); if(q.length<2) return;
  resEl.innerHTML=`<li class="empty">搜尋中…</li>`; resEl.classList.add("show");

  const idx=await ensureIndex();
  const needle=q.toLowerCase();
  const hits=[];
  for(const o of idx){
    if((o.tc && o.tc.includes(q)) || (o.en && o.en.toLowerCase().includes(needle))){
      hits.push(o);
      if(hits.length>=12) break;
    }
  }
  if(hits.length){ renderHits(hits); return; }

  const als=await searchALS(q);
  if(als.length){ renderHits(als); return; }
  resEl.innerHTML=`<li class="empty">搵唔到「${esc(q)}」，試下屋苑名或街道名。</li>`;
}

// Falls back to the Government address service when a name is not in our
// index - covers street addresses and estates whose block names differ.
async function searchALS(q){
  try{
    const d=await (await fetch(`${ALS}?q=${encodeURIComponent(q)}&n=8`,
                               {headers:{Accept:"application/json"}})).json();
    return (d.SuggestedAddress||[]).map(s=>{
      const pa=s.Address.PremisesAddress, c=pa.ChiPremisesAddress||{}, en=pa.EngPremisesAddress||{};
      const g=pa.GeospatialInformation||{}, st=c.ChiStreet||{};
      return { kind:"als", total:null,
        tc:c.BuildingName||en.BuildingName||((st.StreetName||"")+(st.BuildingNoFrom||"")),
        note:[(c.ChiEstate||{}).EstateName,
              (st.StreetName||"")+(st.BuildingNoFrom?` ${st.BuildingNoFrom}號`:""),
              (c.ChiDistrict||{}).DcDistrict].filter(Boolean).join(" · "),
        lat:+g.Latitude, lon:+g.Longitude };
    }).filter(x=>x.lat&&x.lon);
  }catch{ return []; }
}

function renderHits(hits){
  resEl.innerHTML=hits.map((h,i)=>{
    const name=clean(h.tc)||clean(h.en)||h.name||"—";
    const note=[clean(h.district), h.note, h.now].filter(Boolean).join(" · ");
    return `<li data-i="${i}">
      ${h.total!=null?`<span class="pill" style="background:${colorFor(h.total)}">${h.total.toFixed(0)}</span>`:""}
      <div class="nm">${esc(name)}</div><div class="ad">${esc(note)}</div></li>`;
  }).join("");
  [...resEl.querySelectorAll("li[data-i]")].forEach(li=>
    li.addEventListener("click",()=>goto(hits[+li.dataset.i])));
}

function goto(h){
  resEl.classList.remove("show"); qEl.blur();
  const lat=h.lat, lon=h.lon!==undefined?h.lon:h.lng;
  map.setView([lat,lon],17);
  if(h.kind==="als"){
    L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,
                              fillColor:"#e0562a",fillOpacity:1}).addTo(map);
    toast("撳附近嘅樓宇睇評分");
  }
  // Let the tiles land, then pick out the building that was searched for.
  loadBuildings().then(()=>{
    let best=null, bestD=Infinity;
    buildingLayer.eachLayer(l=>{
      const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
      const d=(c.lat-lat)**2+(c.lng-lon)**2;
      if(d<bestD){ bestD=d; best=l; }
    });
    if(best && bestD < 1e-7) best.fire("click");
  });
}

/* --------------------------------------------------------- UI wiring --- */
document.getElementById("btnLayers").addEventListener("click",e=>{
  e.stopPropagation(); document.getElementById("layers").classList.toggle("show");
});
document.addEventListener("click",e=>{
  const l=document.getElementById("layers");
  if(!l.contains(e.target)&&e.target.id!=="btnLayers") l.classList.remove("show");
});
document.querySelectorAll('#layers button[data-base]').forEach(b=>
  b.addEventListener("click",()=>{ setBase(b.dataset.base); document.getElementById("layers").classList.remove("show"); }));

document.getElementById("btnLoc").addEventListener("click",()=>{
  if(!navigator.geolocation){ toast("此瀏覽器唔支援定位"); return; }
  toast("定位中…",6000);
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const{latitude:la,longitude:ln}=pos.coords;
      if(la<22.1||la>22.62||ln<113.78||ln>114.47){ toast("你唔喺香港範圍內"); return; }
      map.setView([la,ln],17);
      L.circleMarker([la,ln],{radius:8,color:"#fff",weight:3,fillColor:"#1b4f8f",fillOpacity:1}).addTo(map);
      toast("已定位");
    },
    ()=>toast("定位失敗，請允許位置權限"),
    {enableHighAccuracy:true,timeout:8000});
});

document.getElementById("introGo").addEventListener("click",()=>{
  document.getElementById("intro").classList.add("hide");
  localStorage.setItem("seenIntro","1");
  openSheet();
});
if(localStorage.getItem("seenIntro")) document.getElementById("intro").classList.add("hide");

map.on("moveend zoomend",()=>{ loadBuildings(); drawDistricts(); });
map.whenReady(()=>{ loadDistricts(); loadBuildings(); });
setTimeout(()=>{ if(localStorage.getItem("seenIntro")) openSheet(); },600);
</script>
