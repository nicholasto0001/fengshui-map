     preview card. Without these it renders as a bare URL and nobody taps it. -->

<meta name="twitter:image" content="og.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root{
    color-scheme: light;
    --bg:#f4f3f0; --card:#ffffff; --line:#e3e2dd;
    --ink:#0b0b0b; --ink2:#55534e; --ink3:#86847d;
    --brand:#1b4f8f;
    /* diverging: red = below average, neutral hinge, teal = above */
    --s1:#a01f1f; --s2:#d76f6f; --s3:#e6e4de; --s4:#4da79a; --s5:#0f6354;
    --shadow: 0 2px 10px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden;
  }
  #map{position:fixed; inset:0; background:#dfe6ea}

  /* ---------- top search ---------- */
  #top{
    position:fixed; z-index:600; top:0; left:0; right:0;
    padding:10px 10px 0; display:flex; gap:8px; align-items:flex-start;
    pointer-events:none;
  }
  #searchwrap{flex:1; min-width:0; pointer-events:auto; max-width:560px}
  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border-radius:26px; box-shadow:var(--shadow); padding:0 6px 0 14px; height:48px;
  }
  .searchbar svg{flex:0 0 18px; opacity:.5}
  #q{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font:inherit; font-size:16px; height:100%; color:var(--ink);
  }
  #q::placeholder{color:var(--ink3)}
  #clear{
    border:0; background:transparent; font-size:20px; color:var(--ink3);
    width:34px; height:34px; border-radius:50%; cursor:pointer; display:none;
  }
  #clear:hover{background:var(--bg)}
  #results{
    margin:6px 0 0; padding:6px; list-style:none; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); max-height:46vh; overflow-y:auto; display:none;
  }
  #results.show{display:block}
  #results li{padding:10px 12px; border-radius:10px; cursor:pointer}
  #results li:active,#results li:hover{background:var(--bg)}
  #results .nm{font-weight:600; font-size:14.5px}
  #results .ad{color:var(--ink3); font-size:12.5px; margin-top:1px}
  #results .pill{
    float:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    color:#fff; border-radius:999px; padding:2px 9px; margin-left:8px;
  }
  #results .empty{color:var(--ink3); font-size:13.5px; padding:10px 12px; cursor:default}

  /* ---------- right buttons ---------- */
  #tools{display:flex; gap:8px; pointer-events:auto}
  .tbtn{
    width:48px; height:48px; border-radius:50%; border:0; background:var(--card);
    box-shadow:var(--shadow); cursor:pointer; display:grid; place-items:center;
    font-size:19px; color:var(--ink2); padding:0;
  }
  .tbtn:active{background:var(--bg)}
  .tbtn.on{background:var(--brand); color:#fff}

  /* ---------- filter chips ----------
     Directly under the search bar, where filters live in every map app people
     already use. Scrolls sideways on a phone rather than wrapping to a second
     row and eating the map. */
  #filters{
    position:fixed; z-index:590; top:64px; left:0; right:0;
    display:flex; gap:7px; padding:6px 10px 2px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #filters::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border:0; border-radius:999px; padding:8px 13px; cursor:pointer;
    font:inherit; font-size:13px; font-weight:600; color:var(--ink2);
    background:var(--card); box-shadow:var(--shadow); white-space:nowrap;
  }
  .chip i{width:9px; height:9px; border-radius:50%; display:block; flex:0 0 9px}
  .chip.on{color:#fff; background:var(--ink)}
  .chip.on i{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
  .chip .cnt{font-weight:500; opacity:.7; font-variant-numeric:tabular-nums}

  .chip-sep{flex:0 0 1px; width:1px; background:var(--line); margin:6px 2px; align-self:stretch}
  .dchip{color:var(--ink); gap:5px}
  .dchip b{font-size:10.5px; font-weight:700; color:var(--ink3); letter-spacing:.04em}
  .dchip.on b{color:rgba(255,255,255,.7)}
  .dchip .caret{opacity:.5; font-size:10px}
  .dchip.on{background:var(--brand); color:#fff}
  .dchip.on .caret{opacity:.8}

  #districtMenu{
    position:fixed; z-index:630; top:112px; left:10px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); padding:6px; display:none;
    width:216px; max-height:56vh; overflow-y:auto;
  }
  #districtMenu.show{display:block}
  #districtMenu button{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    width:100%; text-align:left; border:0; background:transparent; font:inherit;
    font-size:14px; padding:9px 11px; border-radius:9px; cursor:pointer; color:var(--ink);
  }
  #districtMenu button:hover{background:var(--bg)}
  #districtMenu button.sel{background:var(--bg); font-weight:700}
  #districtMenu button b{font-weight:inherit}
  #districtMenu button span{font-size:12px; color:var(--ink3); font-variant-numeric:tabular-nums}
  #districtMenu .dsep{height:1px; background:var(--line); margin:5px 8px}

  .favchip .hrt{color:#d64545; font-size:14px; line-height:1}
  .favchip.on{background:#d64545; color:#fff}
  .favchip.on .hrt{color:#fff}

  /* ---------- save + share ---------- */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:0 0 16px}
  .act{
    display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--line); background:var(--card); border-radius:12px;
    padding:12px; font:inherit; font-size:14px; font-weight:600;
    color:var(--ink); cursor:pointer;
  }
  .act:active{background:var(--bg); transform:scale(.985)}
  .act.saved{background:#fdecec; border-color:#f2c9c9; color:#a01f1f}
  .act .ico{font-size:16px; line-height:1}
  .act.primary{background:var(--brand); border-color:var(--brand); color:#fff}

  .sharebar{
    display:flex; align-items:center; gap:10px; background:#eef4fb;
    border:1px solid #d6e4f4; border-radius:12px; padding:12px 13px; margin:0 0 14px;
  }
  .sharebar div{flex:1; min-width:0}
  .sharebar b{display:block; font-size:13.5px; color:#12467e; margin-bottom:2px}
  .sharebar span{font-size:12px; color:#2a5f9e; line-height:1.45}
  .sharebar button{
    flex:0 0 auto; border:0; background:var(--brand); color:#fff; font:inherit;
    font-size:13px; font-weight:700; padding:9px 15px; border-radius:999px; cursor:pointer;
  }

  .shared-note{
    background:#fff8e8; border:1px solid #f0dcae; border-radius:12px;
    padding:12px 14px; margin:0 0 14px;
  }
  .shared-note b{display:block; font-size:14px; color:#6b4c10; margin-bottom:3px}
  .shared-note span{font-size:12.5px; color:#7a5c22; line-height:1.5}

  /* ---------- match list ---------- */
  .mlist{list-style:none; margin:0 0 14px; padding:0}
  .mlist li{
    display:grid; grid-template-columns:40px 1fr auto; align-items:center; gap:11px;
    padding:9px 8px; border-radius:10px; cursor:pointer; border-bottom:1px solid #f4f3ef;
  }
  .mlist li:hover,.mlist li:active{background:var(--bg)}
  .mlist .sc{
    width:40px; height:40px; border-radius:50%; display:grid; place-items:center;
    font-size:14px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .mlist .nm{font-size:14px; font-weight:600; line-height:1.3}
  .mlist .mt{font-size:11.5px; color:var(--ink3); margin-top:1px}
  .mlist .go{color:var(--ink3); font-size:15px}
  .mcount{font-size:12.5px; color:var(--ink3); margin:0 0 10px}
  .homes{
    display:flex; align-items:center; gap:8px; margin:0 0 14px; cursor:pointer;
    font-size:13px; color:var(--ink2); user-select:none;
  }
  .homes input{width:17px; height:17px; accent-color:var(--brand); cursor:pointer}
  .mmore{font-size:11.5px; color:var(--ink3); text-align:center; margin:2px 0 14px}

  /* ---------- layer menu ---------- */
  #layers{
    position:fixed; z-index:620; top:112px; right:10px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); padding:6px; display:none; width:186px;
  }
  #layers.show{display:block}
  #layers button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    font:inherit; font-size:14px; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
  }
  #layers button:hover{background:var(--bg)}
  #layers button.sel{background:var(--bg); font-weight:600}
  #layers button.sel::after{content:"✓"; float:right; color:var(--brand)}
  #layers{width:auto; min-width:150px}

  /* ---------- basemap treatment ----------
     The Lands Department topographic sheet is drawn for reading terrain, not
     for sitting under a choropleth: strong greens, contour hatching and road
     fills all compete with the building colours. Desaturating and lifting it
     toward white turns it into a quiet ground plane. */
  .muted-base{filter:saturate(.35) brightness(1.1) contrast(.92)}
  .muted-sat{filter:saturate(.7) brightness(1.04)}
  .leaflet-highlight-pane path{filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}

  /* ---------- status toast ---------- */
  #toast{
    position:fixed; z-index:610; top:116px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,20,.86); color:#fff; border-radius:999px;
    padding:7px 16px; font-size:13px; box-shadow:var(--shadow);
    pointer-events:none; opacity:0; transition:opacity .18s; max-width:88vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1}

  /* ---------- bottom sheet ---------- */
  #sheet{
    position:fixed; z-index:640; left:0; right:0; bottom:0;
    background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -3px 18px rgba(0,0,0,.14);
    transform:translateY(calc(100% - 62px)); transition:transform .26s cubic-bezier(.32,.72,0,1);
    max-height:min(72vh, 620px); display:flex; flex-direction:column;
  }
  #sheet.open{transform:translateY(0)}
  #grip{
    flex:0 0 auto; padding:9px 16px calc(12px + var(--safe-b)); cursor:pointer; user-select:none;
  }
  #grip .bar{width:38px; height:4px; border-radius:2px; background:var(--line); margin:0 auto 9px}
  #griptext{font-size:13.5px; color:var(--ink2); text-align:center}
  #sheetbody{
    flex:1 1 auto; overflow-y:auto; padding:0 16px calc(22px + var(--safe-b));
    -webkit-overflow-scrolling:touch;
  }
  .bname{font-size:19px; font-weight:700; margin:0 0 2px; line-height:1.25}
  .ben{font-size:12.5px; color:var(--ink3); margin:0 0 14px}
  .scorerow{display:flex; align-items:center; gap:14px; margin-bottom:16px}
  .bigscore{
    width:76px; height:76px; flex:0 0 76px; border-radius:50%; display:grid; place-items:center;
    font-size:27px; font-weight:700; font-variant-numeric:tabular-nums;
    box-shadow:0 2px 8px rgba(0,0,0,.14);
  }
  /* The verdict is the thing people read first; as plain text it disappeared. */
  .verdict{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 5px;
    padding:4px 13px; border-radius:999px; line-height:1.3;
  }
  .vsub{font-size:12.5px; color:var(--ink3); margin:0}
  .bars{margin-bottom:16px}
  .bars .r{display:grid; grid-template-columns:64px 1fr 38px; align-items:center; gap:10px; margin:6px 0}
  .bars .lb{font-size:13px; color:var(--ink2)}
  .bars .tk{background:#edebe4; border-radius:4px; height:11px}
  /* The mid-band colour is deliberately low-chroma, which is right on the map
     but leaves a bar almost invisible against its track. A hairline gives every
     value a defined edge whatever its colour. */
  .bars .fl{height:11px; border-radius:0 4px 4px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .bars .vl{text-align:right; font-size:13px; font-variant-numeric:tabular-nums}
  dl.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 16px}
  dl.facts dt{color:var(--ink3); font-size:13px}
  dl.facts dd{margin:0; font-size:13.5px; font-variant-numeric:tabular-nums}
  .gmaps{
    display:block; text-align:center; text-decoration:none; font-size:14px; font-weight:600;
    color:var(--brand); border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:14px;
  }
  .gmaps:active{background:var(--bg)}
  /* ---------- explanatory block ----------
     Previously one dense paragraph. Split into labelled rows so each fact can
     be read on its own instead of being hunted for inside a block of text. */
  .note-block{border-top:1px solid var(--line); margin-top:4px; padding-top:14px}
  .note-block h4{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink3); margin:0 0 10px;
  }
  .note-row{display:grid; grid-template-columns:52px 1fr; gap:10px; margin-bottom:9px}
  .note-row .k{
    font-size:11.5px; font-weight:600; color:var(--ink2); text-align:right;
    font-variant-numeric:tabular-nums; padding-top:1px;
  }
  .note-row .v{font-size:12.5px; color:var(--ink2); line-height:1.55}
  .note-foot{
    font-size:11.5px; color:var(--ink3); line-height:1.6; margin:14px 0 0;
    padding-top:12px; border-top:1px dashed var(--line);
  }
  .note-foot b{color:var(--ink2); font-weight:600}

  /* ---------- method explanation ----------
     Collapsed by default: it is reference material, not something to read on
     every building. Opened, it walks the four steps with this building's own
     numbers filled in, so the figures above stop being arbitrary. */
  .method{border-top:1px solid var(--line); margin-top:4px}
  .method>summary{
    list-style:none; cursor:pointer; padding:14px 2px; display:flex;
    align-items:center; justify-content:space-between;
    font-size:13.5px; font-weight:600; color:var(--ink2);
  }
  .method>summary::-webkit-details-marker{display:none}
  .method .chev{color:var(--ink3); font-size:12px; transition:transform .18s}
  .method[open] .chev{transform:rotate(180deg)}
  .method-body{padding:0 0 4px}

  .step{display:grid; grid-template-columns:24px 1fr; gap:11px; margin-bottom:20px}
  .sn{
    width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:700;
  }
  .sb h5{font-size:14px; margin:2px 0 6px; color:var(--ink)}
  .sb p{font-size:12.5px; line-height:1.65; color:var(--ink2); margin:0 0 8px}
  .sb p.mine{
    background:var(--bg); border-radius:8px; padding:8px 10px; font-size:12.5px;
    color:var(--ink); margin:8px 0 0;
  }

  table.mwds{border-collapse:collapse; width:100%; margin:10px 0; font-size:12px}
  table.mwds th{
    text-align:left; font-weight:600; color:var(--ink3); font-size:10.5px;
    letter-spacing:.05em; padding:0 8px 5px 0; border-bottom:1px solid var(--line);
  }
  table.mwds td{padding:4px 8px 4px 0; color:var(--ink2); border-bottom:1px solid #f2f1ed}
  table.mwds td:last-child{text-align:right; font-variant-numeric:tabular-nums; padding-right:0}
  table.mwds tr.hit td{background:#fff5e6; color:var(--ink); font-weight:700}
  table.mwds tr.hit td:first-child{border-radius:6px 0 0 6px; padding-left:7px}
  table.mwds tr.hit td:last-child{border-radius:0 6px 6px 0; padding-right:7px}
  table.mwds tr.zero td{color:var(--ink3)}

  .wbar{display:flex; gap:3px; margin-top:10px; height:40px}
  .wbar div{
    border-radius:6px; background:var(--brand); color:#fff; display:grid; place-content:center;
    font-size:12px; font-weight:700; text-align:center; min-width:0; overflow:hidden;
  }
  .wbar div:nth-child(2){background:#5f8fb8}
  .wbar div:nth-child(3){background:#a8c4d6; color:var(--ink2)}
  .wbar span{display:block; font-size:10px; font-weight:500; opacity:.9}

  .limits{background:var(--bg); border-radius:12px; padding:13px 14px; margin-bottom:14px}
  .limits h5{font-size:13px; margin:0 0 8px; color:var(--ink)}
  .limits ul{margin:0 0 9px; padding-left:17px}
  .limits li{font-size:12.5px; line-height:1.6; color:var(--ink2); margin-bottom:3px}
  .limits p{font-size:12px; line-height:1.6; color:var(--ink3); margin:0}
  .build{
    font-size:10.5px; color:var(--ink3); text-align:center; margin:14px 0 0;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .build-inline{color:var(--ink3); font-variant-numeric:tabular-nums}
  .src{font-size:11px; line-height:1.6; color:var(--ink3); margin:0; padding-top:11px;
       border-top:1px dashed var(--line)}

  /* ---------- 理氣 block ---------- */
  .liqi{
    background:linear-gradient(180deg,#fbf9f4,#f7f4ec); border:1px solid #ece6d8;
    border-radius:14px; padding:14px 15px; margin:0 0 16px;
  }
  .liqi-hd{
    font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:#9b8b63; margin-bottom:6px;
  }
  .liqi-now{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 4px;
    padding:3px 12px; border-radius:999px; line-height:1.35;
  }
  .liqi-now.t-good{background:#0f6354; color:#fff}
  .liqi-now.t-mid {background:#e6e4de; color:#3a3833}
  .liqi-now.t-bad {background:#a01f1f; color:#fff}
  .liqi-sub{font-size:12.5px; color:var(--ink2); margin:0}
  .liqi-warn{
    font-size:11px; color:var(--ink3); line-height:1.5; margin:11px 0 0;
    padding-top:9px; border-top:1px dashed #e0d7c2;
  }
  .liqi-none{background:var(--bg); border-color:var(--line)}
  .liqi-none .liqi-hd{color:var(--ink3)}

  /* legend inside sheet */
  .legend{margin:2px 0 16px}
  .legend .lbar{display:flex; height:14px; border-radius:4px; overflow:hidden; gap:2px}
  .legend .lbar span{flex:1; border-radius:2px}
  .legend .lt{display:flex; justify-content:space-between; margin-top:6px}
  .legend .lt b{font-size:11.5px; font-weight:600; color:var(--ink2)}
  .legend .lt i{font-size:11.5px; font-style:normal; color:var(--ink3)}
  /* District rows read as a report until they look pressable: a score pill,
     a subline worth reading, a chevron, and a real pressed state. The old
     progress bar also misfired - a district near the median drew the neutral
     colour, which looks like an empty bar, i.e. missing data. */
  .dlist{list-style:none; margin:0 0 14px; padding:0}
  .dlist li{
    display:grid; grid-template-columns:44px 1fr 14px; align-items:center; gap:12px;
    padding:11px 10px; cursor:pointer; border-radius:12px;
    border-bottom:1px solid #f2f1ed;
  }
  .dlist li:hover{background:var(--bg)}
  .dlist li:active{background:#eceae3; transform:scale(.985)}
  .dlist .pill2{
    width:44px; height:44px; border-radius:50%; display:grid; place-items:center;
    font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.08);
  }
  .dlist .dn{font-size:15px; font-weight:600; color:var(--ink); line-height:1.25}
  .dlist .ds{font-size:12px; color:var(--ink3); margin-top:2px}
  .dlist .chev2{color:var(--ink3); font-size:17px; text-align:right}

  .prompt{
    display:flex; align-items:center; gap:9px; background:#eef4fb;
    border:1px solid #d6e4f4; border-radius:12px; padding:11px 13px; margin:0 0 14px;
  }
  .prompt b{font-size:13.5px; color:#12467e; font-weight:700; white-space:nowrap; flex:0 0 auto}
  .prompt span{font-size:12.5px; color:#2a5f9e; line-height:1.5}

  /* ---------- onboarding ---------- */
  #intro{

  .card ol b{color:var(--ink)}

  .card button{

    font-size:11px; color:#1a1a1a; white-space:nowrap; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;

  @media (min-width:760px){

           transform:translateY(calc(100% - 62px)); max-height:min(80vh,700px)}
    #sheet.open{transform:translateY(0)}

</style>
</head>
<body>

<div id="intro">
  <div class="card">
    <h1>香港風水地圖</h1>
    <p class="tag">三元九運 · 第九運（2024–2043）</p>

      <li><b>搜尋</b>屋苑或地址，或者直接喺地圖揾</li>
      <li><b>放大</b>之後每棟樓都會上色，顏色越深風水分越高</li>
      <li><b>撳一撳</b>任何一棟樓，睇佢嘅評分拆解</li>
    </ol>
    <p class="warn">評分根據公開地理數據同三元九運山水方位計算，屬於「外巒頭」地理分析，並唔包括坐向飛星盤或室內風水。僅供參考，不構成置業建議。</p>
    <button id="introGo">開始</button>
  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================================
   Data sources
   basemap/label tiles : Lands Department  (mapapi.geodata.gov.hk, no key)
   address lookup      : Digital Policy Office ALS (als.gov.hk, no key)
   scores + footprints : our own pipeline, rebuilt daily from CSDI
   ========================================================================= */
const ALS  = "https://www.als.gov.hk/lookup";
const TILE = "https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz";
const DATA = "data/tiles";
// Bump on every release. Shown in the overview sheet so a stale cached page is
// identifiable at a glance — otherwise there is no way to tell.
const APP_VERSION = "v12";

// ---------------------------------------------------------------------------
// Analytics
//
// GA_ID stays empty until a real measurement ID is pasted in; track() is then
// a no-op, so nothing breaks and nothing is sent. Every call goes through this
// one function so the provider can be swapped without touching call sites.
// ---------------------------------------------------------------------------
const GA_ID = "";            // e.g. "G-XXXXXXXXXX"

function track(event, params){
  try{
    if (window.gtag) window.gtag("event", event, params || {});
    if (!GA_ID) console.debug("[track]", event, params || {});
  }catch{}
}

(function initAnalytics(){
  if(!GA_ID) return;
  const sc = document.createElement("script");
  sc.async = true;
  sc.src = "https://www.googletagmanager.com/gtag/js?id=" + GA_ID;
  document.head.appendChild(sc);
  window.dataLayer = window.dataLayer || [];
  window.gtag = function(){ window.dataLayer.push(arguments); };
  gtag("js", new Date());
  // anonymize_ip keeps this the least intrusive configuration that still
  // answers "how many, how long, doing what".
  gtag("config", GA_ID, {anonymize_ip: true, app_version: APP_VERSION});
})();

// How long people actually stay, reported once on the way out. Without this
// a session that ends by closing the tab reports no duration at all.
(function trackEngagement(){
  const start = Date.now();
  let sent = false;
  const flush = () => {
    if(sent) return;
    sent = true;
    track("session_length", {seconds: Math.round((Date.now()-start)/1000)});
  };
  addEventListener("visibilitychange", () => { if(document.hidden) flush(); });
  addEventListener("pagehide", flush);
})();

// Data files are rebuilt daily at the same URLs, so a browser holding
// yesterday's copy keeps serving it - silently, and indefinitely. Every data
// fetch therefore carries the build stamp as a query token: same build, same
// URL, cache hit; new build, new URL, fresh fetch. Without this the daily
// rebuild never reaches anyone who has already visited once.
let DATA_TOKEN = "";
const dataUrl = path => DATA + "/" + path + (DATA_TOKEN ? "?v=" + DATA_TOKEN : "");

let buildInfo = null;
async function loadBuildStamp(){
  if (buildInfo) return buildInfo;
  try{
    const r = await fetch(DATA + "/build.json", {cache: "no-store"});
    buildInfo = await r.json();
    DATA_TOKEN = (buildInfo.built || "").replace(/[^0-9]/g, "");
  }catch{ buildInfo = {}; }
  return buildInfo;
}
const TILE_Z = 14;              // must match pipeline/build_tiles.py
// Buildings render from z14, the zoom a district lands on — picking a district
// and seeing bubbles instead of buildings is not what "show me the good ones
// here" means. ~2,000 polygons at that zoom, which is why the layer draws to
// canvas rather than SVG.
const BUILDING_ZOOM = 14;

// Tile rows arrive as arrays; COLUMNS in build_tiles.py is the contract.
let COLS = null;
function rowToObj(row){
  const o = {};
  for(let i=0;i<COLS.length;i++) o[COLS[i]] = row[i];
  return o;
}
// Footprints are stored as a first vertex plus integer deltas of 1e-5 degrees.
function decodeRing(enc){
  if(!enc || enc.length < 6) return null;
  let lon = enc[0], lat = enc[1];
  const pts = [[lat, lon]];
  let x = Math.round(lon*1e5), y = Math.round(lat*1e5);
  for(let i=2;i<enc.length;i+=2){
    x += enc[i]; y += enc[i+1];
    pts.push([y/1e5, x/1e5]);
  }
  return pts;
}

// ---------------------------------------------------------------------------
// Diverging scale: red = below average, neutral = middle, teal = above.
//
// A single-hue blue ramp (the earlier version) encodes magnitude but not
// polarity — you cannot tell good from bad without consulting a legend, which
// is exactly the failure this replaces. A diverging scale carries the verdict
// in the hue itself.
//
// Validated with the data-viz palette checker against a white surface:
// worst adjacent CVD ΔE 19.9 (deutan) and normal-vision ΔE 20.5, against
// thresholds of 8 and 15. The neutral hinge is deliberately low-chroma — that
// is what keeps the two pale ends from colliding under colour blindness, and
// it is why an amber bridge (the obvious "traffic light") had to be dropped:
// amber against yellow-green measured ΔE 2.6.
//
// 50 is the Hong Kong median, so the hinge sits on the middle band.
// ---------------------------------------------------------------------------
const BREAKS = [41, 46, 52, 58];
const RAMP   = ["#a01f1f", "#d76f6f", "#e6e4de", "#4da79a", "#0f6354"];
const NODATA = "#cfcdc6";

const LEVELS = [
  {max: 41,       label: "差",   sub: "全港最低約兩成",   ink: "#fff"},
  {max: 46,       label: "欠佳", sub: "低於全港中位",     ink: "#fff"},
  {max: 52,       label: "平穩", sub: "接近全港中位",     ink: "#3a3833"},
  {max: 58,       label: "吉",   sub: "高於全港中位",     ink: "#fff"},
  {max: Infinity, label: "大吉", sub: "全港最高約一成",   ink: "#fff"},
];

function levelFor(v){
  if (v == null || isNaN(v)) return null;
  return LEVELS[BREAKS.findIndex(b => v < b) === -1 ? LEVELS.length - 1
                                                    : BREAKS.findIndex(b => v < b)];
}
const colorFor = v => {
  if (v == null || isNaN(v)) return NODATA;
  const i = BREAKS.findIndex(b => v < b);
  return RAMP[i === -1 ? RAMP.length - 1 : i];
};
const inkOn = v => (levelFor(v) || {}).ink || "#3a3833";

// Which score band the filter chips are showing. Bounds mirror BREAKS.
const BANDS = {
  all:    null,
  best:   v => v >= 58,
  "good+":v => v >= 52,
  mid:    v => v >= 46 && v < 52,
  poor:   v => v >= 41 && v < 46,
  bad:    v => v < 41,
};
const BAND_KEY = {best:"best", "good+":"good", mid:"mid", poor:"poor", bad:"bad"};
let band = "all";
let districtFilter = "";        // "" = whole territory
// Defensive: an unknown band must degrade to "show everything" rather than
// throw, or one bad value takes the whole panel down with it.
const passesFilter = v => {
  const test = BANDS[band];
  return typeof test !== "function" || (v != null && test(v));
};

function verdict(v){
  const l = levelFor(v);
  return l ? [l.label, l.sub] : ["未有評分", ""];
}

const DIR_TC={N:"北",NE:"東北",E:"東",SE:"東南",S:"南",SW:"西南",W:"西",NW:"西北"};
const dirTC = d => (d&&DIR_TC[d]) ? DIR_TC[d] : "—";
const num = (v,d=1)=> (v==null||isNaN(v)) ? "—" : Number(v).toFixed(d);
const clean = s => (!s||s==="N/A"||s==="NULL"||!String(s).trim()) ? null : String(s).trim();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------------------------------------------------------- map --- */
const map = L.map("map",{
  center:[22.3450,114.1400], zoom:11, minZoom:10, maxZoom:19,
  maxBounds:[[22.10,113.78],[22.62,114.47]], maxBoundsViscosity:.9,
  zoomControl:false, attributionControl:true,
});
L.control.attribution({prefix:false}).addTo(map);

// Proper cartographic stack. The topographic basemap is busy — contours,
// road fills, its own colour — so it gets muted by CSS and the place labels are
// lifted ABOVE the building polygons, which keeps street names readable instead
// of being painted over.
map.createPane("labels");
map.getPane("labels").style.zIndex = "640";
map.getPane("labels").style.pointerEvents = "none";

const ATTR = 'Map from Lands Department · 樓宇資料 CSDI · 評分自行計算';
const labelLayer = () => L.tileLayer(TILE+"/label/hk/tc/WGS84/{z}/{x}/{y}.png",
  {minZoom:10, maxZoom:19, pane:"labels", opacity:.92});

const bases = {
  street: L.layerGroup([
    L.tileLayer(TILE+"/basemap/WGS84/{z}/{x}/{y}.png",{minZoom:10,maxZoom:19,attribution:ATTR,className:"muted-base"}),
    labelLayer(),
  ]),
  satellite: L.layerGroup([
    L.tileLayer(TILE+"/imagery/WGS84/{z}/{x}/{y}.png",{minZoom:10,maxZoom:19,attribution:ATTR,className:"muted-sat"}),
    labelLayer(),
  ]),
};
let currentBase = "street";
bases.street.addTo(map);

function setBase(name){
  Object.values(bases).forEach(l=>map.removeLayer(l));
  bases[name].addTo(map);
  currentBase = name;
  markBase(name);
  buildingLayer.bringToFront();
}
function markBase(name){
  document.querySelectorAll('#layers button[data-base]').forEach(b=>
    b.classList.toggle('sel', b.dataset.base===name));
}

/* -------------------------------------------------------------- toast --- */
const toastEl=document.getElementById("toast"); let toastT=null;
function toast(msg,ms=2200){
  clearTimeout(toastT);
  if(!msg){toastEl.classList.remove("show");return;}
  toastEl.textContent=msg; toastEl.classList.add("show");
  if(ms) toastT=setTimeout(()=>toastEl.classList.remove("show"),ms);
}

/* ---------------------------------------------------- building layer --- */
let minSel=null, reqSeq=0;
const tileCache = new Map();

// Canvas keeps ~2,000 footprints smooth on a phone; SVG creates a DOM node per
// building and stutters well before that.
const buildingRenderer = L.canvas({padding: 0.3});
const buildingLayer=L.layerGroup().addTo(map);

function styleFor(score){
  const c = colorFor(score);
  return {renderer:buildingRenderer, fillColor:c, fillOpacity:.88,
          color:c, weight:.6, opacity:.55};
}

// Selection is drawn as its own two-ring halo in a pane above everything, so it
// reads against a dark fill, a light fill, or the satellite image alike.
map.createPane("highlight");
map.getPane("highlight").style.zIndex = "645";
map.getPane("highlight").style.pointerEvents = "none";
const highlight = L.layerGroup([], {pane:"highlight"}).addTo(map);

function showHighlight(latlngs, centre){
  highlight.clearLayers();
  if(!latlngs && !centre) return;
  if(latlngs){
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#12161c",weight:6,
                       opacity:.5,lineJoin:"round"}).addTo(highlight);
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#ffffff",weight:2.5,
                       opacity:1,lineJoin:"round"}).addTo(highlight);
  }
  // A small building is only a few pixels across, so the outline alone is easy
  // to lose. An accent dot makes the selection unmistakable at any zoom.
  L.circleMarker(centre,{pane:"highlight", radius:7, color:"#ffffff", weight:2.5,
                         fillColor:"#e0562a", fillOpacity:1}).addTo(highlight);
}

function lonLat2tile(lon,lat,z){
  const n=2**z, rad=lat*Math.PI/180;
  return [Math.floor((lon+180)/360*n),
          Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n)];
}

async function getTile(x,y){
  const key=`${x}/${y}`;
  if(tileCache.has(key)) return tileCache.get(key);
  const pr = fetch(dataUrl(`${TILE_Z}/${x}/${y}.json`))
    .then(r => r.ok ? r.json() : null)
    .catch(() => null);
  tileCache.set(key, pr);
  return pr;
}

async function loadBuildings(){
  const z=map.getZoom();
  if(z<BUILDING_ZOOM){ buildingLayer.clearLayers(); return; }
  districtLayer.clearLayers();

  const b=map.getBounds(), my=++reqSeq;
  const [x0,y1]=lonLat2tile(b.getWest(), b.getNorth(), TILE_Z);
  const [x1,y0]=lonLat2tile(b.getEast(), b.getSouth(), TILE_Z);

  const wanted=[];
  for(let x=x0;x<=x1;x++) for(let y=y1;y<=y0;y++) wanted.push([x,y]);
  if(wanted.length>20){ toast("範圍太大，請放大啲"); return; }

  const tiles=await Promise.all(wanted.map(([x,y])=>getTile(x,y)));
  if(my!==reqSeq) return;

  buildingLayer.clearLayers();
  let n=0, selLayer=null;
  for(const t of tiles){
    if(!t) continue;
    COLS = t.c;
    for(const row of t.b){
      const o=rowToObj(row);
      if(!b.contains([o.lat,o.lon])) continue;
      if(!passesFilter(o.total)) continue;
      const ring=decodeRing(o.ring);
      const lyr = ring
        ? L.polygon(ring, styleFor(o.total))
        : L.circleMarker([o.lat,o.lon], {...styleFor(o.total), radius:5});
      lyr.on("click",()=>select(o,lyr));
      lyr.on("mouseover",()=>{ if(o.id!==minSel) lyr.setStyle({weight:1.6,opacity:1}); });
      lyr.on("mouseout", ()=>{ if(o.id!==minSel) lyr.setStyle(styleFor(o.total)); });
      lyr.addTo(buildingLayer);
      if(o.id===minSel) selLayer={o,lyr};
      n++;
    }
  }
  if(selLayer) showHighlight(selLayer.lyr.getLatLngs ? selLayer.lyr.getLatLngs() : null,
                             [selLayer.o.lat, selLayer.o.lon]);
  if(n===0) toast(band==="all" ? "此範圍未有收錄樓宇" : "此範圍冇符合條件嘅樓宇");
  else if(band!=="all") toast(`${n.toLocaleString()} 棟符合`);
}

/* -------------------------------------------------- district overview --- */
const districtLayer=L.layerGroup().addTo(map);
let districtData=[];
function bandCount(a){
  if(band==="all") return a.n;
  const b=a.bands||{};
  return band==="good+" ? (b.good||0)+(b.best||0) : (b[BAND_KEY[band]]||0);
}
// The chip carries a count badge; the label is the text node before it.
const chipLabel = () => {
  const c = document.querySelector(`#filters .chip[data-band="${band}"]`);
  if(!c) return "";
  return [...c.childNodes]
    .filter(n => n.nodeType === Node.TEXT_NODE)
    .map(n => n.textContent.trim()).join("") || "";
};

async function loadDistricts(){
  try{
    districtData = await (await fetch(dataUrl('../district_stats.json'))).json();
    updateChipCounts();
    drawDistricts();
    if(!minSel) showOverview();
  }catch(e){ toast("分區數據載入失敗"); }
}
function drawDistricts(){
  districtLayer.clearLayers();
  if(map.getZoom()>=BUILDING_ZOOM) return;
  districtData.forEach(a=>{
    const c=[a.lat,a.lon];
    // With a filter on, the useful number is how many buildings there MATCH,
    // not the district average - that is what "where is the good stock" means.
    const cnt = bandCount(a);
    const shown = band==="all" ? a.avg.toFixed(0) : cnt.toLocaleString();
    const tint  = band==="all" ? colorFor(a.avg) : RAMP[["bad","poor","mid","good","best"]
                    .indexOf(BAND_KEY[band])];
    const size  = band==="all" ? 40 : Math.max(34, Math.min(54, 30 + Math.sqrt(cnt)));
    const icon=L.divIcon({
      className:"", iconSize:[size,size], iconAnchor:[size/2,size/2],
      html:`<div class="dmark" style="width:${size}px;height:${size}px;background:${tint};
                  color:${band!=="all"&&BAND_KEY[band]==="mid"?"#3a3833":"#fff"}">${shown}
              <div class="dlabel">${a.tc.replace("區","")}</div></div>`,
    });
    L.marker(c,{icon}).addTo(districtLayer)
      .on("click",()=>{ map.flyTo(c,BUILDING_ZOOM,{duration:.8});
                        toast(band==="all"
                          ? `${a.tc} 平均 ${a.avg.toFixed(1)} 分 · ${a.n.toLocaleString()} 棟`
                          : `${a.tc} ${chipLabel()} ${cnt.toLocaleString()} 棟`); });
  });
}

/* --------------------------------------------------------- the sheet --- */
const sheet=document.getElementById("sheet");
const sheetBody=document.getElementById("sheetbody");
const gripText=document.getElementById("griptext");
document.getElementById("grip").addEventListener("click",()=>sheet.classList.toggle("open"));

function openSheet(){ sheet.classList.add("open"); }

function select(o,layer){
  minSel=o.id;
  track("view_building", {
    name: (o.tc || o.en || "unnamed"),
    district: o.district || "",
    score: Math.round(o.total || 0),
    grade: (levelFor(o.total)||{}).label || "",
    now: o.now || "",
  });
  showHighlight(layer && layer.getLatLngs ? layer.getLatLngs() : null, [o.lat,o.lon]);
  renderBuilding(o, layer);
  openSheet();
}

// The mountain/water pairing table, with this building's own row highlighted.
// Showing it makes the "8/9" figure above concrete instead of arbitrary.
const MWDS_ROWS = [
  [9,"南","北"],[8,"北","南"],[7,"西南","東北"],[6,"東","西"],[5,"東南","西北"],
  [3,"西北","東南"],[2,"西","東"],[1,"東北","西南"],
];
function mwdsTable(o){
  const mine = o.mwds8 || 0;
  return `<table class="mwds"><thead><tr><th>山喺</th><th>水喺</th><th>分</th></tr></thead><tbody>` +
    MWDS_ROWS.map(([sc,m,w])=>
      `<tr class="${sc===mine?'hit':''}"><td>${m}</td><td>${w}</td><td>${sc}</td></tr>`).join("") +
    `<tr class="${mine===0?'hit':''} zero"><td colspan="2">以上以外嘅組合</td><td>0</td></tr>` +
    `</tbody></table>`;
}

const PATTERN_NOTE = {
  "旺山旺向":"丁財兩旺", "上山下水":"損丁破財",
  "雙星到向":"旺財不旺丁", "雙星到坐":"旺丁不旺財", "其他":"非四大格局",
};
// Same red-bad / teal-good logic as the score, so the 理氣 verdict does not
// need its own legend either.
const NOW_TONE = {

function renderBuilding(o, layer){
  const title = clean(o.tc) || clean(o.en) || "未命名樓宇";
  const t = o.total, [vd,vs] = verdict(t);
  gripText.textContent = `${title} · ${num(t,1)} 分`;

  // Each component is coloured on the same scale as the headline, so a weak
  // 配套 is visibly red next to a healthy 環境 without reading any numbers.
  const bar=(lb,v)=>`<div class="r"><span class="lb">${lb}</span>
    <div class="tk"><div class="fl" style="width:${Math.max(3,Math.min(100,v||0))}%;background:${colorFor(v)}"></div></div>
    <span class="vl" style="color:${v!=null&&v<41?"#a01f1f":"inherit"}">${num(v,0)}</span></div>`;

  // 理氣 is only shown where both inputs are trustworthy. A near-square
  // footprint gives no reliable long axis, and without an occupation permit
  // there is no 元運 — inventing either would produce a chart that looks
  // authoritative and is not.
  let liqi;
  if (o.pattern && o.conf >= 0.6) {
    liqi = `
      <div class="liqi">
        <div class="liqi-hd">九運當下</div>
        <p class="liqi-now t-${NOW_TONE[o.now]||"mid"}">${esc(o.now||"—")}</p>
        <p class="liqi-sub">${esc(NOW_NOTE[o.now]||"")}</p>
        <dl class="facts" style="margin-top:12px">
          <dt>坐向</dt><dd>${esc(o.sit_m||"?")}山${esc(o.face_m||"?")}向　${num(o.facing,0)}°</dd>
          <dt>建成元運</dt><dd>${o.period?`${o.period}運`:"—"}${o.op_year?`（${o.op_year} 年入伙）`:""}</dd>
          <dt>本命格局</dt><dd>${esc(o.pattern)}　${esc(PATTERN_NOTE[o.pattern]||"")}</dd>
        </dl>
        <p class="liqi-warn">坐向由樓宇外形推算，誤差約 ±10–20°，可能差一個山。唔係羅盤實測。</p>
      </div>`;
  } else {
    const why = !o.op_year ? "查唔到入伙年份，未能定元運"
              : "樓宇外形接近方形，坐向推算唔可靠";
    liqi = `<div class="liqi liqi-none"><div class="liqi-hd">九運當下</div>
            <p class="liqi-sub">未能起盤 — ${why}。</p></div>`;
  }

  sheetBody.innerHTML=`

      <div>
        <p class="verdict" style="background:${colorFor(t)};color:${inkOn(t)}">${vd}</p>
        <p class="vsub">${vs} · 地理環境 ${num(t,1)} / 100</p>
      </div>
    </div>
    <div class="bars">${bar("環境",o.env)}${bar("交通",o.traffic)}${bar("配套",o.ancil)}</div>
    ${liqi}
    <dl class="facts">
      <dt>山在</dt><dd>${dirTC(o.mt_dir)}方　${num(o.mt_d,0)} 米</dd>
      <dt>水在</dt><dd>${dirTC(o.wt_dir)}方　${num(o.wt_d,0)} 米</dd>

      <dt>樓高</dt><dd>${num(o.h,0)} 米${o.storeys?`　${num(o.storeys,0)} 層`:""}</dd>

  const bs = sheetBody.querySelector("#btnSave");

  sheetBody.querySelectorAll(".mlist li").forEach(li=>li.addEventListener("click",()=>{
    const o = sorted[+li.dataset.i];

/* ---------------------------------------------------------- searching --- */
const qEl=document.getElementById("q"), resEl=document.getElementById("results"), clearBtn=document.getElementById("clear");
let searchT=null;
qEl.addEventListener("input",()=>{
  clearBtn.style.display=qEl.value?"block":"none";
  clearTimeout(searchT);
  if(qEl.value.trim().length<2){ resEl.classList.remove("show"); return; }
  searchT=setTimeout(doSearch,320);
});
qEl.addEventListener("keydown",e=>{ if(e.key==="Enter"){ clearTimeout(searchT); doSearch(); qEl.blur(); }});
clearBtn.addEventListener("click",()=>{ qEl.value=""; clearBtn.style.display="none"; resEl.classList.remove("show"); qEl.focus(); });
document.addEventListener("click",e=>{ if(!document.getElementById("searchwrap").contains(e.target)) resEl.classList.remove("show"); });

let searchIndex=null, searchLoading=null;
async function ensureIndex(){
  if(searchIndex) return searchIndex;
  if(!searchLoading){
    searchLoading = fetch(dataUrl('search.json')).then(r=>r.json()).then(d=>{
      searchIndex = d.b.map(row=>{
        const o={}; d.c.forEach((k,i)=>o[k]=row[i]); return o;
      });
      return searchIndex;
    }).catch(()=>{ searchIndex=[]; return searchIndex; });
  }
  return searchLoading;
}

async function doSearch(){
  const q=qEl.value.trim(); if(q.length<2) return;
  resEl.innerHTML=`<li class="empty">搜尋中…</li>`; resEl.classList.add("show");

  const idx=await ensureIndex();
  const needle=q.toLowerCase();
  track("search", {term: q});
  const hits=[];
  for(const o of idx){
    if((o.tc && o.tc.includes(q)) || (o.en && o.en.toLowerCase().includes(needle))){
      hits.push(o);
      if(hits.length>=12) break;
    }
  }
  if(hits.length){ renderHits(hits); return; }

  const als=await searchALS(q);
  if(als.length){ renderHits(als); return; }
  resEl.innerHTML=`<li class="empty">搵唔到「${esc(q)}」，試下屋苑名或街道名。</li>`;
}

// Falls back to the Government address service when a name is not in our
// index - covers street addresses and estates whose block names differ.
async function searchALS(q){
  try{
    const d=await (await fetch(`${ALS}?q=${encodeURIComponent(q)}&n=8`,
                               {headers:{Accept:"application/json"}})).json();
    return (d.SuggestedAddress||[]).map(s=>{
      const pa=s.Address.PremisesAddress, c=pa.ChiPremisesAddress||{}, en=pa.EngPremisesAddress||{};
      const g=pa.GeospatialInformation||{}, st=c.ChiStreet||{};
      return { kind:"als", total:null,
        tc:c.BuildingName||en.BuildingName||((st.StreetName||"")+(st.BuildingNoFrom||"")),
        note:[(c.ChiEstate||{}).EstateName,
              (st.StreetName||"")+(st.BuildingNoFrom?` ${st.BuildingNoFrom}號`:""),
              (c.ChiDistrict||{}).DcDistrict].filter(Boolean).join(" · "),
        lat:+g.Latitude, lon:+g.Longitude };
    }).filter(x=>x.lat&&x.lon);
  }catch{ return []; }
}

function renderHits(hits){
  resEl.innerHTML=hits.map((h,i)=>{
    const name=clean(h.tc)||clean(h.en)||h.name||"—";
    const note=[clean(h.district), h.note, h.now].filter(Boolean).join(" · ");
    return `<li data-i="${i}">
      ${h.total!=null?`<span class="pill" style="background:${colorFor(h.total)}">${h.total.toFixed(0)}</span>`:""}
      <div class="nm">${esc(name)}</div><div class="ad">${esc(note)}</div></li>`;
  }).join("");
  [...resEl.querySelectorAll("li[data-i]")].forEach(li=>
    li.addEventListener("click",()=>goto(hits[+li.dataset.i])));
}

function goto(h){
  resEl.classList.remove("show"); qEl.blur();
  const lat=h.lat, lon=h.lon!==undefined?h.lon:h.lng;
  map.setView([lat,lon],17);
  if(h.kind==="als"){
    L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,
                              fillColor:"#e0562a",fillOpacity:1}).addTo(map);
    toast("撳附近嘅樓宇睇評分");
  }
  // Let the tiles land, then pick out the building that was searched for.
  loadBuildings().then(()=>{
    let best=null, bestD=Infinity;
    buildingLayer.eachLayer(l=>{
      const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
      const d=(c.lat-lat)**2+(c.lng-lon)**2;
      if(d<bestD){ bestD=d; best=l; }
    });
    if(best && bestD < 1e-7) best.fire("click");
  });
}

// ---------------------------------------------------------------------------
// Saved buildings
//
// Kept in localStorage, so there is nothing to sign up for. A shortlist is
// worth more shared than stored, so it also encodes into a link.
// ---------------------------------------------------------------------------
const FAV_KEY = "fs_favs_v1";
let favs = [];
try{ favs = JSON.parse(localStorage.getItem(FAV_KEY) || "[]"); }catch{ favs = []; }

const favKeyOf = o => `${(+o.lat).toFixed(5)},${(+o.lon).toFixed(5)}`;
const isFav = o => favs.some(f => favKeyOf(f) === favKeyOf(o));

function saveFavs(){
  try{ localStorage.setItem(FAV_KEY, JSON.stringify(favs)); }catch{}
  const chip = document.getElementById("btnFav");
  chip.innerHTML = `<span class="hrt">♥</span>收藏` +
    (favs.length ? `<span class="cnt">${favs.length}</span>` : "");
  chip.classList.toggle("on", favView);
}

function toggleFav(o){
  const k = favKeyOf(o);
  const i = favs.findIndex(f => favKeyOf(f) === k);
  if(i >= 0){ favs.splice(i,1); track("unsave_building", {name:o.tc||o.en||""}); }
  else{
    favs.push({tc:o.tc, en:o.en, district:o.district, lat:o.lat, lon:o.lon,
               total:o.total, now:o.now});
    track("save_building", {name:o.tc||o.en||"", score:Math.round(o.total||0),
                            total_saved: favs.length});
  }
  saveFavs();
}

// Sharing
//
// Links carry coordinates rather than ids: a shortlist of ten buildings stays
// short enough to paste into WhatsApp, and nothing has to be looked up on the
// far side before the map can show it.

const pack = list => list.map(o => `${(+o.lat).toFixed(5)},${(+o.lon).toFixed(5)}`).join(";");

function shareUrl(params){
  const u = new URL(location.href.split("?")[0].split("#")[0]);
  Object.entries(params).forEach(([k,v]) => u.searchParams.set(k,v));
  return u.toString();
}

async function doShare(title, text, url, what){
  track("share", {what, url});
  try{
    if(navigator.share){ await navigator.share({title, text, url}); return; }
  }catch{ return; }               // user dismissed the sheet - not a failure
  try{
    await navigator.clipboard.writeText(`${text}\n${url}`);
    toast("已複製連結，可以貼上分享");
  }catch{ prompt("複製呢條連結分享：", url); }
}

function shareBuilding(o){
  const name = clean(o.tc) || clean(o.en) || "呢棟樓";
  const lvl = (levelFor(o.total)||{}).label || "";
  // The text is written to make the reader want to check their own home —
  // that is the whole mechanism by which this spreads.
  doShare("香港風水地圖",
    `${name} 風水 ${num(o.total,0)} 分（${lvl}）${o.now ? " · 九運" + o.now : ""}。你屋企幾多分？`,
    shareUrl({b: pack([o])}), "building");
}

function shareList(){
  if(!favs.length) return;
  const top = favs.slice(0,3).map(f => clean(f.tc)||clean(f.en)).filter(Boolean).join("、");
  doShare("我揀咗嘅樓盤",
    `我用香港風水地圖揀咗 ${favs.length} 個樓盤${top ? "：" + top : ""}${favs.length>3 ? " 等" : ""}。撳入去睇晒評分同九運格局。`,
    shareUrl({list: pack(favs)}), "list");
}

// --- district picker ---
function buildDistrictMenu(){
  const m = document.getElementById("districtMenu");
  const rows = [...districtData].sort((a,b)=>bandCount(b)-bandCount(a));
  m.innerHTML =
    `<button data-d="" class="${districtFilter===""?"sel":""}"><b>全港</b>` +
    `<span>${rows.reduce((s,a)=>s+bandCount(a),0).toLocaleString()}</span></button>` +
    `<div class="dsep"></div>` +
    rows.map(a=>`<button data-d="${esc(a.tc)}" class="${districtFilter===a.tc?"sel":""}">
        <b>${esc(a.tc)}</b><span>${bandCount(a).toLocaleString()}</span></button>`).join("");
  m.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    districtFilter = b.dataset.d;
    track("filter_district", {district: districtFilter || "all", from: "picker"});
    m.classList.remove("show");
    const chip = document.getElementById("btnDistrict");
    chip.innerHTML = '<b>地區</b>' + (districtFilter || "全港") + ' <span class="caret">▾</span>';
    chip.classList.toggle("on", !!districtFilter);
    const d = districtData.find(x=>x.tc===districtFilter);
    if(d) map.flyTo([d.lat,d.lon], 14, {duration:.9});
    minSel = null; highlight.clearLayers();
    drawDistricts(); showOverview(); openSheet();
  }));
}
document.getElementById("btnDistrict").addEventListener("click",e=>{
  e.stopPropagation();
  buildDistrictMenu();
  document.getElementById("districtMenu").classList.toggle("show");
});
document.addEventListener("click",e=>{
  const m=document.getElementById("districtMenu");
  if(!m.contains(e.target) && !document.getElementById("btnDistrict").contains(e.target))
    m.classList.remove("show");
});

// Matching buildings, straight from the search index — it already carries name,
// district, score and coordinates, so no extra download is needed to answer
// "show me the good ones here".
const MATCH_LIMIT = 150;
let homesOnly = true;      // a property search should not open with warehouses
function matches(){
  if(!searchIndex) return null;
  return searchIndex.filter(o =>
    (!districtFilter || o.district === districtFilter) &&
    passesFilter(o.total) &&
    (!homesOnly || o.res !== 0));
}

function renderMatches(list){
  const shown = list.slice(0, MATCH_LIMIT);
  const where = districtFilter || "全港";
  const what  = band === "all" ? "所有評分" : chipLabel();
  // The list can only show buildings that carry a name; the map and the
  // district bubbles count every matching footprint. Saying both numbers
  // avoids the two looking like a contradiction.
  const mapped = districtFilter
    ? bandCount(districtData.find(d=>d.tc===districtFilter) || {})
    : districtData.reduce((n,d)=>n+bandCount(d), 0);
  const unnamed = Math.max(0, mapped - list.length);
  gripText.textContent = `${where} · ${what} · ${list.length.toLocaleString()} 棟`;
  sheetBody.innerHTML = `
    <p class="bname">${esc(where)} · ${esc(what)}</p>
    <p class="mcount">${list.length.toLocaleString()} 棟符合，按分數由高至低排列。撳一下跳去該幢樓。${
      unnamed ? `<br>另有未命名樓宇未計在內，可以直接喺地圖撳。` : ""}</p>
    <label class="homes"><input type="checkbox" id="homesOnly" ${homesOnly?"checked":""}>
      <span>只顯示住宅樓宇</span></label>
    <ul class="mlist">${shown.map((o,i)=>`
      <li data-i="${i}">
        <div class="sc" style="background:${colorFor(o.total)};color:${inkOn(o.total)}">${num(o.total,0)}</div>
        <div><div class="nm">${esc(clean(o.tc)||clean(o.en)||"未命名樓宇")}</div>
             <div class="mt">${esc([clean(o.district), o.now].filter(Boolean).join(" · "))}</div></div>
        <div class="go">›</div>
      </li>`).join("")}</ul>
    ${list.length > MATCH_LIMIT
      ? `<p class="mmore">只顯示分數最高嘅 ${MATCH_LIMIT} 棟，收窄地區或評分條件可以睇到更多。</p>` : ""}
    <p class="note-foot" style="border-top:1px solid var(--line)">
      地理環境分屬「外巒頭」分析，唔包括單位樓層同室內佈局。僅供參考，不構成置業建議。
    </p>
    <p class="build" id="buildStamp">${APP_VERSION}</p>`;
  fillBuildStamp();
  const hb = sheetBody.querySelector("#homesOnly");
  if(hb) hb.addEventListener("change",()=>track("toggle_homes_only",{on:hb.checked}));
  if(hb) hb.addEventListener("change",()=>{ homesOnly = hb.checked; showOverview(); });
  sheetBody.querySelectorAll(".mlist li").forEach(li=>li.addEventListener("click",()=>{
    const o = shown[+li.dataset.i];
    map.setView([o.lat,o.lon], 18);
    setTimeout(()=>{
      let best=null, bd=Infinity;
      buildingLayer.eachLayer(l=>{
        const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
        const d=(c.lat-o.lat)**2+(c.lng-o.lon)**2;
        if(d<bd){ bd=d; best=l; }
      });
      if(best && bd < 1e-7) best.fire("click");
    }, 900);
  }));
}

// --- filter chips ---
document.querySelectorAll("#filters .chip[data-band]").forEach(c=>
  c.addEventListener("click",()=>{
    band = c.dataset.band;
    track("filter_grade", {grade: band});
    document.querySelectorAll("#filters .chip[data-band]").forEach(x=>x.classList.toggle("on", x===c));
    // A filter that hides the selected building would leave a stranded panel.
    if(minSel!=null && band!=="all"){ minSel=null; highlight.clearLayers(); }
    loadBuildings(); drawDistricts();
    if(!minSel) showOverview();
  }));

function updateChipCounts(){
  if(!districtData.length) return;
  const total = {};
  for(const a of districtData)
    for(const [k,v] of Object.entries(a.bands||{})) total[k]=(total[k]||0)+v;
  const sum = Object.values(total).reduce((x,y)=>x+y,0);
  document.querySelectorAll("#filters .chip[data-band]").forEach(c=>{
    const b=c.dataset.band;
    const n = b==="all" ? sum
            : b==="good+" ? (total.good||0)+(total.best||0)
            : (total[BAND_KEY[b]]||0);
    let el=c.querySelector(".cnt");
    if(!el){ el=document.createElement("span"); el.className="cnt"; c.appendChild(el); }
    el.textContent = n>=1000 ? `${(n/1000).toFixed(1)}k` : n.toLocaleString();
  });
}

document.getElementById("btnLayers").addEventListener("click",e=>{
  e.stopPropagation(); document.getElementById("layers").classList.toggle("show");
});
document.addEventListener("click",e=>{
  const l=document.getElementById("layers");
  if(!l.contains(e.target)&&e.target.id!=="btnLayers") l.classList.remove("show");
});
document.querySelectorAll('#layers button[data-base]').forEach(b=>
  b.addEventListener("click",()=>{ setBase(b.dataset.base); document.getElementById("layers").classList.remove("show"); }));

document.getElementById("btnLoc").addEventListener("click",()=>{
  if(!navigator.geolocation){ toast("此瀏覽器唔支援定位"); return; }
  toast("定位中…",6000);
  navigator.geolocation.getCurrentPosition(
    pos=>{
      const{latitude:la,longitude:ln}=pos.coords;
      if(la<22.1||la>22.62||ln<113.78||ln>114.47){ toast("你唔喺香港範圍內"); return; }
      map.setView([la,ln],17);
      L.circleMarker([la,ln],{radius:8,color:"#fff",weight:3,fillColor:"#1b4f8f",fillOpacity:1}).addTo(map);
      toast("已定位");
    },
    ()=>toast("定位失敗，請允許位置權限"),
    {enableHighAccuracy:true,timeout:8000});
});

document.getElementById("introGo").addEventListener("click",()=>{
  document.getElementById("intro").classList.add("hide");
  localStorage.setItem("seenIntro","1");
  openSheet();
});
if(localStorage.getItem("seenIntro")) document.getElementById("intro").classList.add("hide");

map.on("moveend zoomend",()=>{ loadBuildings(); drawDistricts(); });
// A shared link has to land somewhere meaningful, otherwise sharing is
// pointless: the recipient gets a generic map and never finds what was sent.
function unpack(str){
  return (str || "").split(";").map(pair=>{
    const [lat,lon] = pair.split(",").map(Number);
    return (isFinite(lat) && isFinite(lon)) ? {lat, lon} : null;
  }).filter(Boolean);
}

async function openDeepLink(){
  const q = new URLSearchParams(location.search);

  const one = unpack(q.get("b"))[0];
  if(one){
    track("open_shared", {what: "building"});
    localStorage.setItem("seenIntro","1");
    document.getElementById("intro").classList.add("hide");
    map.setView([one.lat, one.lon], 18);
    await loadBuildings();
    let best=null, bd=Infinity;
    buildingLayer.eachLayer(l=>{
      const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
      const d=(c.lat-one.lat)**2+(c.lng-one.lon)**2;
      if(d<bd){ bd=d; best=l; }
    });
    if(best && bd < 1e-6) best.fire("click");
    return true;
  }

  const many = unpack(q.get("list"));
  if(many.length){
    track("open_shared", {what: "list", count: many.length});
    localStorage.setItem("seenIntro","1");
    document.getElementById("intro").classList.add("hide");
    // Coordinates alone carry no names; the search index fills them in.
    await ensureIndex();
    sharedList = many.map(pt=>{
      let best=null, bd=Infinity;
      for(const o of searchIndex){
        const d=(o.lat-pt.lat)**2+(o.lon-pt.lon)**2;
        if(d<bd){ bd=d; best=o; }
      }
      // A link can be truncated in transit; say so rather than rendering a
      // scoreless row that looks like a broken building.
      return (best && bd < 1e-7) ? best
           : {tc:"搵唔到呢個位置嘅樓宇", en:null, ...pt, total:null, missing:true};
    });
    const missing = sharedList.filter(o=>o.missing).length;
    sharedList = sharedList.filter(o=>!o.missing);
    if(missing) setTimeout(()=>toast(`${missing} 個樓盤未能識別，連結可能唔完整`), 1200);
    if(!sharedList.length){ sharedList = null; return false; }
    const lat = many.reduce((a,p)=>a+p.lat,0)/many.length;
    const lon = many.reduce((a,p)=>a+p.lon,0)/many.length;
    map.setView([lat,lon], 14);
    showFavs(); openSheet();
    return true;
  }

  const d = q.get("d"), g = q.get("g");
  if(d || g){
    track("open_shared", {what: "filter"});
    if(g && BANDS[g] !== undefined){
      band = g;
      document.querySelectorAll("#filters .chip[data-band]")
        .forEach(x=>x.classList.toggle("on", x.dataset.band===g));
    }
    if(d){
      districtFilter = d;
      const chip = document.getElementById("btnDistrict");
      chip.innerHTML = '<b>地區</b>' + d + ' <span class="caret">▾</span>';
      chip.classList.add("on");
    }
    return false;            // let the normal flow render the filtered view
  }
  return false;
}

map.whenReady(async ()=>{
  await loadBuildStamp();      // must precede any data fetch: it sets the token
  saveFavs();
  const handled = await openDeepLink();
  loadDistricts();
  if(!handled) loadBuildings();
});
setTimeout(()=>{ if(localStorage.getItem("seenIntro")) openSheet(); },600);
</script>
