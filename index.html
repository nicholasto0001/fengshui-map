<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* =========================================================================
   Data sources
   basemap/label tiles : Lands Department  (mapapi.geodata.gov.hk, no key)
   address lookup      : Digital Policy Office ALS (als.gov.hk, no key)
   scores + footprints : our own pipeline, rebuilt daily from CSDI
   ========================================================================= */
// This trial never constructs a production member client.
const IS_TRIAL = location.hostname !== 'hkfengshuimap.com' && location.hostname !== 'www.hkfengshuimap.com';
if(IS_TRIAL){document.body.classList.add('trial','trial-focus');document.title='香港風水地圖';}
const ALS  = "https://www.als.gov.hk/lookup";
const TILE = "https://mapapi.geodata.gov.hk/gs/api/v1.0.0/xyz";
const DATA = "data/tiles";
// Bump on every release. Shown in the overview sheet so a stale cached page is
// identifiable at a glance — otherwise there is no way to tell.
const APP_VERSION = "v17";
// Replaced at deploy time by pipeline/stamp_build.py; "dev" when run locally.
const BUILD_ID = "dev";

// Measurement is shared with the static estate/district pages.
function track(event, params){ window.FSTrack?.track(event, params); }

// ---------------------------------------------------------------------------
// Keep visitors on the current build.
//
// HTML gets cached, so someone who visited last week can keep seeing last
// week's page forever with no hint that anything moved. version.json is
// fetched uncached and compared with the id baked into this file; a mismatch
// means a newer deploy exists and the page offers to pick it up.
// ---------------------------------------------------------------------------
let pendingBuild = null, dismissedBuild = null;
async function checkForUpdate(){
  if(BUILD_ID === "dev") return;               // local runs are never stale
  try{
    const v = await (await fetch("version.json", {cache:"no-store"})).json();
    const bar = document.getElementById("updatebar");
    if(!v.build || v.build === BUILD_ID || v.build === dismissedBuild){
      bar.hidden = true;
      return;
    }
    pendingBuild = v.build;
    track("update_available", {from: BUILD_ID, to: v.build});
    bar.hidden = false;
  }catch{}
}
addEventListener("load", () => setTimeout(checkForUpdate, 2500));
setInterval(checkForUpdate, 10 * 60 * 1000);
addEventListener("visibilitychange", () => { if(!document.hidden) checkForUpdate(); });

// How long people actually stay, reported once on the way out. Without this
// a session that ends by closing the tab reports no duration at all.
/* 一次到訪講晒成個故事。
   之前只報停留秒數，所以「100 個人入嚟、得 46 個撳過樓」呢件事要靠人手
   夾幾個數先砌得返出嚟，而且永遠唔知剩低嗰 54 個卡喺邊。而家離開嗰陣一次過
   報埋：有冇睇過教學、有冇搵過、搵唔搵到、有冇放大到見到樓、有冇撳過、
   有冇收藏、有冇分享。一條 GA 漏斗就起得返。 */
const trip = {buildings: 0, searches: 0, no_result: 0, zoomed: false,
              shared: false, saved: false, intro: false};

(function trackEngagement(){
  const start = Date.now();
  let sent = false;
  const flush = () => {
    if(sent) return;
    sent = true;
    const secs = Math.round((Date.now()-start)/1000);
    track("session_length", {seconds: secs});
    track("trip_summary", {
      seconds: secs,
      buildings: trip.buildings,
      searches: trip.searches,
      no_result: trip.no_result,
      zoomed_in: trip.zoomed,
      saw_intro: trip.intro,
      saved: trip.saved,
      shared: trip.shared,
      // 呢個先係要盯住嗰個：入咗嚟但一幢樓都冇撳過
      opened_nothing: trip.buildings === 0,
    });
  };
  addEventListener("visibilitychange", () => { if(document.hidden) flush(); });
  addEventListener("pagehide", flush);
})();

// Data files are rebuilt daily at the same URLs, so a browser holding
// yesterday's copy keeps serving it - silently, and indefinitely. Every data
// fetch therefore carries the build stamp as a query token: same build, same
// URL, cache hit; new build, new URL, fresh fetch. Without this the daily
// rebuild never reaches anyone who has already visited once.
let DATA_TOKEN = "";
const dataUrl = path => DATA + "/" + path + (DATA_TOKEN ? "?v=" + DATA_TOKEN : "");

let buildInfo = null;
// Which tiles actually exist. Hong Kong is mostly country park and water, so
// a viewport routinely asks for tiles that were never written — each one a
// wasted request and a 404 in the console. The index is tiny; consulting it
// first removes both.
// Tiles are not all at one zoom: dense ones are split until they fit, so the
// index lists leaves as "z/x/y" and the viewport descends to find them.
let tileSet = null, MAXZ = 16;
async function loadTileIndex(){
  if(tileSet) return tileSet;
  try{
    const idx = await (await fetch(dataUrl("index.json"))).json();
    MAXZ = idx.maxz || MAXZ;
    tileSet = idx.leaves
      ? new Set(Object.keys(idx.leaves))
      : new Set(Object.keys(idx.tiles || {}).map(k => `${TILE_Z}/${k}`));
  }catch{ tileSet = null; }      // unavailable: fall back to asking for each
  return tileSet;
}

// Which files actually cover this z14 square — itself, or the children it was
// split into. Returns nothing where Hong Kong is country park or water.
function leavesUnder(z, x, y){
  if(!tileSet) return [[TILE_Z, x, y]];
  if(tileSet.has(`${z}/${x}/${y}`)) return [[z, x, y]];
  if(z >= MAXZ) return [];
  const out = [];
  for(const [dx, dy] of [[0,0],[1,0],[0,1],[1,1]])
    out.push(...leavesUnder(z+1, x*2+dx, y*2+dy));
  return out;
}

async function loadBuildStamp(){
  if (buildInfo) return buildInfo;
  try{
    const r = await fetch(DATA + "/build.json", {cache: "no-store"});
    buildInfo = await r.json();
    DATA_TOKEN = (buildInfo.built || "").replace(/[^0-9]/g, "");
  }catch{ buildInfo = {}; }
  return buildInfo;
}
const TILE_Z = 14;              // must match pipeline/build_tiles.py
// Buildings render from z14, the zoom a district lands on — picking a district
// and seeing bubbles instead of buildings is not what "show me the good ones
// here" means. ~2,000 polygons at that zoom, which is why the layer draws to
// canvas rather than SVG.
const BUILDING_ZOOM = 14;

// Tile rows arrive as arrays; COLUMNS in build_tiles.py is the contract.
let COLS = null;
function rowToObj(row){
  const o = {};
  for(let i=0;i<COLS.length;i++) o[COLS[i]] = row[i];
  return o;
}
// Footprints are stored as a first vertex plus integer deltas of 1e-5 degrees.
function decodeRing(enc){
  if(!enc || enc.length < 6) return null;
  let lon = enc[0], lat = enc[1];
  const pts = [[lat, lon]];
  let x = Math.round(lon*1e5), y = Math.round(lat*1e5);
  for(let i=2;i<enc.length;i+=2){
    x += enc[i]; y += enc[i+1];
    pts.push([y/1e5, x/1e5]);
  }
  return pts;
}

// ---------------------------------------------------------------------------
// Diverging scale: red = below average, neutral = middle, teal = above.
//
// A single-hue blue ramp (the earlier version) encodes magnitude but not
// polarity — you cannot tell good from bad without consulting a legend, which
// is exactly the failure this replaces. A diverging scale carries the verdict
// in the hue itself.
//
// Validated with the data-viz palette checker against a white surface:
// worst adjacent CVD ΔE 19.9 (deutan) and normal-vision ΔE 20.5, against
// thresholds of 8 and 15. The neutral hinge is deliberately low-chroma — that
// is what keeps the two pale ends from colliding under colour blindness, and
// it is why an amber bridge (the obvious "traffic light") had to be dropped:
// amber against yellow-green measured ΔE 2.6.
//
// 50 is the Hong Kong median, so the hinge sits on the middle band.
// ---------------------------------------------------------------------------
const BREAKS = [41, 46, 52, 58];
const RAMP   = ["#a01f1f", "#d76f6f", "#e6e4de", "#4da79a", "#0f6354"];
const NODATA = "#cfcdc6";

const LEVELS = [
  {max: 41,       label: "差",   sub: "全港最低約兩成",   ink: "#fff"},
  {max: 46,       label: "欠佳", sub: "低於全港中位",     ink: "#fff"},
  {max: 52,       label: "平穩", sub: "接近全港中位",     ink: "#3a3833"},
  {max: 58,       label: "吉",   sub: "高於全港中位",     ink: "#fff"},
  {max: Infinity, label: "大吉", sub: "全港最高約一成",   ink: "#fff"},
];

function levelFor(v){
  if (v == null || isNaN(v)) return null;
  return LEVELS[BREAKS.findIndex(b => v < b) === -1 ? LEVELS.length - 1
                                                    : BREAKS.findIndex(b => v < b)];
}
/* 「吉以上」＝ best ＋ good 兩格加埋，佔呢個區幾多成樓。 */
const goodShare = a => {
  const b = a && a.bands;
  return (a && a.n && b) ? 100 * ((b.best || 0) + (b.good || 0)) / a.n : null;
};
let shareBreaks = null;          // 由 districtData 自己算，唔寫死
function calcShareBreaks(list){
  const v = list.map(goodShare).filter(x => x != null).sort((a,b) => a-b);
  shareBreaks = v.length >= 5 ? [1,2,3,4].map(i => v[Math.floor(v.length*i/5)]) : null;
}
// 唔可以借用樓宇分數嗰套 BREAKS —— 嗰套係按 0–100 分校準，唔係按比例。
const colorForShare = p => {
  if(p == null || !shareBreaks) return NODATA;
  const i = shareBreaks.findIndex(b => p < b);
  return RAMP[i === -1 ? RAMP.length - 1 : i];
};

const colorFor = v => {
  if (v == null || isNaN(v)) return NODATA;
  const i = BREAKS.findIndex(b => v < b);
  return RAMP[i === -1 ? RAMP.length - 1 : i];
};
const inkOn = v => (levelFor(v) || {}).ink || "#3a3833";

// Which score band the filter chips are showing. Bounds mirror BREAKS.
const BANDS = {
  all:    null,
  best:   v => v >= 58,
  "good+":v => v >= 52,
  mid:    v => v >= 46 && v < 52,
  poor:   v => v >= 41 && v < 46,
  bad:    v => v < 41,
};
const BAND_KEY = {best:"best", "good+":"good", mid:"mid", poor:"poor", bad:"bad"};
let band = "all";
let districtFilter = "";        // "" = whole territory
// Defensive: an unknown band must degrade to "show everything" rather than
// throw, or one bad value takes the whole panel down with it.
const passesFilter = v => {
  const test = BANDS[band];
  return typeof test !== "function" || (v != null && test(v));
};

/* 八字篩選要同時管地圖同清單 —— 清單話「4,689 棟符合」但地圖照樣畫晒
   八萬幢，係自相矛盾。
   圖磚帶住 face_m 同 conf，所以喺度計得到；conf 低過 0.6 就當冇坐向,
   同搜尋索引嗰邊同一條線。 */
const SHAN_D8 = {};
["壬子癸","丑艮寅","甲卯乙","辰巽巳","丙午丁","未坤申","庚酉辛","戌乾亥"]
  .forEach((g, i) => [...g].forEach(ch => SHAN_D8[ch] = i));
let guaDirSet = null;           // 合命卦嘅向首八方
let guaRegions = null;          // 合用神嘅地區（區議會分區名）

/* 兩重篩選，兩個唔同傳統：
     八宅 —— 睇樓宇向邊（本命卦 → 四個吉方）
     五行 —— 睇喺香港邊一忽（用神 → 方位 → 地區）
   兩樣一齊用先剩返 2,630 幢，夠揀，所以唔使逼人二揀一。 */
function passesGua(o){
  if(!guaOn) return true;
  // 自己揀咗區就唔再用「建議地區」—— 佢問緊「呢個區入面邊幢夾我」,
  // 唔係問「我應唔應該住呢個區」。
  if(!districtFilter && guaRegions && !guaRegions.has(o.district)) return false;
  if(!guaDirSet) return true;
  if((o.conf ?? 0) < 0.6) return false;
  const d = SHAN_D8[o.face_m];
  return d != null && guaDirSet.has(d);
}

/* 一屋人分咗東四西四，即係冇一個向對每個人都吉 —— 嗰陣唔可以再硬篩,
   硬篩落去會篩到一幢都冇。改為唔篩向，等個分自己講（八宅本身已經佔
   咗個分一半，所以唔夾嘅樓自然會沉底）。 */
let guaSplit = false;

function refreshGuaDirs(){
  guaDirSet = guaRegions = null;
  guaSplit = false;
  if(!(guaOn && bzMod)) return;
  const ppl = counted();
  if(!ppl.length) return;

  // 每個人四個吉方，取交集。一個人嘅時候，交集就係佢自己嗰四個。
  let shared = null;
  for(const person of ppl){
    const g = guaOf(person);
    if(!g) continue;
    const dirs = new Set(bzMod.goodDirs(g).map(d => DIR8.indexOf(d)));
    shared = shared === null ? dirs : new Set([...shared].filter(d => dirs.has(d)));
  }
  if(shared && shared.size) guaDirSet = shared;
  else if(ppl.length > 1) guaSplit = true;   // 分咗組：唔篩向，唔係會清空

  const {areas} = rankAreas();
  if(areas.length) guaRegions = new Set(areas.map(a => a.tc));
}

function verdict(v){
  const l = levelFor(v);
  return l ? [l.label, l.sub] : ["未有評分", ""];
}

const DIR_TC={N:"北",NE:"東北",E:"東",SE:"東南",S:"南",SW:"西南",W:"西",NW:"西北"};
const dirTC = d => (d&&DIR_TC[d]) ? DIR_TC[d] : "—";
const num = (v,d=1)=> (v==null||isNaN(v)) ? "—" : Number(v).toFixed(d);
const clean = s => (!s||s==="N/A"||s==="NULL"||!String(s).trim()) ? null : String(s).trim();
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ---------------------------------------------------------------- map --- */
const map = L.map("map",{
  center:[22.3450,114.1400], zoom:11, minZoom:10, maxZoom:19,
  // 南邊本來係 22.10。喺 844 高嘅電話、zoom 11，視野有成 0.53° 高，
  // 由市區做中心向南已經爆界 —— Leaflet 會夾硬將中心推返上北，開場就
  // 永遠淨係見到新界，而任何補償嘅平移都會被佢抵銷。放鬆到 21.98：
  // 香港最南都係 22.15，多出嗰啲係海，冇嘢好睇但都冇害。
  maxBounds:[[21.98,113.78],[22.62,114.47]], maxBoundsViscosity:.9,
  zoomControl:false, attributionControl:true,
});
L.control.attribution({prefix:false}).addTo(map);

// Proper cartographic stack. The topographic basemap is busy — contours,
// road fills, its own colour — so it gets muted by CSS and the place labels are
// lifted ABOVE the building polygons, which keeps street names readable instead
// of being painted over.
map.createPane("labels");
map.getPane("labels").style.zIndex = "640";
map.getPane("labels").style.pointerEvents = "none";

const ATTR = 'Map from Lands Department · 樓宇資料 CSDI · 評分自行計算';
const labelLayer = () => L.tileLayer(TILE+"/label/hk/tc/WGS84/{z}/{x}/{y}.png",
  {minZoom:10, maxZoom:19, pane:"labels", opacity:.92});

const bases = {
  street: L.layerGroup([
    L.tileLayer(TILE+"/basemap/WGS84/{z}/{x}/{y}.png",{minZoom:10,maxZoom:19,attribution:ATTR,className:"muted-base"}),
    labelLayer(),
  ]),
  satellite: L.layerGroup([
    L.tileLayer(TILE+"/imagery/WGS84/{z}/{x}/{y}.png",{minZoom:10,maxZoom:19,attribution:ATTR,className:"muted-sat"}),
    labelLayer(),
  ]),
};
let currentBase = "street";
bases.street.addTo(map);

function setBase(name){
  Object.values(bases).forEach(l=>map.removeLayer(l));
  bases[name].addTo(map);
  currentBase = name;
  markBase(name);
  buildingLayer.bringToFront();
}
function markBase(name){
  document.querySelectorAll('#layers button[data-base]').forEach(b=>
    b.classList.toggle('sel', b.dataset.base===name));
}

/* -------------------------------------------------------------- toast --- */
const toastEl=document.getElementById("toast"); let toastT=null;
/* 未揀性別就撳「計」。唔可以淨係出個頂部 toast —— 隻手指同隻眼都喺
   個掣度，離個 toast 成 700px。標紅、震一下、捲入畫面，三樣一齊先見到。 */
function needSex(){
  const sx = sheetBody.querySelector(".bzsex");
  if(sx){
    sx.classList.add("need");
    sx.scrollIntoView({block:"center", behavior:"smooth"});
    setTimeout(() => sx.classList.remove("need"), 2000);
  }
  toast("仲爭揀男定女");
}

function toast(msg,ms=2200,action){
  clearTimeout(toastT);
  if(!msg){toastEl.classList.remove("show");return;}
  toastEl.textContent=msg;
  // 「已收藏到「大埔」· 更改」—— 撳一下就得，唔撳就當冇事。一個動作永遠
  // 唔應該逼人做第二個決定。
  if(action){
    const b=document.createElement("button");
    b.className="tact"; b.textContent=action.label;
    b.addEventListener("click",e=>{e.stopPropagation(); toast(null); action.run();});
    toastEl.appendChild(b);
  }
  toastEl.classList.add("show");
  if(ms) toastT=setTimeout(()=>toastEl.classList.remove("show"),ms);
}

/* ---------------------------------------------------- building layer --- */
let minSel=null, reqSeq=0;
const tileCache = new Map();

// Canvas keeps ~2,000 footprints smooth on a phone; SVG creates a DOM node per
// building and stutters well before that.
const buildingRenderer = L.canvas({padding: 0.3});
const buildingLayer=L.layerGroup().addTo(map);

// A theatre or a substation carries a score like anything else, but showing
// it in the good/bad ramp reads as a verdict on somewhere to live. Those sit
// in neutral grey instead: still on the map, because knowing a school is next
// door matters, but plainly not part of the housing comparison.
const NONRES = "#c7c5bd";
/* ---------- 兩個圖層 ----------

   原本地圖淨係一種顏色意思：九運格局好唔好 —— 邊個睇都一樣。加咗八字
   之後，應該有第二種睇法：呢幢樓啱唔啱你。同一張地圖，兩個問題。

   分界線唔亂訂。九運嗰邊有自己一套（BREAKS，由全港分數分佈定出嚟），
   而「夾你」嗰個分每個人嘅分佈都唔同 —— 一個東四命嘅人同一個西四命嘅人，
   同一批樓會得出完全唔同嘅高低。所以色階係即時由你自己嗰份分佈切五等份：
   深綠 = 全港最夾你嗰兩成，深紅 = 最唔夾嗰兩成。

   即係話，顏色講嘅唔係「呢幢樓夠唔夠 70 分」，而係「喺全港住宅入面,
   呢幢樓對你嚟講排邊個位」。 */
let scoreMode = "nine";                 // "nine" | "bazi"
let fitBreaks = null, fitBreaksKey = null;

function countedKey(){
  return counted().map(p => `${p.y}/${p.m}/${p.d}/${p.h}/${p.male}`).join("|");
}

let areaFitCache = null, areaFitKey = null;
function areaFitMap(){
  const key = countedKey();
  if(areaFitKey === key && areaFitCache) return areaFitCache;
  const {areas} = rankAreas(18);
  if(!areas.length) return {};
  areaFitKey = key;
  return (areaFitCache = Object.fromEntries(areas.map(a => [a.tc, a.fit])));
}

function fitScale(){
  const key = countedKey();
  if(fitBreaksKey === key && fitBreaks) return fitBreaks;
  if(!searchIndex || !key) return null;
  const vals = [];
  for(const o of searchIndex){
    if(o.res === 0) continue;
    const f = houseFit(o);
    if(f != null) vals.push(f);
  }
  if(vals.length < 200) return null;
  vals.sort((a, b) => a - b);
  const q = t => vals[Math.floor(vals.length * t)];
  fitBreaksKey = key;
  return (fitBreaks = [q(.2), q(.4), q(.6), q(.8)]);
}

/** 八字圖層開得成未 —— 淨係睇有冇八字。引擎同數據係我哋去載，唔關佢事。 */
const baziLayerReady = () => !!birth;

/** 地圖上面呢幢樓應該用邊個分上色。 */
function scoreOf(o){
  if(scoreMode !== "bazi") return o.total;
  return houseFit(o);
}

function colorForScore(v){
  if(scoreMode !== "bazi") return colorFor(v);
  const b = fitScale();
  if(v == null || !b) return NODATA;
  const i = b.findIndex(x => v < x);
  return RAMP[i === -1 ? RAMP.length - 1 : i];
}

async function setScoreMode(m){
  if(m === "bazi" && !baziLayerReady()){
    toast("要先入咗出生日期先用得八字圖層");
    showBazi();
    return;
  }
  scoreMode = m;
  fitBreaks = null; fitBreaksKey = null;
  areaFitCache = null; areaFitKey = null;
  if(m === "bazi"){
    // 引擎、形嘅數據、搜尋索引三樣都係用到先載。有八字就去攞，唔好因為
    // 佢未載就話人哋「未入出生日期」—— 佢入咗，係我哋未準備好。
    toast("計緊…", 1500);
    await Promise.all([ensureBazi(), loadElements(), ensureIndex()]).catch(() => {});
    if(me) await loadFamily().catch(() => {});
  }
  document.querySelectorAll("#layers button[data-mode]").forEach(b =>
    b.classList.toggle("sel", b.dataset.mode === m));
  track("score_mode", {mode: m});
  loadBuildings(); drawDistricts(); showOverview();
}

function styleFor(score, res){
  const c = (res === 0) ? NONRES : colorForScore(score);
  return {renderer:buildingRenderer, fillColor:c, fillOpacity: res === 0 ? .6 : .88,
          color:c, weight:.6, opacity:.55};
}

// Selection is drawn as its own two-ring halo in a pane above everything, so it
// reads against a dark fill, a light fill, or the satellite image alike.
map.createPane("highlight");
map.getPane("highlight").style.zIndex = "645";
map.getPane("highlight").style.pointerEvents = "none";
const highlight = L.layerGroup([], {pane:"highlight"}).addTo(map);

function showHighlight(latlngs, centre){
  highlight.clearLayers();
  if(!latlngs && !centre) return;
  if(latlngs){
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#12161c",weight:6,
                       opacity:.5,lineJoin:"round"}).addTo(highlight);
    L.polygon(latlngs,{pane:"highlight",fill:false,color:"#ffffff",weight:2.5,
                       opacity:1,lineJoin:"round"}).addTo(highlight);
  }
  // A small building is only a few pixels across, so the outline alone is easy
  // to lose. An accent dot makes the selection unmistakable at any zoom.
  L.circleMarker(centre,{pane:"highlight", radius:7, color:"#ffffff", weight:2.5,
                         fillColor:"#e0562a", fillOpacity:1}).addTo(highlight);
}

function lonLat2tile(lon,lat,z){
  const n=2**z, rad=lat*Math.PI/180;
  return [Math.floor((lon+180)/360*n),
          Math.floor((1-Math.log(Math.tan(rad)+1/Math.cos(rad))/Math.PI)/2*n)];
}

async function getTile(z,x,y){
  const key=`${z}/${x}/${y}`;
  if(tileCache.has(key)) return tileCache.get(key);
  if(tileSet && !tileSet.has(key)){ tileCache.set(key, null); return null; }
  const pr = fetch(dataUrl(`${z}/${x}/${y}.json`))
    .then(r => r.ok ? r.json() : null)
    .catch(() => null);
  tileCache.set(key, pr);
  return pr;
}

async function loadBuildings(){
  const z=map.getZoom();
  if(z<BUILDING_ZOOM){ buildingLayer.clearLayers(); return; }
  // 放大到見到逐棟樓 —— 冇行到呢步嘅人，係連個產品都未見過。
  if(!trip.zoomed){ trip.zoomed = true; track("reached_buildings", {}); }
  districtLayer.clearLayers();

  const b=map.getBounds(), my=++reqSeq;
  const [x0,y1]=lonLat2tile(b.getWest(), b.getNorth(), TILE_Z);
  const [x1,y0]=lonLat2tile(b.getEast(), b.getSouth(), TILE_Z);

  // The guard counts z14 squares, not files, so splitting a dense area does
  // not make the viewport look "too large".
  const squares=[];
  for(let x=x0;x<=x1;x++) for(let y=y1;y<=y0;y++) squares.push([x,y]);
  if(squares.length>20){ toast("範圍太大，請放大啲"); return; }

  const wanted=squares.flatMap(([x,y])=>leavesUnder(TILE_Z,x,y));
  const tiles=await Promise.all(wanted.map(([z,x,y])=>getTile(z,x,y)));
  if(my!==reqSeq) return;

  buildingLayer.clearLayers();
  let n=0, selLayer=null;
  for(const t of tiles){
    if(!t) continue;
    COLS = t.c;
    for(const row of t.b){
      const o=rowToObj(row);
      // District is stored as a position in the tile's own name list.
      o.district = (t.dn && o.dn != null) ? t.dn[o.dn] : null;
      if(!b.contains([o.lat,o.lon])) continue;
      if(!passesFilter(o.total)) continue;
      if(!passesGua(o)) continue;
      const ring=decodeRing(o.ring);
      const lyr = ring
        ? L.polygon(ring, styleFor(scoreOf(o), o.res))
        : L.circleMarker([o.lat,o.lon], {...styleFor(scoreOf(o), o.res), radius:5});
      lyr.on("click",()=>select(o,lyr));
      lyr.on("mouseover",()=>{ if(o.id!==minSel) lyr.setStyle({weight:1.6,opacity:1}); });
      lyr.on("mouseout", ()=>{ if(o.id!==minSel) lyr.setStyle(styleFor(scoreOf(o), o.res)); });
      lyr.addTo(buildingLayer);
      if(o.id===minSel) selLayer={o,lyr};
      n++;
    }
  }
  if(selLayer) showHighlight(selLayer.lyr.getLatLngs ? selLayer.lyr.getLatLngs() : null,
                             [selLayer.o.lat, selLayer.o.lon]);
  if(n===0) toast(band==="all" ? "此範圍未有收錄樓宇" : "此範圍冇符合條件嘅樓宇");
  else if(band!=="all") toast(`${n.toLocaleString()} 棟符合`);
}

    .filter(n => n.nodeType === Node.TEXT_NODE)

/* 開場個視角。地圖中心本身冇偏，但個 sheet 冚住下半版，所以睇得見嗰
   半淨係上半 —— 開場永遠望住新界，市區喺個 sheet 底下。

   試過 fitBounds，唔得：喺電話度可見範圍得三百幾 px 高，要塞十八個區
   落去就會撞到 minZoom 10，個個圈細到睇唔到，上下仲吉一大截。

   所以唔改 zoom，淨係平移：度返上面條 filter 同下面個 sheet 各自冚咗
   幾多，將地圖推返落可見嗰個窗嘅正中。 */
/* 個 sheet（電話喺下面、電腦喺左邊）同上面條 filter 冚住幅地圖幾多。
   框視角同飛去一個範圍都要用，所以抽咗出嚟。 */
function sheetPad(){
  const el = document.getElementById("sheet");
  const f = document.getElementById("filters");
  const top = f ? Math.round(f.getBoundingClientRect().bottom) : 0;
  if(!el) return {railed: false, top, bottom: 0, left: 0};
  const r = el.getBoundingClientRect();
  return matchMedia("(min-width:1024px)").matches
    ? {railed: true, top, bottom: 0, left: Math.round(r.right)}
    : {railed: false, top, bottom: Math.round(Math.max(0, innerHeight - r.top)), left: 0};
}

function frameTerritory(){
  if(!document.getElementById("sheet")) return;
  map.setView([22.355, 114.135], 11, {animate: false});
  const p = sheetPad();
  if(p.railed) map.panBy([-Math.round(p.left / 2), 0], {animate: false});
  else map.panBy([0, Math.round((p.bottom - p.top) / 2)], {animate: false});
}

/* 個面板話「淨係計港島」，但幅地圖仲望住全港 —— 兩邊各講各嘅。
   範圍一定咗就飛過去，等睇到嘅同計緊嘅係同一忽地方。 */
let framedLiv = "";
/* 個 sheet 郁完先做。郁緊嗰陣度佢冚咗幾多，度到嘅係舊數，計出嚟嘅
   視角就會差幾級 —— 同一個問題撞咗三次先抽出嚟。 */
const sheetSettleJobs = [];
function afterSheetSettles(fn){
  sheetSettleJobs.push(fn);
  setTimeout(runSheetSettleJobs, 700);   // transitionend 唔一定 fire
}
function runSheetSettleJobs(){
  while(sheetSettleJobs.length) sheetSettleJobs.shift()();
}
(function watchSheet(){
  const el = document.getElementById("sheet");
  if(!el) return;
  el.addEventListener("transitionend", e => {
    if(e.propertyName !== "transform") return;
    runSheetSettleJobs();
    if(el.dataset.state !== "full"){
      frameLivable();
      setTimeout(frameLivable, 420);
    }
  });
})();

function frameLivable(){
  const lv = livSet();
  if(!districtData.length) return;
  if(!lv || !lv.size){                       // 放返全港
    if(framedLiv){ framedLiv = ""; frameTerritory(); }
    return;
  }
  const key = [...lv].sort().join(",");
  const pts = districtData.filter(d => lv.has(d.tc)).map(d => [d.lat, d.lon]);
  if(!pts.length) return;
  const p = sheetPad();
  // 個 sheet 攤到全屏嗰陣，幅地圖一個 px 都見唔到，padding 仲大過成個
  // container —— fitBounds 落去只會計出負數。等佢收返上去先做。
  if(innerHeight - p.top - p.bottom < 160 || innerWidth - p.left < 200) return;

  // 單靠「框過一次」做記號唔夠：transitionend 有時喺動畫仲未停低就到,
  // 嗰陣度到嘅 padding 係舊嘅，框出嚟會鬆幾格。所以問返 Leaflet 呢個
  // 範圍應該去到第幾級，未到就再框一次；到咗就唔好再扯佢（佢可能
  // 自己放大咗入去睇緊一幢樓）。
  const bb = L.latLngBounds(pts);
  const padPt = L.point(68 + p.left, 60 + p.top + p.bottom);
  const want = Math.min(13, map.getBoundsZoom(bb, false, padPt));
  if(key === framedLiv && map.getZoom() >= want) return;
  map.fitBounds(bb, {
    paddingTopLeft:     [p.left + 34, p.top + 30],
    paddingBottomRight: [34, p.bottom + 30],
    maxZoom: 13, animate: true, duration: .7,
  });
  framedLiv = key;          // 真係飛咗先當數，唔係就下次再試
}

/* 圈入面嗰個數字係乜，要喺地圖上面講，唔可以收喺面板度 —— 好多人
   一開就見住幅地圖，唔會捲落去。放大到逐幢樓之後冇咗啲圈，就自己收起。 */
function paintMapHint(){
  const el = document.getElementById("maphint");
  if(!el) return;
  const zoomed = map.getZoom() >= BUILDING_ZOOM;
  if(zoomed){ el.hidden = true; return; }
  el.hidden = false;
  el.innerHTML = scoreMode === "bazi"
    ? `圈入面 ＝ <b>呢個區夾你幾多分</b>（0–100，入咗八字先計到）`
    : band !== "all"
      ? `圈入面 ＝ 呢個區有<b>幾多幢樓</b>評為「${esc(chipLabel())}」`
      : `圈入面 ＝ 呢個區每 100 幢樓，有<b>幾多幢係「吉」或以上</b>`;
}

function drawDistricts(){
  districtLayer.clearLayers();
  paintMapHint();
  if(map.getZoom()>=BUILDING_ZOOM) return;
  if(!shareBreaks) calcShareBreaks(districtData);
  districtData.forEach(a=>{
    const c=[a.lat,a.lon];
    const share = goodShare(a);
    // With a filter on, the useful number is how many buildings there MATCH,
    // not the district average - that is what "where is the good stock" means.
    const cnt = bandCount(a);
    // 八字模式：泡泡講嘅係呢個區夾你幾多，唔係佢嘅九運平均分。
    const pf = scoreMode === "bazi" ? (areaFitMap()[a.tc] ?? null) : null;
    const shown = scoreMode === "bazi" ? (pf == null ? "–" : String(pf))
                : band==="all" ? (share == null ? "–" : share.toFixed(0) + "%")
                : cnt.toLocaleString();
    const tint  = scoreMode === "bazi" ? colorFor(pf)
                : band==="all" ? colorForShare(share) : RAMP[["bad","poor","mid","good","best"]
                    .indexOf(BAND_KEY[band])];
    const size  = band==="all" ? 46 : Math.max(40, Math.min(58, 34 + Math.sqrt(cnt)));
    // 三個模式量嘅嘢唔同，但三個都係比例，所以個圈填幾多都講得通：
    //   全港     —— 呢個區幾多成樓係「吉」以上
    //   揀咗一格 —— 呢個區幾多成樓喺嗰一格
    //   八字     —— 呢個區夾你幾多分（0–100）
    const ringPct = scoreMode === "bazi" ? (pf ?? 0)
                  : band === "all" ? (share ?? 0)
                  : (a.n ? 100 * cnt / a.n : 0);
    const icon=L.divIcon({
      className:"", iconSize:[size,size], iconAnchor:[size/2,size/2],
      html:`<div class="dmark ring" style="width:${size}px;height:${size}px;
                  --fill:${tint}; --p:${Math.max(0, Math.min(100, ringPct)).toFixed(1)}">
              <span class="dnum" style="color:${tint}">${shown}</span>
              <div class="dlabel">${a.tc.replace("區","")}</div></div>`,
    });
    L.marker(c,{icon}).addTo(districtLayer)
      .on("click",()=>{ map.flyTo(c,BUILDING_ZOOM,{duration:.8});
                        toast(band==="all"
                          ? `${a.tc}：${a.n.toLocaleString()} 棟入面 ${
                              (((a.bands||{}).best||0)+((a.bands||{}).good||0)).toLocaleString()
                            } 棟「吉」以上`
                          : `${a.tc} ${chipLabel()} ${cnt.toLocaleString()} 棟`); });
  });
}

/* --------------------------------------------------------- the sheet --- */
const sheet=document.getElementById("sheet");
const sheetBody=document.getElementById("sheetbody");
const gripText=document.getElementById("griptext");
/* ---------- 返回 ----------

   之前每一頁都係「行入去就返唔到轉頭」：撳咗八字裡面一個區，就淨係剩
   返嗰區嘅樓，想睇返邊幾個區啱自己就冇路；撳手機個返回掣係直接離開成
   個 app。

   所以留一條路徑返轉頭。每次「行入去」推一格（連埋一個 history entry），
   撳畫面上面個返回、或者手機硬件返回掣，都係彈返上一格；彈到冇得彈，
   先至真係離開。 */
const backStack = [];
let backPushed = 0;

function pushBack(label, run){
  if(backStack.length >= 8) backStack.shift();
  backStack.push({label, run});
  try{ history.pushState({fs: ++backPushed}, ""); }catch{}
  syncBack();
}
function popBack(){
  const t = backStack.pop();
  syncBack();
  if(t) t.run();
  return !!t;
}
function clearBack(){ backStack.length = 0; syncBack(); }

/* 保險。

   逐個入口擺返回掣係啱，但漏一個就係一個死胡同 —— 實測由「八字」個掣
   入去就係咁，撳完之後乜路都冇。所以除咗堆疊之外，每一個唔係首頁嘅
   畫面都有一個預設出路：堆疊空咗就用佢。咁就冇得漏。 */
let curView = "root";
function setView(v){ curView = v; syncBack(); }

function fallbackBack(){
  if(IS_TRIAL && curView==="building") return ["揀樓座",()=>selectedBuilding?.est?openEstateJourney(selectedBuilding.est,false):trialHome()];
  if(IS_TRIAL && curView==="estate") return ["搵屋苑",trialHome];
  if(personalTarget && ["personal","bazi","signin"].includes(curView)){
    const target=personalTarget;
    return ["返樓座",()=>{personalTarget=null;rememberBuilding(target,"map");renderBuilding(target,null);}];
  }
  if(curView === "list"){
    if(groupSel) return ["上一層", () => { groupSel = null; showOverview(); }];
    if(districtFilter) return ["全港", () => {
      districtFilter = null; groupSel = null;
      const c = document.getElementById("btnDistrict");
      c.innerHTML = '<b>地區</b>全港 <span class="caret">▾</span>';
      c.classList.remove("on");
      drawDistricts(); showOverview();
    }];
    // 全港清單一定係經某個 chip 入嚟嘅。之前當佢會自己熄返個 chip，
    // 但冇人會咁做 —— 撳咗一個 chip 入到一版新嘢，佢就會揾返回。
    if(band !== "all") return ["地圖", () => {
      band = "all";
      document.querySelectorAll("#filters .chip[data-band]").forEach(x =>
        x.classList.toggle("on", x.dataset.band === "all"));
      loadBuildings(); drawDistricts(); showOverview();
    }];
    if(guaOn) return ["地圖", () => {
      guaOn = false;
      document.getElementById("btnGua").classList.remove("on");
      loadBuildings(); drawDistricts(); showOverview();
    }];
    return null;
  }
  if(curView === "family") return ["八字", () => showBazi()];
  if(curView === "root") return null;
  // showOverview 會睇住呢幾個 flag 彈返去原本嗰版 —— 唔清返，撳返回就
  // 返返同一版，變咗死胡同。揀地區就係咁。
  if(curView === "dpicker") return pickGroup
    ? ["揀地區", () => { pickGroup = null; showDistrictPicker(); }]
    : ["地圖", () => { pickingDistrict = false; showOverview(); }];
  if(curView === "lpicker") return ["收藏", () => showFavs()];
  if(curView === "favs") return ["地圖", () => {
    favView = false; sharedList = null;
    document.getElementById("btnFav").classList.remove("on");
    showOverview();
  }];
  return ["地圖", () => showOverview()];
}

function syncBack(){
  const b = document.getElementById("gripback");
  if(!b) return;
  if(IS_TRIAL) b.style.display=curView==='trialhub'?'none':'';
  const t = backStack[backStack.length - 1]
         || (() => { const f = fallbackBack(); return f && {label: f[0], run: f[1]}; })();
  b.hidden = !t;
  if(t) b.querySelector("span").textContent = t.label;
}
addEventListener("popstate", () => {
  if(backPushed > 0) backPushed--;
  popBack();                       // 空咗就乜都唔做，瀏覽器自己行落去
});

document.getElementById("gripback").addEventListener("click", e => {
  e.stopPropagation();             // 唔好順便開關咗個面板
  if(backStack.length){
    if(backPushed > 0) history.back();  // popstate 會做嘢，兩邊唔會失散
    else popBack();
    return;
  }
  const f = fallbackBack();
  if(f) f[1]();
});

document.getElementById("grip").addEventListener("click", e=>{
  if(e.detail === 0) return;                 // ignore clicks synthesised by drag
  setSheet(sheetState() === "full" ? "peek" : sheetState() === "half" ? "full" : "half");
});

// peek: grip only · half: enough to read without losing the map · full: the lot
let framedOnce = false;
function setSheet(state){
  if(IS_TRIAL){document.body.classList.toggle("trial-focus",state!=="peek");if(state!=="peek")state="full";}
  sheet.dataset.state = state;
  sheet.classList.toggle("open", state !== "peek");
  if(state === "peek") sheetBody.scrollTop = 0;
  // 第一次攤開嗰陣先框返個視角 —— 要等佢郁完先度得準。深層連結有自己
  // 嘅視角，唔好搶。
  if(!framedOnce && state !== "peek" && !location.search){
    framedOnce = true;
    sheet.addEventListener("transitionend", () => frameTerritory(), {once: true});
    setTimeout(frameTerritory, 900);
  }
}
const sheetState = () => sheet.dataset.state || "peek";
function openSheet(){ if(sheetState() === "peek") setSheet("half"); }

// Drag the grip to any snap point; a flick carries momentum, as it should.
(function dragSheet(){
  let startY = 0, startT = 0, dragging = false, moved = 0, t0 = 0;
  const H = () => sheet.getBoundingClientRect().height;   // matches the CSS box
  const offsetFor = st => st === "full" ? 0 : st === "half" ? H()*0.45 : H() - 58;
  const grip = document.getElementById("grip");

  const down = e => {
    dragging = true; moved = 0; t0 = Date.now();
    startY = (e.touches ? e.touches[0] : e).clientY;
    startT = offsetFor(sheetState());
    sheet.classList.add("dragging");
  };
  const move = e => {
    if(!dragging) return;
    const y = (e.touches ? e.touches[0] : e).clientY;
    moved = y - startY;
    const next = Math.max(0, Math.min(H() - 58, startT + moved));
    sheet.style.transform = `translateY(${next}px)`;
    e.preventDefault();
  };
  const up = () => {
    if(!dragging) return;
    dragging = false;
    sheet.classList.remove("dragging");
    sheet.style.transform = "";
    const quick = Date.now() - t0 < 250 && Math.abs(moved) > 30;
    const order = ["full","half","peek"];
    let i = order.indexOf(sheetState());
    if(quick) i += moved > 0 ? 1 : -1;                 // flick moves one stop
    else {
      const end = startT + moved;                       // settle on the nearest
      const d = order.map(st => Math.abs(offsetFor(st) - end));
      i = d.indexOf(Math.min(...d));
    }
    setSheet(order[Math.max(0, Math.min(2, i))]);
  };

  grip.addEventListener("touchstart", down, {passive:true});
  grip.addEventListener("touchmove", move, {passive:false});
  grip.addEventListener("touchend", up);
  grip.addEventListener("mousedown", down);
  addEventListener("mousemove", move);
  addEventListener("mouseup", up);
})();

// A building journey is represented by public building coordinates + ID only.
// No birth fields or auth tokens are persisted in navigation state.
let selectedBuilding = null, personalTarget = null;
let estateRoutesPromise = null;

function rememberBuilding(o, intent){
  const u=new URL(location.href);
  u.searchParams.set('b',`${o.lat},${o.lon}`);
  u.searchParams.set('bid',String(o.id));
  u.searchParams.set('intent',intent);
  u.searchParams.delete('list');
  history.replaceState(null,'',u);
}
async function estateRoutes(){
  if(!estateRoutesPromise) estateRoutesPromise=fetch(dataUrl('../estate_routes.json'))
    .then(r=>{if(!r.ok)throw Error('routes');return r.json();})
    .catch(e=>{estateRoutesPromise=null;throw e;});
  return estateRoutesPromise;
}
async function resolveBuilding(pt,id){
  // Fetch the source tile directly. Do not depend on animated map bounds,
  // arbitrary timers or filtered display layers to find the chosen building.
  const [x,y]=lonLat2tile(pt.lon,pt.lat,TILE_Z);
  const tiles=await Promise.all(leavesUnder(TILE_Z,x,y).map(([z,a,b])=>getTile(z,a,b)));
  let match=null;
  for(const t of tiles){
    if(!t)continue;
    for(const row of t.b){
      const o=Object.fromEntries(t.c.map((k,i)=>[k,row[i]]));
      o.district=(t.dn&&o.dn!=null)?t.dn[o.dn]:null;
      const exact=id ? String(o.id)===String(id) : Math.abs(o.lat-pt.lat)<0.000015 && Math.abs(o.lon-pt.lon)<0.000015;
      if(exact){if(match&&!id)return null;match=o;}
    }
  }
  return match;
}

}
async function openJourneyBuilding(row,personal=false){
  const o=await resolveBuilding(row,row.id);
  if(!o){journeyFailure('building_not_found');return;}
  map.setView([o.lat,o.lon],18,{animate:false});
  select(o,null);
  openSheet();setSheet('full');
  track('map_target_loaded',{building_id:String(o.id),intent:personal?'personal':'map',status:'success'});
  if(personal)await startPersonal(o);
}
async function openEstateJourney(name,personal){
  try{
    const source=(await estateRoutes())[name];
    const blockNumber=r=>{const m=(r.tc||r.en||'').match(/第([一二三四五六七八九十\d]+)座/);if(!m)return Infinity;const v=m[1];if(/^\d+$/.test(v))return +v;const n=x=>'一二三四五六七八九'.indexOf(x)+1;if(v.includes('十')){const [a,b]=v.split('十');return (a?n(a):1)*10+(b?n(b):0);}return n(v);};
    const rows=source?.slice().sort((a,b)=>blockNumber(a)-blockNumber(b)||(a.tc||a.en||'').localeCompare(b.tc||b.en||'','zh-Hant',{numeric:true}));
    if(!rows?.length){journeyFailure('estate_not_found');return;}
    selectedBuilding=null;personalTarget=null;
    const u=new URL(location.href);u.searchParams.set('estate',name);u.searchParams.delete('b');u.searchParams.delete('bid');u.searchParams.set('intent',personal?'personal':'map');history.replaceState(null,'',u);
    map.fitBounds(rows.map(r=>[r.lat,r.lon]),{padding:[35,35],maxZoom:17,animate:false});
    gripText.textContent=name;setView('estate');openSheet();setSheet('full');
    sheetBody.innerHTML=`<div class="journey">${IS_TRIAL?trialSteps(2):'<p class="jstep">揀樓座</p>'}<h2>${esc(name)}<br>你想睇邊座？</h2><p class="mcount">撳樓座，${personal?'直接睇你嘅配對結果':'先睇環境，再睇同你夾唔夾'}。</p><div class="jgrid">${rows.map((r,i)=>`<button class="jblock" data-journey-row="${i}"><span>${esc((r.tc||r.en).replace(name,'')||r.tc||r.en)}</span></button>`).join('')}</div><button class="jmap" id="journeyMap">喺地圖睇呢個屋苑</button><p class="bznote">樓座按編號排列，並非實際位置。</p>${IS_TRIAL?`<button class="pbtn" id="estateFullInfo">航空圖・逐座評分・屋苑資料 →</button>`:`<a class="deep" href="/estate/${encodeURIComponent(name)}">返回屋苑介紹</a>`}</div>`;
    sheetBody.querySelectorAll('[data-journey-row]').forEach(b=>b.onclick=()=>openJourneyBuilding(rows[+b.dataset.journeyRow],personal).catch(()=>journeyFailure('building_load')));
    sheetBody.querySelector('#journeyMap').onclick=()=>setSheet('peek');
    sheetBody.querySelector('#estateFullInfo')?.addEventListener('click',()=>trialArticle('/estate/'+encodeURIComponent(name),()=>openEstateJourney(name,personal)));
    track('map_target_loaded',{estate:name,intent:personal?'personal':'map',status:'success'});
  }catch{journeyFailure('estate_load');}
}

   同左欄唔同：左欄係「你揀緊乜」，右欄係「你揀咗嗰樣嘢係點」。所以右欄
   永遠跟住 selection 走，唔會有自己嘅導航。

const sideEl = () => document.getElementById("side");

function sideBlocks(o){
  if(!o.est || !searchIndex) return "";
  const rows = searchIndex.filter(x => x.est === o.est && x.res !== 0)
    .map(x => ({...x, _fit: fitOf(x)}))
    .sort((a, b) => (b.total || 0) - (a.total || 0));
  if(rows.length < 2) return "";
  return `
    <p class="fhd" style="margin:16px 0 0">同屋苑逐座　<span>${rows.length} 座</span></p>
    <ul class="sideblocks">${rows.slice(0, 24).map(x => `
      <li data-lat="${x.lat}" data-lon="${x.lon}"${
        x.lat === o.lat && x.lon === o.lon ? ' class="here"' : ""}>
        <span class="bs" style="background:${colorFor(x.total)};color:${inkOn(x.total)}">${num(x.total,0)}</span>
        <span class="bn">${esc(clean(x.tc) || clean(x.en) || "未命名")}
          ${x._fit != null ? `<span class="bf">夾你 ${x._fit}</span>` : ""}</span>
      </li>`).join("")}</ul>
    ${rows.length > 24 ? `<p class="plancap">仲有 ${rows.length - 24} 座，喺屋苑頁度睇得晒。</p>` : ""}`;
}

function sideWx(tc){
  const e = elemData && elemData[tc];
  if(!e) return "";
  const f = e.form;
  const top = Object.keys(f).sort((a, b) => f[b] - f[a])[0];
  return `
    <p class="fhd" style="margin:16px 0 0">${esc(tc)}量出嚟嘅形</p>
    <p class="sidesub" style="margin:4px 0 0">平均樓高 ${e.h_med} 米　·　
      ${e.shore.toFixed(0)}% 住宅喺離水邊 200 米內　·　每平方公里 ${e.density} 幢</p>

      const lat = +li.dataset.lat, lon = +li.dataset.lon;
      map.setView([lat, lon], 18);
      setTimeout(() => {
        let best = null, bd = Infinity;

/* ---------- 一屋人 ----------

   搵樓嘅人好少係一個人。一個爸爸幫成家搵，佢要知嘅唔係「呢層樓啱唔啱
   我」，係「啱唔啱我哋」。所以八字唔係一個，係一份名單。

   一定要有名：加到三四個之後，「配偶」「仔」「仔」根本分唔開邊個係邊個。

   屋企人嘅出生日期係<b>第三者嘅個人資料</b>，嗰個人冇同意過 —— 所以
   佢哋淨係攞嚟計自己嗰份分析，唔會做推廣對象，撳一下就刪得走。
   見 docs/business.md。 */
const REL = [
  ["self",          "自己"],
  ["spouse",        "配偶"],
  ["child",         "子女"],
  ["parent",        "父母"],
  ["parent_in_law", "外父外母／老爺奶奶"],
  ["sibling",       "兄弟姊妹"],
  ["other",         "其他"],
];
const relTC = r => (REL.find(x => x[0] === r) || [, "其他"])[1];

let family = [];          // [{id, name, relation, is_self, y, m, d, h, male}]

/* 邊幾個人計緊。

   「我同老婆」、「我同個女」、「全家」係三條唔同嘅問題，而人搵樓嗰陣
   三條都會問。所以逐個人撳得著撳得熄，唔使開幾個 profile。

   揀邊幾個係睇緊嘅一刻嘅嘢，唔係身份，所以留喺部機就夠。 */
const FAM_OFF_KEY = (IS_TRIAL ? "trial_v2_" : "") + "fs_fam_off_v1";
let famOff = new Set();
try{ famOff = new Set(JSON.parse(localStorage.getItem(FAM_OFF_KEY) || "[]")); }catch{}
const famOn = p => !famOff.has(p.id);
function toggleFam(id){
  if(famOff.has(id)) famOff.delete(id); else famOff.add(id);
  try{ localStorage.setItem(FAM_OFF_KEY, JSON.stringify([...famOff])); }catch{}
}

function rowToPerson(r){
  if(!r.birth_at) return null;
  const hk = new Date(new Date(r.birth_at).getTime() + 8 * 3600000);
  return {id: r.id, name: clean(r.name), relation: r.relation, is_self: !!r.is_self,
          y: hk.getUTCFullYear(), m: hk.getUTCMonth() + 1, d: hk.getUTCDate(),
          h: r.hour_known ? hk.getUTCHours() : null,
          male: r.sex !== "f"};
}

function personToRow(p){
  const h = p.h == null ? 12 : p.h;
  return {
    name: p.name || null,
    relation: p.relation || "other",
    is_self: !!p.is_self,
    birth_at: new Date(Date.UTC(p.y, p.m - 1, p.d, h - 8, 0)).toISOString(),
    birth_tz: "Asia/Hong_Kong", birth_lat: 22.3193, birth_lon: 114.1694,
    sex: p.male ? "m" : "f", hour_known: p.h != null,
  };
}

async function loadFamily(){
  if(!sb || !me){ family = []; return family; }
  try{
    const {data} = await sb.from("persons")
      .select("id,name,relation,is_self,birth_at,sex,hour_known")
      .order("is_self", {ascending: false}).order("created_at");
    family = (data || []).map(rowToPerson).filter(Boolean);
  }catch{ family = []; }
  return family;
}

async function savePerson(p){
  if(!sb || !me) return null;
  const row = {...personToRow(p), user_id: me.id};
  const q = p.id
    ? sb.from("persons").update(row).eq("id", p.id).select().single()
    : sb.from("persons").insert(row).select().single();
  const {data, error} = await q;
  if(error){ toast("存唔到，試多次"); return null; }
  await loadFamily();
  return rowToPerson(data);
}

async function removePerson(id){
  if(!sb || !me) return;
  const {error} = await sb.from("persons").delete().eq("id", id);
  if(error){ toast("刪唔到"); return; }
  await loadFamily();
}

/* 一個單位對成屋人嘅分。唔取平均就算數 —— 平均會冚住「有一個人好唔夾」
   呢件事，而嗰個先係人哋最想知道嘅。所以連最低嗰個一齊報。 */
function familyFits(o){
  const rows = [];
  for(const p of family){
    if(!famOn(p)) continue;
    const f = fitOf(o, p);
    if(f != null) rows.push({...p, fit: f});
  }
  if(!rows.length) return null;
  rows.sort((a, b) => b.fit - a.fit);
  const avg = Math.round(rows.reduce((t, r) => t + r.fit, 0) / rows.length);
  return {rows, avg, best: rows[0], worst: rows[rows.length - 1]};
}

/* ---------- 逐幢樓嘅個人分析 ----------

   樓宇頁本來只答「呢幢樓格局好唔好」，即係人人見到同一個答案。呢一格答
   另一條：呢幢樓點解啱你。兩件事擺埋一齊但分開講，唔撈埋做一個分數。

   頭兩行免費睇，其餘 blur 住 —— 唔係為咗擋住人，係因為要記得住你係邊個
   先幫到你（換部電話、下次返嚟都仲喺度），而嗰樣嘢要有個戶口。 */
const WX_HELP = {木:"火", 火:"土", 土:"金", 金:"水", 水:"木"};   // 生

function bldWhy(o, wx, dEl){
  const v = bldWx(o, wx, dEl);
  if(v == null) return null;
  if(wx === "火")
    return {wx, v, txt: dEl ? `${clean(o.district)}有 ${dEl.spike.toFixed(1)}% 樓宇高出四周一倍以上，
      每平方公里 ${dEl.density} 幢` : "", scope: "區"};
  if(wx === "金")
    return {wx, v, txt: dEl && dEl.dir_wx === "金" ? `${clean(o.district)}位處全港西面，西屬金`
      : `${clean(o.district)}唔喺全港西面`, scope: "區"};
  if(wx === "水")
    return {wx, v, txt: `離水邊 ${num(o.wt_d, 0)} 米`, scope: "樓"};
  const size = `樓高 ${num(o.h, 0)} 米${o.storeys ? `、${num(o.storeys, 0)} 層` : ""}`;
  return {wx, v, txt: wx === "木" ? `${size} —— 高而直` : `${size} —— 矮而闊`, scope: "樓"};
}

  // 一個人嘅分上面，再加一層：成屋人。加咗家人先有，所以亦都係

function wireFavChrome(){
  const i = sheetBody.querySelector("#btnAcctIn");
  if(i) i.addEventListener("click", ()=>askSignIn(null));
  const o = sheetBody.querySelector("#btnAcctOut");
  if(o) o.addEventListener("click", signOut);

      const name = prompt("新清單叫咩名？例如「大埔」", "");
      if(!name || !name.trim()) return;
      await createList(name);

function showFavs(){
  if(IS_TRIAL)return sharedList?trialSharedListView(sharedList):trialFavorites();
  const list = sharedList || favs;
  const mine = !sharedList;
  const title = mine ? (me ? curListName() : "我的收藏") : "朋友分享嘅清單";
  gripText.textContent = mine ? `${title} · ${favs.length} 個` : `${title} · ${list.length} 個`;
  setView("favs");
  if(!list.length){
    sheetBody.innerHTML = `
      ${mine ? accountHTML() + listTabsHTML() : ""}
      <p class="bname">${esc(title)}</p>
      <p class="mcount">仲未收藏任何樓宇。撳地圖上任何一棟樓，再撳「收藏」就會加入呢度，
         之後可以一次過分享成張清單俾屋企人或者經紀。</p>
      <div class="sharebar">
        <div><b>介紹俾朋友</b><span>一條連結，撳開就用得。</span></div>
        <button id="btnShareApp2">分享</button></div>
      <p class="build" id="buildStamp">${APP_VERSION}</p>`;
    fillBuildStamp();
    if(mine) wireFavChrome();
    const sa2 = sheetBody.querySelector("#btnShareApp2");
    if(sa2) sa2.addEventListener("click", shareApp);
    return;
  }
  sheetBody.innerHTML = `
    ${mine ? accountHTML() + listTabsHTML() : ""}
    ${mine ? "" : `<div class="shared-note">
      <b>呢個係朋友分享嘅樓盤清單</b>
      <span>你可以逐個撳入去睇評分。想睇自己屋企幾多分？用上面搜尋欄搵你個屋苑。</span></div>`}
    <p class="bname">${mine ? esc(title) : "朋友揀咗嘅樓盤"}</p>
    <p class="mcount">${list.length} 個樓盤，按分數由高至低排列。</p>
    ${mine ? `<div class="sharebar">
      <div><b>分享成一張清單</b><span>一條連結，對方撳開就睇晒你揀嘅樓同評分。</span></div>
      <button id="btnShareList">分享</button></div>` : ""}
    <ul class="mlist">${[...list].sort((a,b)=>(b.total||0)-(a.total||0)).map((o,i)=>`
      <li data-i="${i}">
        <div class="sc" style="background:${colorFor(o.total)};color:${inkOn(o.total)}">${num(o.total,0)}</div>
        <div><div class="nm">${esc(clean(o.tc)||clean(o.en)||"未命名樓宇")}</div>
             <div class="mt">${esc([clean(o.district), nowPlain(o.now)].filter(Boolean).join(" · "))}</div></div>
        <div class="go">›</div>
      </li>`).join("")}</ul>
    <p class="build" id="buildStamp">${APP_VERSION}</p>`;
  fillBuildStamp();
  if(mine) wireFavChrome();
  const sl = sheetBody.querySelector("#btnShareList");
  if(sl) sl.addEventListener("click", shareList);
  const sorted = [...list].sort((a,b)=>(b.total||0)-(a.total||0));
  sheetBody.querySelectorAll(".mlist li").forEach(li=>li.addEventListener("click",()=>{
    const o = sorted[+li.dataset.i];
    map.setView([o.lat,o.lon], 18);
    setTimeout(()=>{
      let best=null, bd=Infinity;
      buildingLayer.eachLayer(l=>{
        const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
        const d=(c.lat-o.lat)**2+(c.lng-o.lon)**2;
        if(d<bd){ bd=d; best=l; }
      });
      if(best && bd < 1e-7) best.fire("click");
    }, 900);
  }));
}

/* 十八區嘅五行，由 pipeline/make_elements.py 量出嚟，唔係查表。

   撼龍經定五行係睇「形」—— 金圓、木直、水曲、火尖、土方 —— 而形係我哋
   量得到嘅：每幢樓都有高度、地基輪廓、同離山離水幾遠。所以：

     木  高而瘦     平均樓高、高度對地基闊度嘅比例
     土  矮而闊     同一組數字反過來
     火  尖         高出自己四周一倍以上嘅樓有幾多 ＋ 每平方公里幾多幢
     水  近水       幾多成住宅喺離水邊 200 米內
     金  —          冇。圓度要睇輪廓，而一半 footprint 係四點嘅長方形，
                    計出嚟嘅圓度係噪音扮數字。金淨係由方位定，畫面會寫明。

   分數係十八區入面嘅排名（0–100）：講「呢個區屬木」本來就只能夠係
   「同全港其他區比」。 */
let elemData = null, elemPromise = null;
function loadElements(){
  if(!elemPromise)
    elemPromise = fetch(dataUrl('../elements.json'))
      .then(r => r.json())
      .then(d => (elemData = Object.fromEntries(d.map(x => [x.tc, x]))))
      .catch(() => (elemData = {}));
  return elemPromise;
}

/* 逐幢樓嘅形。mu 同 wa 由 pipeline 度好（見 pipeline/formwx.py）——
   mu 係「高而直」喺全港五萬幾幢住宅入面排第幾，土就係佢嘅反面；
   wa 係離水邊幾近。兩個都係位置，唔係絕對值：「22 米高」本身冇意思。

   火唔喺樓身上面：「高出四周」一定要有四周，所以火係成個區嘅屬性。
   金照舊由方位定。 */
function bldWx(b, wx, dEl){
  if(wx === "火") return dEl ? dEl.form.火 : null;
  if(wx === "金") return dEl && dEl.dir_wx === "金" ? 70 : 30;
  if(wx === "水") return b.wa ?? null;
  if(b.mu == null) return null;
  return wx === "木" ? b.mu : 100 - b.mu;
}

/* 個人化權重。

   寒熱命話你知要邊兩個五行，但佢本身淨係得三個答案 —— 實測六個唔同
   出世日期，得返兩張一模一樣嘅單，咁就唔算度身訂造。

   第二層由你自己個盤嚟。同樣係寒命，有人盤入面火佔 47%、木得 13%,
   有人反過嚟火得 6%、木有 47%。缺邊樣補邊樣，本來就係八字度嘅做法,
   所以次序唔變（寒熱命話咗邊個行先），但兩者之間嘅比重跟返你自己
   實際缺幾多。 */
function wxWeights(like, pct){
  const [p1, p2] = like;
  const short = w => 1 - Math.min(pct[w] || 0, 60) / 100;   // 0.40 – 1.00
  const a = 0.70 * short(p1), b = 0.30 * short(p2), t = a + b;
  return [[p1, a / t], [p2, b / t]];
}

/* 權重按出生資料計，逐個人一份 —— 一屋人唔會得一個八字。
   同一個出生日期唔使計兩次，所以照 key 入 cache。 */
const wCache = new Map();
function weightsFor(b){
  if(!(bzMod && b)) return null;
  const key = `${b.y}/${b.m}/${b.d}/${b.h}`;
  if(wCache.has(key)) return wCache.get(key);
  const hh = b.h == null ? 12 : b.h;
  const c = bzMod.chart(b.y, b.m, b.d, hh, 0);
  const hc = bzMod.hotCold(b.y, b.m, b.d, hh, 0);
  if(!c || !hc) return null;
  const w = wxWeights(hc.like, bzMod.strength(c).pct);
  wCache.set(key, w);
  return w;
}
function myWeights(){ return weightsFor(birth); }

/* 一幢樓幾夾你。

   個區話你知大概去邊一帶，但區入面差天共地 —— 元朗有三層高嘅村屋,
   隔離就係天水圍成三十層嘅公屋，兩幢樓形完全唔同。個分數就係度返
   呢一幢樓自己嘅形，對唔對得上你缺嗰啲五行。

   同九運分數係兩件事：九運答「呢幢樓格局好唔好」，呢個答「啱唔啱你」。 */
/* 八宅嘅遊年星，逐個人計。

   點解要加呢一層：淨靠五行，同一個寒熱命嘅人實際上攞同一個分。實測 120
   個隨機出生日期，76 個寒命人喺同一幢樓只得四個唔同嘅分（55–58）——
   因為寒命喜火，而火嗰份係成個區嘅屬性，全區每個人都一樣。

   八宅先係真正分到人嘅嘢：命卦有八個，遊年星有八隻，同一幢樓對乾命係
   「六煞」，對巽命可以係「生氣」。而呢套嘢我哋驗過（400 個命卦、64 對
   遊年關係全中）。

   吉凶次序係傳統嘅：生氣 > 天醫 > 延年 > 伏位｜禍害 > 六煞 > 五鬼 > 絕命。
   ⚠ 次序係傳統，但**由次序變成分數係我哋自己定**，唔係邊位師傅嘅規矩。 */
const STAR_SCORE = {生氣:100, 天醫:85, 延年:75, 伏位:60,
                    禍害:40, 六煞:30, 五鬼:20, 絕命:10};
const FORM_W = 0.5;               // 另外一半係八宅

const guaCache = new Map();
function guaOf(p){
  if(!(bzMod && p)) return null;
  const key = `${p.y}/${p.m}/${p.d}/${p.h}/${p.male ? "m" : "f"}`;
  if(guaCache.has(key)) return guaCache.get(key);
  const c = bzMod.chart(p.y, p.m, p.d, p.h == null ? 12 : p.h, 0);
  const g = c ? bzMod.mingGua(c.baziYear, p.male) : null;
  guaCache.set(key, g);
  return g;
}

/** 呢幢樓個向，對呢個人嚟講係邊隻遊年星。坐向推唔準就 null —— 唔估。

    兩個來源：圖磚有 face_m（二十四山）同 conf；搜尋索引冇，但有 d8 ——
    build_tiles 出 d8 嗰陣已經做咗 conf >= 0.6 呢一關，唔夠準嘅係 null。

    ⚠ 之前淨係讀 face_m，所以清單（讀搜尋索引）計唔到八宅，變咗淨係形；
    而樓宇頁（讀圖磚）計到。同一幢樓喺兩個地方出兩個唔同嘅分。 */
function guaStar(o, p){
  const g = guaOf(p);
  if(!g) return null;
  const i = (o.d8 != null) ? o.d8
          : ((o.conf ?? 0) >= 0.6 && o.face_m != null) ? SHAN_D8[o.face_m]
          : null;
  if(i == null) return null;
  const dir = DIR8[i], star = bzMod.LUCK[g][dir];
  return {gua: g, dir, star, score: STAR_SCORE[star] ?? null,
          good: bzMod.GOOD.includes(star)};
}

/** 淨係形嗰半。 */
function formFit(o, p){
  const w = weightsFor(p);
  if(!w) return null;
  const dEl = elemData && elemData[o.district];
  let t = 0;
  for(const [wx, k] of w){
    const v = bldWx(o, wx, dEl);
    if(v == null) return null;   // 量唔到就唔出分，唔好當佢啱一半
    t += k * v;
  }
  return t;
}

/** 夾你分。回傳 {fit, form, gua} —— gua 係 null 即係推唔到坐向。 */
function fitParts(o, who){
  const p = who || birth;
  const form = formFit(o, p);
  if(form == null) return null;
  const g = guaStar(o, p);
  const fit = (g && g.score != null)
    ? Math.round(form * FORM_W + g.score * (1 - FORM_W))
    : Math.round(form);
  return {fit, form: Math.round(form), gua: g};
}

function fitOf(o, who){
  const r = fitParts(o, who);
  return r ? r.fit : null;
}

/* 夾你嘅地區。面板同地圖篩選一定要行同一條數 —— 之前面板用寒熱命，
   地圖篩選用扶抑用神加一張寫死嘅五區表，所以面板叫你睇觀塘，撳「睇合
   我嘅樓」之後個地圖淨係剩返新界。 */
/* 邊幾個人計緊。

   之前成個 app 淨係用 `birth`（戶主自己），所以加咗屋企人之後，地區、
   樓宇清單、地圖篩選、清單頂嗰條橫額，一個字都唔會變 —— 用家加完人見唔
   到任何分別，會以為冇 save 到。

   而家一處計，全部跟：冇登入或者未加人就係你自己一個；加咗就係撳住咗
   嗰幾個。 */
function counted(){
  if(IS_TRIAL) return trialReportPeople || trialMapPeople || trialPeople().filter(famOn);
  const on = (me && family.length) ? family.filter(famOn) : [];
  if(on.length) return on;
  return birth ? [birth] : [];
}

/** 逐個人嘅寒熱命同權重，用嚟砌地區排名。 */
function chartsOf(people){
  if(!bzMod) return [];
  return people.map(p => {
    const hh = p.h == null ? 12 : p.h;
    const c = bzMod.chart(p.y, p.m, p.d, hh, 0);
    const hc = bzMod.hotCold(p.y, p.m, p.d, hh, 0);
    if(!c || !hc) return null;
    return {p, hc, w: wxWeights(hc.like, bzMod.strength(c).pct)};
  }).filter(Boolean);
}

/** 一幢樓對成屋人嘅分 —— 逐個人計完取平均。 */
function houseFit(o){
  const ppl = counted();
  if(!ppl.length) return null;
  let t = 0;
  for(const p of ppl){
    const f = fitOf(o, p);
    if(f == null) return null;
    t += f;
  }
  return Math.round(t / ppl.length);
}

/* 地區排名。一個人就係佢自己嗰份；一屋人就逐個計完取平均 —— 同樓宇嗰邊
   用同一條規矩，唔好一處平均一處唔平均。 */
/* ── 邊度先算「佢關心」：唔好問，睇佢做過乜 ──────────────────

   問「你住邊？喺邊返工？」係最易嚇走人嘅一類問題，而且多數人唔會答 ——
   佢入嚟係想睇自己幢樓，唔係想填表。

   但佢由入嚟到而家已經講晒答案：撳過邊幾幢樓、收藏咗乜、搜尋跳咗去邊。
   我哋幫每一個區積分，重嘅動作分數高（收藏 > 撳入一幢樓 > 掃過），
   跟住由呢個分推佢實際考慮緊邊一頭。

   分數存喺部機，唔會上伺服器 —— 呢啲係「佢睇過咩」，同出生日期一樣
   敏感。 */
const INT_KEY = (IS_TRIAL ? "trial_v2_" : "") + "fs_interest";
const INT_W = {fav: 6, pick: 4, open: 3, search: 3, browse: 1};

/* 啲分要識退。半年前掃過屯門唔代表今日仲喺度睇緊屯門 —— 冇衰減嘅話,
   一個人搬完屋之後成世都會見到舊嗰頭嘅答案。

   三十日半衰期：每次載入按上次存檔之後過咗幾耐，將全部分數乘
   0.5^(日數/30)，跟住今次 session 嘅新動作先以全分加落去。咁樣
   每一個動作嘅實際權重就係 w·0.5^(過咗幾耐/30)，即係一個標準嘅
   指數衰減，唔使逐件事記時間。 */
const INT_HALF_LIFE_D = 30;
let interest = (() => {
  try{
    const raw = JSON.parse(localStorage.getItem(INT_KEY) || "null");
    if(!raw || typeof raw !== "object") return {};
    // 舊格式係淨係得 {區: 分}。當佢啱啱先發生 —— 唔好一次過清走人哋嘅紀錄。
    const scores = (raw.scores && typeof raw.scores === "object") ? raw.scores : raw;
    const days = Math.max(0, (Date.now() - (+raw.at || Date.now())) / 864e5);
    const k = Math.pow(0.5, days / INT_HALF_LIFE_D);
    const out = {};
    for(const [t, v] of Object.entries(scores)){
      const nv = (+v || 0) * k;
      if(nv >= 0.5) out[t] = Math.round(nv * 100) / 100;   // 退到冇聲氣就唔好留
    }
    return out;
  }catch{ return {}; }
})();
function saveInterest(){
  try{
    localStorage.setItem(INT_KEY, JSON.stringify({scores: interest, at: Date.now()}));
  }catch{}
}
function noteInterest(tc, kind){
  const t = clean(tc);
  if(!t) return;
  interest[t] = (interest[t] || 0) + (INT_W[kind] || 1);
  saveInterest();
}

/* 由積分推返佢關心邊一頭。返 null 即係未夠料講得出任何嘢 —— 嗰陣寧願
   照出全港，唔好靠估。 */
function focusOf(){
  const ent = Object.entries(interest).filter(([, v]) => v > 0)
                    .sort((a, b) => b[1] - a[1]);
  if(!ent.length) return null;
  const total = ent.reduce((t, [, v]) => t + v, 0);

  // 先按大區加總。攞單一個區最高分係錯嘅：一個收藏（6）會贏到三個
  // 港島區（各 3），於是一個由頭到尾睇緊港島嘅人被當成新界東。
  const byRegion = Object.entries(REGIONS).map(([r, ds]) => [r,
    ent.filter(([t]) => ds.includes(t)).reduce((t, [, x]) => t + x, 0)])
    .filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);

  // 兩個大區打平就唔好揀邊個 —— 寧願話「睇唔出」。
  const tie = byRegion.length > 1 && byRegion[0][1] === byRegion[1][1];
  const region = (byRegion.length && !tie) ? byRegion[0][0] : null;
  const regionScore = region ? byRegion[0][1] : 0;

  return {tc: ent[0][0], score: ent[0][1], share: ent[0][1] / total, region,
          regionShare: region ? regionScore / total : 0, total,
          anyFav: ent.some(([t]) => (interest[t] || 0) >= INT_W.fav)};
}

/* 八字計完之後，先決定出咩俾佢睇。三種情況三個做法 —— 唔係永遠同一版。

   focus：佢一路喺同一邊度揾（六成以上動作落喺同一個大區），而且動作夠多。
          咁就唔好再叫佢睇全港排名 —— 直接出嗰頭嘅樓，區排名擺落後面。
   hint ：有明顯一個區，但散開咗。照出全港排名，不過揀區個掣預設佢嗰個。
   wide ：乜都未做過就直接打八字。照出全港，冇得估就唔好估。

   門檻 8 分 = 撳過兩三幢樓，或者收藏過一個。低過呢個數，推斷唔可靠。 */
function baziPlan(){
  const f = focusOf();
  if(!f || (f.total < 8 && !f.anyFav)) return {mode: "wide", f: null};
  if(f.region && f.regionShare >= 0.6) return {mode: "focus", f};
  return {mode: "hint", f};
}

/* 揀區清單嘅大分組。同 REGIONS 唔同：REGIONS 要分新界東西，因為佢係
   用嚟推「佢住得去邊」，而東西之間返工差好遠。但人排清單嗰陣，腦入面
   得三四個大區。 */
const AREA_GROUPS = {
  "香港島": ["中西區", "灣仔區", "東區", "南區"],
  "九龍":   ["油尖旺區", "深水埗區", "九龍城區", "黃大仙區", "觀塘區"],
  "新界":   ["沙田區", "大埔區", "北區", "西貢區", "荃灣區", "葵青區", "屯門區", "元朗區"],
  "離島":   ["離島區"],
};
const GROUP_OF_REGION = {
  "港島": "香港島", "九龍": "九龍",
  "新界東": "新界", "新界西": "新界", "離島": "離島",
};

const LIV_KEY = (IS_TRIAL ? "trial_v2_" : "") + "fs_livable";
const REGIONS = {
  "港島":   ["中西區", "灣仔區", "東區", "南區"],
  "九龍":   ["油尖旺區", "深水埗區", "九龍城區", "黃大仙區", "觀塘區"],
  "新界東": ["沙田區", "大埔區", "北區", "西貢區"],
  "新界西": ["荃灣區", "葵青區", "屯門區", "元朗區"],
  "離島":   ["離島區"],
};
let livable = (() => {
  try{
    const v = JSON.parse(localStorage.getItem(LIV_KEY) || "[]");
    return new Set(Array.isArray(v) ? v : []);
  }catch{ return new Set(); }
})();
let livAuto = null;      // 由行為推出嚟嘅範圍，唔存落部機 —— 佢隨時會變
/* 佢自己揀過就用佢嗰個，冇揀過就用推出嚟嗰個，兩樣都冇就係全港。 */
const livSet = () => (livable.size ? livable : livAuto);
const livOn = () => !!(livSet() && livSet().size);
const inLiv = tc => !livOn() || livSet().has(tc);
function setLivable(next){
  livable = next;
  try{ localStorage.setItem(LIV_KEY, JSON.stringify([...livable])); }catch{}
  areaFitCache = null; areaFitKey = null; wCache.clear();
}

function rankAreas(n = 6){
  const ppl = counted();
  const cs = chartsOf(ppl);
  if(!cs.length || !elemData || !districtData.length) return {cs, areas: []};
  const lead = cs[0];
  const areas = districtData.map(d => {
    const e = elemData[d.tc];
    if(!e) return null;
    const each = cs.map(c => c.w.reduce((t, [w, k]) => t + k * fitFor(e, w), 0));
    return {tc: d.tc, avg: d.avg, n: d.n, e, wx: lead.hc.like[0], dir: e.zone,
            f1: fitFor(e, lead.hc.like[0]), f2: fitFor(e, lead.hc.like[1]),
            fit: Math.round(each.reduce((t, v) => t + v, 0) / each.length)};
  }).filter(Boolean);
  const byFit = (a, b) => b.fit - a.fit;
  const all = [...areas].sort(byFit);           // 唔受範圍限制 —— 用嚟老實講「全港最夾嘅係邊個」
  const lv = livSet();
  let pick = livOn() ? areas.filter(a => lv.has(a.tc)) : areas;
  if(!pick.length) pick = areas;                // 範圍揀到一個區都冇就跌返全港
  return {cs, areas: pick.sort(byFit).slice(0, n), all};
}

const NO_FORM = "金";
function fitFor(d, wx){
  if(wx === NO_FORM) return d.dir_wx === "金" ? 70 : 30;
  return d.form[wx];
}

/* 每個結論都要講得出量咗啲乜。冇數字嘅推薦同街邊嗰啲清單冇分別。 */
const REASON = {
  木: d => `平均樓高 ${d.h_med} 米，高度係地基闊度嘅 ${d.slender} 倍`,
  土: d => `平均樓高得 ${d.h_med} 米，矮而闊`,
  火: d => `${d.spike.toFixed(1)}% 樓宇高出四周一倍以上，每平方公里 ${d.density} 幢`,
  水: d => `${d.shore.toFixed(1)}% 住宅喺離水邊 200 米內`,
  金: d => d.dir_wx === "金" ? "位處全港西面" : "唔喺全港西面",
};
const MEASURED = wx => wx !== NO_FORM;

/* ---------- 八字 ----------

   點解八字係一個「篩選」，唔係另開一個 tab：佢答嘅係同一條問題 ——
   「邊幾幢樓啱我」。撳落去，地圖同清單就只剩返合你命卦嘅樓，同「收藏」
   完全一樣嘅行為。另開一個 tab 就變成兩個唔相干嘅 app 住喺一齊。

   出生資料淨係存喺呢部機（localStorage），唔會上伺服器 —— 排盤同配樓
   全部喺瀏覽器度計，所以做得到。私隱政策第三節有寫。 */

   時間佢係「有值但未 ready」—— 嗰陣任何人撞正嚟 chart() 就會掟
   「要先 await ready()」。由地圖直接撳一幢樓入去，就啱啱撞正嗰段。 */
let bzLoading = null;
async function ensureBazi(){
  if(bzMod) return bzMod;
  if(!bzLoading) bzLoading = (async () => {
    const m = await import("./bazi.js?v=" + BUILD_ID);
    await m.ready(dataUrl("../solar_terms.json"));
    return (bzMod = m);
  })().catch(e => { bzLoading = null; throw e; });
  return bzLoading;
}

function myGua(){
  if(!birth || !bzMod) return null;
  // 命卦要用八字年（立春為界），所以要行一次排盤先攞到年份。
  const c = bzMod.chart(birth.y, birth.m, birth.d,
                        birth.h == null ? 12 : birth.h, 0);

}

function bindTrialPickers(f){
  f.querySelectorAll('[data-picker]').forEach(trigger=>trigger.onclick=()=>{
    if(document.querySelector('.ios-picker'))return;
    const time=trigger.dataset.picker==='time',get=id=>f.querySelector('#'+id);
    let year=+get('bzY').value||1990,month=+get('bzM').value||1,day=+get('bzD').value||1,hour=get('bzH').value;
    const dialog=document.createElement('dialog');dialog.className='ios-picker';dialog.setAttribute('aria-labelledby','pickerTitle');
    dialog.innerHTML=`<header><button type="button" data-cancel>取消</button><h2 id="pickerTitle">${time?'出生時間':'出生日期'}</h2><button type="button" data-done>完成</button></header><p class="wheel-help">上下滑動選擇，再撳完成</p><div class="birth-wheels"></div>`;
    document.body.append(dialog);dialog.showModal();
    const wheels=dialog.querySelector('.birth-wheels');let dayWheel;
    function wheel(label,options,value,change){
      const box=document.createElement('div');box.className='birth-wheel';box.tabIndex=0;box.setAttribute('role','listbox');box.setAttribute('aria-label',label);
      wheels.append(box);let values=options;
      const update=()=>{const i=Math.max(0,Math.min(values.length-1,Math.round(box.scrollTop/44)));value=values[i][0];box.querySelectorAll('[role="option"]').forEach((o,j)=>o.setAttribute('aria-selected',String(i===j)));box.setAttribute('aria-activedescendant',box.children[i].id);change(value);};
      function set(next,selected){values=next;box.innerHTML=values.map(([v,t],i)=>`<div role="option" id="wheel-${label}-${i}" aria-selected="${v===selected}">${t}</div>`).join('');box.scrollTop=Math.max(0,values.findIndex(([v])=>v===selected))*44;}
      set(options,value);box.addEventListener('scroll',update,{passive:true});
      box.onkeydown=e=>{const dir=e.key==='ArrowDown'?1:e.key==='ArrowUp'?-1:0;if(dir){e.preventDefault();box.scrollTo({top:box.scrollTop+dir*44,behavior:'instant'});update();}};
      box.onclick=e=>{const i=[...box.children].indexOf(e.target);if(i>=0){box.scrollTo({top:i*44,behavior:'smooth'});}};
      return {set};
    }
    const numbers=(n,suffix,start=1)=>Array.from({length:n},(_,i)=>[start+i,(start+i)+suffix]);
    function days(){const max=new Date(year,month,0).getDate();day=Math.min(day,max);dayWheel?.set(numbers(max,'日'),day);}
    if(time)wheel('時間',[['','唔記得／唔提供'],...SHICHEN.map(([z,t,h])=>[String(h),t])],hour,v=>hour=v);
    else{
      wheel('年',numbers(new Date().getFullYear()-1899,'年',1900),year,v=>{if(year!==v){year=v;days();}});
      wheel('月',numbers(12,'月'),month,v=>{if(month!==v){month=v;days();}});
      dayWheel=wheel('日',numbers(new Date(year,month,0).getDate(),'日'),day,v=>day=v);
    }
    const close=()=>{dialog.close();dialog.remove();trigger.focus();};
    dialog.querySelector('[data-cancel]').onclick=close;dialog.addEventListener('cancel',e=>{e.preventDefault();close();});
    dialog.querySelector('[data-done]').onclick=()=>{
      if(time){get('bzH').value=hour;trigger.innerHTML=(hour===''?'唔記得出生時間':SHICHEN.find(x=>String(x[2])===hour)?.[1])+' <span>⌄</span>';}
      else{if(new Date(year,month-1,day)>new Date()){toast('生日唔可以係將來日期');return;}get('bzY').value=year;get('bzM').value=month;get('bzD').value=day;trigger.innerHTML=`${year} 年 ${month} 月 ${day} 日 <span>⌄</span>`;}
      close();
    };
  });
}

const SHENG_ = {木:"火", 火:"土", 土:"金", 金:"水", 水:"木"};
function whyLine(wx){
  if(!bzMod || !birth) return "";
  const hc = bzMod.hotCold(birth.y, birth.m, birth.d,
                           birth.h == null ? 12 : birth.h, 0);
  if(hc.like.includes(wx)){
    const first = hc.like[0];
    if(wx === first) return `你${hc.type}，喜${first} —— 呢個方位就係你要嗰個。`;
    // 木生火，而火就係佢喜嗰個 —— 唔好寫成「火就係火」。
    if(SHENG_[wx] === first) return `你${hc.type}，喜${first}；${wx}生${first}，所以${wx}都幫到你。`;
    return `你${hc.type}，喜${first}；${wx}同${first}同氣，所以${wx}都幫到你。`;
  }
  return `扶抑用神入面有${wx}。`;
}

async function showBazi(edit){
  await ensureBazi();
  // 地區清單要 district_stats（幢數、平均分）同 elements（每區量出嚟嘅形）
  // 兩份都齊先砌得出。八字面板可以喺佢哋載入之前就開咗，嗰陣清單會係空嘅
  // —— 所以等埋。
  if(!districtData.length) await loadDistricts().catch(() => {});
  if(!elemData) await loadElements();
  gripText.textContent = IS_TRIAL ? "填生日" : "八字";
  setView("bazi");
  if(!birth || edit){
    setSheet("full");                   // 表格太長，half 之下個掣喺畫面外
    sheetBody.innerHTML = personalTarget ? `<div class="journey">${IS_TRIAL?trialSteps(3):'<p class="jstep">填出生資料</p>'}<h2>你幾時出世？</h2><div class="jcontext">${esc(clean(personalTarget.tc)||clean(personalTarget.en))}</div>${bzForm(true).replace(/<p class="bname">[\s\S]*?<\/p>/,'').replace('改咗之後，地區、樓宇同屋企人嗰邊會即刻重新計過。','填生日，就可以睇同呢座樓夾唔夾。').replace('>存返</button>','>睇呢座嘅個人結果</button>')}<button class="jmap" id="birthMap">先睇地圖</button></div>` : bzForm(edit && birth ? true : false);
    const birthMap=sheetBody.querySelector('#birthMap');if(birthMap)birthMap.onclick=()=>setSheet('peek');
    track("bazi_setup_start", {entry:personalTarget ? "building" : "general"});
    const f = sheetBody;
    if(IS_TRIAL)bindTrialPickers(f);
    let sex = edit && birth ? birth.male : null;
    f.querySelectorAll(".bzsex button").forEach(b => b.addEventListener("click", () => {
      sex = b.dataset.sex === "1";
      f.querySelectorAll(".bzsex button").forEach(x => {x.classList.toggle("on", x === b);x.setAttribute("aria-pressed",String(x===b));});
    }));
    f.querySelector("#bzGo").addEventListener("click", () => {
      if(sex === null){ needSex(); return; }
      const h = f.querySelector("#bzH").value;
      const yy=+f.querySelector("#bzY").value, mm=+f.querySelector("#bzM").value, dd=+f.querySelector("#bzD").value;
      const date=new Date(yy,mm-1,dd);
      if(!Number.isInteger(yy) || yy<1900 || !mm || !dd || date.getMonth()!==mm-1 || date.getDate()!==dd || date>new Date()){ toast("請揀有效嘅出生日期"); return; }
      birth = {y: +f.querySelector("#bzY").value, m: +f.querySelector("#bzM").value,
               d: +f.querySelector("#bzD").value, h: h === "" ? null : +h, male: sex};
      try{ localStorage.setItem(BIRTH_KEY, JSON.stringify(birth)); }catch{}
      wCache.clear();
      if(me) syncBirth();                 // 改咗就推返上戶口，唔係淨係改咗部機
      track("bazi_saved", {has_hour: h !== "", edit: !!edit});
      track("bazi_setup_complete", {has_hour:h !== "",entry:personalTarget?"building":"general"});
      if(personalTarget) showPersonalResult(personalTarget); else showBazi();
    });
    return;
  }
  sheetBody.innerHTML = bzResult();
  // 電腦版個側欄唔係用 transform 郁，所以永遠唔會 fire transitionend ——
  // 嗰邊要喺呢度直接叫。frameLivable 自己會睇幅地圖見唔見到，電話版
  // 面板攤到全屏嗰陣佢會自己跳過。
  // 一個 rAF 唔夠：側欄嘅版面（--rail-top 由 ResizeObserver 度）嗰陣仲未
  // 定，sheetPad() 會當幅地圖俾冚住而跳過。frameLivable 係冪等嘅，
  // 叫多次冇代價。
  requestAnimationFrame(() => requestAnimationFrame(frameLivable));
  setTimeout(frameLivable, 300);
  const bf = sheetBody.querySelector("#bzFam");
  if(bf) bf.addEventListener("click", () => {
    track("family_cta", {from: "bazi"});
    if(!me){ askSignIn(null); return; }
    pushBack("八字", () => showBazi());
    showFamily();
  });
  sheetBody.querySelectorAll(".livchips button").forEach(b =>
    b.addEventListener("click", () => {
      const ds = REGIONS[b.dataset.r] || [];
      // 由而家實際計緊嗰個範圍做起點 —— 推斷出嚟嗰個一改就變咗佢自己揀。
      const next = new Set(livSet() || []);
      // 成個範圍已經揀晒就當撳一下係取消，否則補齊佢
      if(ds.every(d => next.has(d))) ds.forEach(d => next.delete(d));
      else ds.forEach(d => next.add(d));
      setLivable(next);
      livAuto = null;                      // 佢講咗嘢，就唔再靠估
      track("livable_set", {regions: [...next].length, from: "chip"});
      refreshGuaDirs();                    // 可住範圍一改，建議地區跟住改
      showBazi();
    }));
  const lc = sheetBody.querySelector("#livClear");
  if(lc) lc.addEventListener("click", () => {
    setLivable(new Set());
    livAuto = null;
    track("livable_set", {regions: 0, from: "clear"});
    refreshGuaDirs();
    showBazi();
  });

  const bl = sheetBody.querySelector("#bzGoList");
  if(bl) bl.addEventListener("click", () => {
    const d = sheetBody.querySelector("#bzPickD").value;
    guaOn = true;
    favView = false; sharedList = null; pickingDistrict = false; groupSel = null;
    document.getElementById("btnGua").classList.add("on");
    refreshGuaDirs();
    setDistrict(d);                       // 更新 chip、飛過去嗰區
    track("bazi_to_list", {district: d});
    pushBack("八字", () => showBazi());   // 睇完有得返返嚟
    loadBuildings(); drawDistricts(); showOverview();
  });
  // 三個 tab。唔用 URL、唔記 state —— 每次開返個八字版都由第一版開始,
  // 因為第一版係「你係咩命」，永遠係最應該先睇嗰版。
  sheetBody.querySelectorAll(".mtab").forEach(t =>
    t.addEventListener("click", () => {
      const w = t.closest(".mwrap"), k = t.dataset.mp;
      w.querySelectorAll(".mtab").forEach(x => x.classList.toggle("on", x === t));
      w.querySelectorAll(".mpane").forEach(x => x.classList.toggle("on", x.dataset.mp === k));
      bzTab = k;
      track("bazi_tab", {tab: k});
    }));

  const bs = sheetBody.querySelector("#bzShare");
  if(bs) bs.addEventListener("click", shareBazi);
  const be = sheetBody.querySelector("#bzEdit");
  if(be) be.addEventListener("click", () => {
    pushBack("八字", () => showBazi());
    showBazi(true);
  });
  const lg = sheetBody.querySelector("#bzLogin");
  if(lg) lg.addEventListener("click", () => {
    track("bazi_signin_prompt", {});
    askSignIn(null);
  });
  sheetBody.querySelectorAll(".area").forEach(b => b.addEventListener("click", () => {
    if(b.classList.contains("lock")){
      track("bazi_signin_prompt", {from: "area"});
      askSignIn(null);
      return;
    }
    // 揀咗區就即刻入到嗰區嘅屋苑清單，同時保留八宅篩選。
    // 留返條路返八字 —— 之前撳咗入去就再望唔返邊幾個區啱自己。
    pushBack("八字", () => { groupSel = null; showBazi(); });
    groupSel = null;
    districtFilter = b.dataset.d;
    guaOn = true;
    favView = false; sharedList = null; pickingDistrict = false;
    document.getElementById("btnGua").classList.add("on");
    refreshGuaDirs();
    track("bazi_area", {district: districtFilter});
    const d = districtData.find(x => x.tc === districtFilter);
    if(d) map.setView([d.lat, d.lon], 14);
    loadBuildings(); drawDistricts(); showOverview();
  }));
  sheetBody.querySelector("#bzSee").addEventListener("click", () => {
    guaOn = true;
    favView = false; sharedList = null; pickingDistrict = false;
    document.getElementById("btnGua").classList.add("on");
    refreshGuaDirs();
    track("bazi_filter", {on: true, gua: myGua()});
    loadBuildings(); drawDistricts(); showOverview();
  });
  sheetBody.querySelector("#bzDel").addEventListener("click", async () => {
    if(!confirm(me ? "刪除你嘅出生資料？部機同戶口嗰份都會清走，下次要再輸入一次。"
                   : "刪除你嘅出生資料？下次要再輸入一次。")) return;
    birth = null;
    try{ localStorage.removeItem(BIRTH_KEY); }catch{}
    // 私隱政策寫明「部機同戶口都會清走」—— 所以真係要清埋戶口嗰份。
    if(sb && me){
      try{
        await sb.from("persons")
          .update({birth_at: null, birth_tz: null, birth_lat: null,
                   birth_lon: null, sex: null, hour_known: false})
          .eq("is_self", true);
      }catch{ toast("戶口嗰份清唔到，請稍後再試"); }
    }
    track("bazi_cleared", {});
    guaOn = false;
    document.getElementById("btnGua").classList.remove("on");
    refreshGuaDirs();
    showBazi();
    loadBuildings(); drawDistricts();
  });
}

document.getElementById("btnGua").addEventListener("click", async () => {
  personalTarget=null;
  await ensureBazi();
  if(!birth){                       // 未有資料：開表，但唔好即刻篩
    guaOn = false;
    document.getElementById("btnGua").classList.remove("on");
    openSheet(); setSheet("full");
    showBazi();
    track("bazi_open", {has_birth: false});
    return;

  guaOn = !guaOn;

let searchIndex=null, searchLoading=null;
async function ensureIndex(){
  if(searchIndex) return searchIndex;
  if(!searchLoading){
    searchLoading = fetch(dataUrl('search.json')).then(r=>r.json()).then(d=>{
      searchIndex = d.b.map(row=>{
        const o={}; d.c.forEach((k,i)=>o[k]=row[i]); return o;
      });
      return searchIndex;
    }).catch(()=>{ searchIndex=[]; return searchIndex; });
  }
  return searchLoading;
}

/* 搜尋一邊打一邊出結果，所以 doSearch 一次打字會跑好多次 —— 之前每次都
   報一個 search 事件，令到「554 次搜尋」其實係 38 個人打字嘅過程。
   報告要獨立 debounce：打完停一停先報一次，而且要報埋出咗幾多個結果，
   因為「搵唔到」先係真正要知嘅嘢。 */
let reportT = null, lastReported = "";
function reportSearch(q, results, source){
  clearTimeout(reportT);
  reportT = setTimeout(() => {
    if(q === lastReported) return;         // 同一個字唔好報兩次
    lastReported = q;
    trip.searches++;
    if(!results) trip.no_result++;
    track("search", {term: q, results, source, found: results > 0});
    if(!results) track("search_no_result", {term: q});
  }, 1200);
}

async function doSearch(){
  const q=qEl.value.trim(); if(q.length<2) return;
  resEl.innerHTML=`<li class="empty">搜尋中…</li>`; resEl.classList.add("show");

  const idx=await ensureIndex();
  const needle=q.toLowerCase();
  const hits=[];
  // 屋苑名都要搜得到。打「太古城」應該出佢六十幾座，唔係淨係出座名
  // 入面啱啱好有嗰三個字嗰幾幢 —— 座名同屋苑名好多時完全唔似。
  // 座名撞中排先，屋苑撞中排後，因為打全名嗰個人多數搵緊嗰一座。
  const byName=[], byEstate=[];
  for(const o of idx){
    if((o.tc && o.tc.includes(q)) || (o.en && o.en.toLowerCase().includes(needle))){
      byName.push(o);
    } else if(o.est && o.est.includes(q)){
      byEstate.push(o);
    }
    // 收夠先停，唔係一撞夠十二個座名就停 —— 太古城有七個「太古城中心」
    // 咁樣嘅座名，全部非住宅，一停就永遠見唔到佢啲住宅座數。
    if(byName.length + byEstate.length >= 60) break;
  }
  // 住宅行先，兩桶一齊排。打「太古城」嘅人想見住宅座數，唔係太古城中心
  // 同第一期停車場 —— 三樣都叫太古城，但得一樣係人哋搵緊嗰樣。
  // 住宅入面，座名撞中排先過屋苑撞中：打全名嗰個人多數搵緊嗰一座。
  hits.push(...byName.filter(o=>o.res), ...byEstate.filter(o=>o.res),
            ...byName.filter(o=>!o.res), ...byEstate.filter(o=>!o.res));
  hits.length = Math.min(hits.length, 12);
  if(hits.length){
    // 過半結果屬同一個屋苑，而個屋苑名又撞中佢打嘅字 —— 開個標題，
    // 等佢認得返自己打嗰幾隻字。
    const tally = {};
    for(const h of hits){
      const e = clean(h.est);
      if(e && e.includes(q)) tally[e] = (tally[e] || 0) + 1;
    }
    const top = Object.entries(tally).sort((a,b) => b[1]-a[1])[0];
    const estHead = (top && top[1] >= Math.ceil(hits.length/2)) ? top[0] : null;
    reportSearch(q, hits.length, "index"); renderHits(hits, estHead); return;
  }

  const als=await searchALS(q);
  if(als.length){ reportSearch(q, als.length, "address"); renderHits(als); return; }
  reportSearch(q, 0, "none");
  resEl.innerHTML=`<li class="empty">搵唔到「${esc(q)}」，試下屋苑名或街道名。</li>`;
}

// Falls back to the Government address service when a name is not in our
// index - covers street addresses and estates whose block names differ.
async function searchALS(q){
  try{
    const d=await (await fetch(`${ALS}?q=${encodeURIComponent(q)}&n=8`,
                               {headers:{Accept:"application/json"}})).json();
    return (d.SuggestedAddress||[]).map(s=>{
      const pa=s.Address.PremisesAddress, c=pa.ChiPremisesAddress||{}, en=pa.EngPremisesAddress||{};
      const g=pa.GeospatialInformation||{}, st=c.ChiStreet||{};
      return { kind:"als", total:null,
        tc:c.BuildingName||en.BuildingName||((st.StreetName||"")+(st.BuildingNoFrom||"")),
        note:[(c.ChiEstate||{}).EstateName,
              (st.StreetName||"")+(st.BuildingNoFrom?` ${st.BuildingNoFrom}號`:""),
              (c.ChiDistrict||{}).DcDistrict].filter(Boolean).join(" · "),
        lat:+g.Latitude, lon:+g.Longitude };
    }).filter(x=>x.lat&&x.lon);
  }catch{ return []; }
}

function renderHits(hits, estHead){
  if(IS_TRIAL) return trialHits(hits, estHead);
  const head = estHead
    ? `<li class="grp">${esc(estHead)}<span>逐座列出</span></li>` : "";
  resEl.innerHTML=head+hits.map((h,i)=>{
    const name=clean(h.tc)||clean(h.en)||h.name||"—";
    // 屋苑名行先 —— 搵嘅人打嘅係屋苑名，佢要認得返自己打嗰幾隻字。
    const est=clean(h.est);
    const note=[est && est!==name ? est : null,
                clean(h.district), h.note, nowPlain(h.now)].filter(Boolean).join(" · ");
    return `<li data-i="${i}">
      ${h.total!=null?`<span class="pill" style="background:${colorFor(h.total)}">${h.total.toFixed(0)}</span>`:""}
      <div class="nm">${esc(name)}</div><div class="ad">${esc(note)}</div></li>`;
  }).join("");
  [...resEl.querySelectorAll("li[data-i]")].forEach(li=>
    li.addEventListener("click",()=>goto(hits[+li.dataset.i])));
}

function goto(h){
  noteInterest(h.district, "search");      // 搜尋跳過去 —— 佢主動揾嗰度
  resEl.classList.remove("show"); qEl.blur();
  const lat=h.lat, lon=h.lon!==undefined?h.lon:h.lng;
  map.setView([lat,lon],17);
  if(h.kind==="als"){
    L.circleMarker([lat,lon],{radius:8,color:"#fff",weight:3,
                              fillColor:"#e0562a",fillOpacity:1}).addTo(map);
    toast("撳附近嘅樓宇睇評分");
  }
  // Let the tiles land, then pick out the building that was searched for.
  loadBuildings().then(()=>{
    let best=null, bestD=Infinity;
    buildingLayer.eachLayer(l=>{
      const c=l.getBounds?l.getBounds().getCenter():l.getLatLng();
      const d=(c.lat-lat)**2+(c.lng-lon)**2;
      if(d<bestD){ bestD=d; best=l; }
    });
    if(best && bestD < 1e-7) best.fire("click");
  });
}
