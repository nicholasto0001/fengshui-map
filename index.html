   而一擋，ensureSupabase 就返 null，登入直接死 —— 用家只見到一句
   「連唔到伺服器」，唔會知係俾自己部機擋咗。同源就冇呢個問題。

   build.sh 會喺出版嗰陣抽一份落 public/vendor/。抽唔到（例如本機開發
   冇網絡）就照用 CDN。 */
const SUPA_JS  = "vendor/supabase.js";
const SUPA_JS_CDN = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js";
const PRIVACY_VERSION = "2026-09-20";

let sb = null, me = null, myLists = [], curListId = null;
let sbLoading = null;

const LAST_LIST_KEY = "fs_last_list";

function loadScript(src){
  return new Promise((res, rej) => {
    const el = document.createElement("script");
    el.src = src; el.async = true;
    el.onload = res; el.onerror = () => rej(new Error(src));
    document.head.appendChild(el);
  });
}

// Staging authenticates with the existing service, but never runs the legacy
// member sync or sends database writes. Keep its session in a separate key.
let trialAuthClient=null,trialAuthLoading=null,trialUser=null;
const TRIAL_AUTH_KEY='fs_trial_auth_v1';
async function ensureTrialAuth(){
  if(!IS_TRIAL)return null;
  if(trialAuthClient)return trialAuthClient;
  if(!trialAuthLoading)trialAuthLoading=loadScript(SUPA_JS).then(()=>{
    trialAuthClient=window.supabase.createClient(SUPA_URL,SUPA_KEY,{auth:{storageKey:TRIAL_AUTH_KEY,persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'},global:{fetch:(url,options)=>{
      const target=new URL(typeof url==='string'?url:url.url);
      if(target.origin!==SUPA_URL||!target.pathname.startsWith('/auth/v1/'))return Promise.reject(Error('Staging member data access disabled'));
      return fetch(url,options);
    }}});
    trialAuthClient.auth.onAuthStateChange((_event,session)=>{trialUser=session?.user||null;});
    return trialAuthClient;
  }).catch(()=>{trialAuthLoading=null;toast('暫時連唔到登入服務，請再試。');return null;});
  return trialAuthLoading;
}
async function trialSignIn(){
  const client=await ensureTrialAuth();if(!client)return;
  const redirect=new URL(location.href);redirect.hash='';redirect.searchParams.delete('code');
  if(!redirect.searchParams.has('b'))redirect.searchParams.set('member','1');
  const {error}=await client.auth.signInWithOAuth({provider:'google',options:{redirectTo:redirect.href}});
  if(error)toast('登入未能開始；你揀嘅樓座仍然保留。');
}
async function trialSignOut(){
  if(!trialAuthClient)return;
  const {error}=await trialAuthClient.auth.signOut({scope:'local'});
  if(error){toast('未能登出，請再試。');return;}
  trialUser=null;trialProfile();
}
async function bootTrialAuth(){
  if(!hasAuthResponse()&&!localStorage.getItem(TRIAL_AUTH_KEY))return;
  const client=await ensureTrialAuth();if(!client)return;
  const {data,error}=await client.auth.getUser();trialUser=error?null:data?.user||null;
  if(hasAuthResponse()){
    const u=new URL(location.href);u.searchParams.delete('code');u.hash='';history.replaceState(null,'',u.href);
    if(!trialUser)toast('登入未完成，可以再試；樓座仍然保留。');
  }
}
function trialMemberUI(){return trialUser?`<p class="trial-note">已用現有 Google 會員登入 · ${esc(trialUser.email||'')}</p><button class="jmap" id="trialLogout">登出測試版</button><p class="trial-note">呢度嘅生日、家庭及收藏仍只留喺此裝置，唔會覆蓋正式戶口。</p>`:`<button class="pbtn" id="trialLogin">用 Google 登入</button><p class="trial-note">沿用現有會員登入；測試資料唔會自動同步到正式戶口。</p>`;}
function bindTrialMemberUI(){const login=document.getElementById('trialLogin'),logout=document.getElementById('trialLogout');if(login)login.onclick=trialSignIn;if(logout)logout.onclick=trialSignOut;}

async function ensureSupabase(){
  if(IS_TRIAL) return null;
  if(sb) return sb;
  if(!sbLoading) sbLoading = loadScript(SUPA_JS)
    .catch(() => loadScript(SUPA_JS_CDN))
    .then(() => {
    sb = window.supabase.createClient(SUPA_URL, SUPA_KEY, {
      auth: {persistSession: true, autoRefreshToken: true, detectSessionInUrl: true},
    });
    sb.auth.onAuthStateChange((_e, session) => applySession(session));
    return sb;
  }).catch(() => {
    // 冇網絡或者俾攔截器擋住：唔好整冧個地圖，靜靜哋退返去本機收藏。
    sbLoading = null;
    return null;
  });
  return sbLoading;
}

function applySession(session){
  const u = session && session.user;
  me = u ? {
    id: u.id,
    name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || "",
    avatar: (u.user_metadata && u.user_metadata.avatar_url) || "",
    email: u.email || "",
  } : null;
  // GA 認得同一個人喺唔同部機，但收到嘅係一串無意義嘅 id，唔係電郵。
  // No additional config/page_view on authentication; no user ID is sent.
  paintFavChip();
}

/* 由 Google 返嚟嗰陣 URL 會帶住 ?code= 或者 #access_token，要即刻處理，
   唔可以等人撳嘢先至載 library。 */
function hasAuthResponse(){
  return /[?&]code=/.test(location.search) || /access_token=/.test(location.hash);
}

async function signIn(){
  const s = await ensureSupabase();
  if(!s){ toast("連唔到伺服器，請稍後再試"); return; }
  localStorage.setItem("fs_pending_consent", JSON.stringify({
    marketing: !!document.getElementById("optMarketing")?.checked,
    at: Date.now(),
  }));
  track("signin_start", {});
  const {error} = await s.auth.signInWithOAuth({
    provider: "google",
    options: {redirectTo: location.origin + location.pathname + location.search},
  });
  if(error){ track("signin_failed", {reason:"oauth_start"}); toast("登入未能開始，請再試。你揀嘅樓座已保留。"); }
}

async function signOut(){
  if(!sb) return;
  // Staging shares Auth with production: testing logout must not revoke other sessions.
  const {error} = await sb.auth.signOut(location.hostname.endsWith('.workers.dev') ? {scope:'local'} : undefined);
  if(error){ toast("未能登出，請再試。"); return; }
  me = null; myLists = []; curListId = null;
  track("signout", {});
  loadLocalFavs();
  showFavs();
}

/* 登入之後第一件事 —— 靜靜哋做，唔好彈框問「要唔要合併」。 */
async function afterSignIn(){
  let pending = null;
  try{ pending = JSON.parse(localStorage.getItem("fs_pending_consent") || "null"); }catch{}
  if(pending){
    localStorage.removeItem("fs_pending_consent");
    await sb.from("consents").insert([
      {user_id: me.id, kind: "privacy",   version: PRIVACY_VERSION, granted: true, source: "signup"},
      {user_id: me.id, kind: "marketing", version: PRIVACY_VERSION, granted: !!pending.marketing, source: "signup"},
    ]);
    track("signin_done", {marketing: !!pending.marketing});
  }
  await loadLists();
  await mergeLocalFavs();

  // 佢撳收藏先至去登入嘅，返到嚟就要見到收藏咗，唔係要佢再撳多次。
  let pend = null;
  try{ pend = JSON.parse(localStorage.getItem("fs_pending_save") || "null"); }catch{}
  if(pend && curListId){
    localStorage.removeItem("fs_pending_save");
    await serverSave(pend).catch(()=>{});
    track("save_building", {name: pend.tc || pend.en || "", after_signin: true});
    setTimeout(()=>toast(`已收藏「${clean(pend.tc)||clean(pend.en)||"呢棟樓"}」`), 900);
  }
  await loadSaved();
  await syncBirth();
  await loadFamily();
  // 佢係為咗睇解釋先去登入嘅，返到嚟就要見到解釋，唔係要佢自己撳返入去。
  if(birth && new URLSearchParams(location.search).get("intent") !== "personal" && sheetBody.querySelector(".gate, .arealist")){
    refreshGuaDirs();
    showBazi();
  }
}

/* 全家點睇。

   加完人之後，最有用嗰條結論唔係「平均幾多分」，係八宅本身就會問嘅嗰條：
   一屋人係咪同一組宅。八宅將人分東四命同西四命，兩組合嘅屋係相反嘅
   —— 一家人分咗兩邊，就冇一間屋可以同時啱晒，傳統做法係跟家主。

   呢個唔係我哋發明，係八宅本來就要面對嘅情況，所以講得出口。 */
function familySummary(){
  if(!bzMod || !family.length) return null;
  const rows = family.filter(famOn).map(p => {
    const hh = p.h == null ? 12 : p.h;
    const c = bzMod.chart(p.y, p.m, p.d, hh, 0);
    const hc = bzMod.hotCold(p.y, p.m, p.d, hh, 0);
    const g = guaOf(p);
    return {...p, hc, gua: g, group: g ? bzMod.guaGroup(g) : null,
            dirs: g ? bzMod.goodDirs(g) : []};
  }).filter(r => r.hc && r.gua);
  if(!rows.length) return null;

  const east = rows.filter(r => r.group === "東四");
  const west = rows.filter(r => r.group === "西四");
  const want = {};
  for(const r of rows) r.hc.like.forEach((w, i) => want[w] = (want[w] || 0) + (i ? 1 : 2));
  const rank = Object.keys(want).sort((a, b) => want[b] - want[a]);

  // 一家人共同嘅吉方：每個人都當吉嗰幾個。冇交集就係冇，唔砌一個出嚟。
  const shared = rows[0].dirs.filter(d => rows.every(r => r.dirs.includes(d)));
  return {rows, east, west, rank, shared, split: east.length > 0 && west.length > 0};
}

/* 一個人自己嗰版盤。屋企人唔應該淨係得個分 —— 佢哋各自有自己嘅四柱、
   五行、寒熱命同命卦，要睇得到，先信得過個分。 */
function personChart(p){
  const m = bzMod, hh = p.h == null ? 12 : p.h;
  const c = m.chart(p.y, p.m, p.d, hh, 0);
  const st = m.strength(c);
  const hc = m.hotCold(p.y, p.m, p.d, hh, 0);
  const g = guaOf(p);
  const dirs = m.goodDirs(g);
  const known = p.h != null;
  const pil = [["年", c.year], ["月", c.month], ["日", c.day], ["時", known ? c.hour : "—"]];
  const rows = m.WUXING.slice().sort((a, b) => st.pct[b] - st.pct[a]);
  const top = st.pct[rows[0]] || 1;
  return `
    <p class="bname">${esc(p.name || relTC(p.relation))}</p>
    <p class="mcount">${esc(p.is_self ? "自己" : relTC(p.relation))}　·　
      ${p.y} 年 ${p.m} 月 ${p.d} 日　${p.male ? "男" : "女"}${
      known ? "" : "　·　冇時辰"}</p>
    <div class="pillars">${pil.map(([k, v]) =>
      `<div class="pil"><u>${k}柱</u><b>${v}</b></div>`).join("")}</div>
    <div class="wxbox wx-${st.dayWx}">
      <div class="wxg">${st.dayWx}</div>
      <div class="wxt">${esc(p.name || relTC(p.relation))}嘅日主係
        <b>${st.dayMaster}${st.dayWx}</b><br>
        <b>${st.strong ? "身強" : "身弱"}</b>　同我同生我嘅力量佔 ${st.supportPct}%</div>
    </div>

    <h3 class="bzh">五行分佈</h3>
    <div class="wxbars">${rows.map(w => `
      <div class="wxr"><u class="wx-${w}">${w}</u>
        <span class="wtrack"><i class="wx-${w}" style="width:${100 * st.pct[w] / top}%"></i></span>
        <em>${st.pct[w]}%<b>${st.phases[w]}</b></em></div>`).join("")}</div>
    <h3 class="bzh">喜用五行</h3>
    <p class="bznote" style="margin-top:-2px"><b>${hc.type}</b>　喜
      ${hc.like.map(w => `<b class="wx-${w}">${w}</b>`).join("、")}
      —— ${esc(hc.note)}</p>
    <h3 class="bzh">本命卦</h3>
    <div class="guabox"><div class="gg">${g}</div>
      <div class="gt">${esc(p.name || relTC(p.relation))}係<b>${g}命</b>，屬<b>${
        m.guaGroup(g)}命</b>。<br>最旺嘅方位係<b>正${dirs[0]}</b>（${m.LUCK[g][dirs[0]]}）。</div></div>
    <div class="dirs">${dirs.map((d, i) =>
      `<span class="${i === 0 ? "best" : ""}"><b>向${d}</b> ${m.LUCK[g][d]}</span>`).join("")}</div>
    <p class="bznote">呢一版係${esc(p.name || relTC(p.relation))}自己嘅盤，
      同你自己嗰版用完全一樣嘅算法計。樓宇嗰度「夾你」嘅分，就係逐個人
      用各自呢一套計出嚟再合埋。</p>
    <button class="pbtn dark" id="pcEdit" style="margin-top:18px">改${
      esc(p.name || relTC(p.relation))}嘅資料</button>`;
}

/* ---------- 屋企人 ----------

   一個 profile 入面唔只一個八字。呢一版就係管理嗰份名單 —— 加、改、刪。
   要登入先用得，因為呢啲嘢一定要跟住個人走，唔可以淨係留喺一部機。 */
function famForm(p){
  const now = new Date().getFullYear();
  const yrs = [], mos = [], dys = [];
  for(let y = now; y >= 1900; y--) yrs.push(`<option value="${y}"${p && p.y === y ? " selected" : ""}>${y}</option>`);
  for(let m = 1; m <= 12; m++) mos.push(`<option value="${m}"${p && p.m === m ? " selected" : ""}>${m} 月</option>`);
  for(let d = 1; d <= 31; d++) dys.push(`<option value="${d}"${p && p.d === d ? " selected" : ""}>${d} 日</option>`);
  return `
    <div class="bzform famform">
      <label for="fmName">佢叫咩名</label>
      <input id="fmName" type="text" maxlength="40" placeholder="例如：細女、阿明"
             value="${esc(p && p.name || "")}">
      <p class="fmhint">加到三四個人之後，冇名就分唔出邊個係邊個。</p>
      <label for="fmRel">關係</label>
      <div class="bzrow"><select id="fmRel">${REL.filter(r => r[0] !== "self")
        .map(([k, v]) => `<option value="${k}"${p && p.relation === k ? " selected" : ""}>${v}</option>`).join("")}</select></div>
      <label for="fmY">出生日期（公曆）</label>
      <div class="bzrow">
        <select id="fmY">${yrs.join("")}</select>
        <select id="fmM">${mos.join("")}</select>
        <select id="fmD">${dys.join("")}</select>
      </div>
      <label for="fmH">出生時辰</label>
      <div class="bzrow"><select id="fmH">
        <option value="">唔記得 —— 一樣計到</option>
        ${SHICHEN.map(([z, t, h]) =>
          `<option value="${h}"${p && p.h === h ? " selected" : ""}>${z}時　${t}</option>`).join("")}
      </select></div>
      <label>性別</label>
      <div class="bzsex">
        <button type="button" data-sex="1"${p && p.male ? ' class="on"' : ""}>男</button>
        <button type="button" data-sex="0"${p && p.male === false ? ' class="on"' : ""}>女</button>
      </div>
      <button class="pbtn dark" id="fmSave" style="margin-top:18px">${p ? "存返" : "加入"}</button>
      ${p ? `<button class="bzdel" id="fmDel">刪走${esc(p.name || relTC(p.relation))}</button>` : ""}
    </div>`;
}

async function showFamily(edit){
  gripText.textContent = "屋企人";
  setView("family");
  if(!me){ askSignIn(null); return; }
  if(!family.length) await loadFamily();

  if(edit !== undefined){
    const p = edit === null ? null : family.find(x => x.id === edit);
    sheetBody.innerHTML = `
      <p class="bname">${p ? "改" + esc(p.name || relTC(p.relation)) : "加一個屋企人"}</p>
      ${famForm(p)}`;
    let sex = p ? p.male : null;
    sheetBody.querySelectorAll(".bzsex button").forEach(b => b.addEventListener("click", () => {
      sex = b.dataset.sex === "1";
      sheetBody.querySelectorAll(".bzsex button").forEach(x => {x.classList.toggle("on", x === b);x.setAttribute("aria-pressed",String(x===b));});
    }));
    sheetBody.querySelector("#fmSave").addEventListener("click", async () => {
      if(sex === null){ needSex(); return; }
      const g = id => sheetBody.querySelector(id);
      const hv = g("#fmH").value;
      const saved = await savePerson({
        id: p && p.id, name: g("#fmName").value.trim(),
        relation: g("#fmRel").value, is_self: false,
        y: +g("#fmY").value, m: +g("#fmM").value, d: +g("#fmD").value,
        h: hv === "" ? null : +hv, male: sex,
      });
      if(saved){ track("family_saved", {relation: saved.relation, edit: !!p}); showFamily(); }
    });
    const del = sheetBody.querySelector("#fmDel");
    if(del) del.addEventListener("click", async () => {
      if(!confirm(`刪走${p.name || relTC(p.relation)}？佢嘅出生資料會即刻喺我哋度消失。`)) return;
      await removePerson(p.id);
      track("family_removed", {});
      showFamily();
    });
    return;
  }

  const sum = familySummary();
  const row = x => {
    const on = famOn(x);
    return `
      <li class="famli${on ? "" : " off"}">
        <button class="fopen" data-id="${x.id}">
          <span class="fi">${x.is_self ? "我" : esc((x.name || relTC(x.relation)).slice(0, 1))}</span>
          <span class="fnm"><b>${esc(x.name || relTC(x.relation))}</b>
            <em>${x.is_self ? "自己" : relTC(x.relation)} · ${x.y} 年 ${x.m} 月 ${x.d} 日${
              x.h == null ? " · 冇時辰" : ""}</em></span>
          <span class="go">›</span>
        </button>
        <button class="fsw2" data-fid="${x.id}"
          aria-pressed="${on}" title="${on ? "計緊佢" : "冇計佢"}">${on ? "✓" : ""}</button>
      </li>`;
  };

  sheetBody.innerHTML = `
    <p class="bname">屋企人</p>
    <p class="mcount">撳個名入去睇佢自己嗰個盤（四柱、五行、命卦）。
      右邊個剔係「計唔計佢」—— 「我同老婆」同「全家」係兩條唔同嘅問題。</p>

    ${sum ? `
      <div class="famsum">
        <p class="fsh">一屋人點睇</p>
        <p class="fsl"><b>寒熱命</b>　${
          [...new Set(sum.rows.map(r => r.hc.type))].map(t =>
            `${t} ${sum.rows.filter(r => r.hc.type === t).length} 人`).join("、")}</p>
        <p class="fsl"><b>合共想補</b>　${sum.rank.map(w =>
          `<b class="wx-${w}">${w}</b>`).join("、")}</p>
        <p class="fsl"><b>八宅分組</b>　東四 ${sum.east.length} 人 · 西四 ${sum.west.length} 人</p>
        ${sum.split ? `
          <p class="fsn"><b>你哋分咗兩組宅。</b>八宅將人分東四命同西四命，
            兩組合嘅坐向係相反嘅 —— 即係<b>冇一間屋可以同時啱晒全家</b>。
            呢個唔係我哋計唔到，係八宅本身就係咁。傳統做法係跟<b>家主</b>

            可以撳熄部分人，逐個睇。</p>`}

    <ul class="famlist">
      ${family.filter(x => x.is_self).map(row).join("")}

      <div class="sharebar" style="margin-top:16px">

      你話你有權咁做。我哋淨係攞嚟計佢嗰份分析，唔會攞去做推廣，

    showFamily(null);
  });
  const fs = sheetBody.querySelector("#fmShare");
  if(fs) fs.addEventListener("click", shareFamily);
  sheetBody.querySelectorAll(".fopen").forEach(b => b.addEventListener("click", () => {
    pushBack("屋企人", () => showFamily());
    showPerson(b.dataset.id);

/* ---------------------------------------------------------- 八字同步 ---
   登入嗰陣我哋同人講「幫你存低呢個結果，換部電話都仲喺度」。要做得到
   就真係要上伺服器 —— 所以呢度真係寫落 persons 表，唔係講講。

   兩個方向都要：部機有嘅推上去（佢啱啱入完，跟住去登入）；部機冇但
   戶口有嘅攞返落嚟（換咗部電話）。 */
async function syncBirth(){
  if(!sb || !me) return;
  try{
    const {data} = await sb.from("persons")
      .select("id,birth_at,sex,hour_known").eq("is_self", true).limit(1);
    const row = (data || [])[0];
    if(!row) return;

    if(birth){
      // 香港時間轉 UTC 存。唔記得時辰嘅記低係唔記得，唔好夾硬當中午 ——
      // 時辰影響時柱，亦都影響扶抑用神。
      const h = birth.h == null ? 12 : birth.h;
      const iso = new Date(Date.UTC(birth.y, birth.m - 1, birth.d, h - 8, 0)).toISOString();
      await sb.from("persons").update({
        birth_at: iso, birth_tz: "Asia/Hong_Kong",
        birth_lat: 22.3193, birth_lon: 114.1694,
        sex: birth.male ? "m" : "f", hour_known: birth.h != null,
      }).eq("id", row.id);
      track("bazi_synced", {dir: "up"});
    } else if(row.birth_at){
      const d = new Date(row.birth_at);
      const hk = new Date(d.getTime() + 8 * 3600000);
      birth = {y: hk.getUTCFullYear(), m: hk.getUTCMonth() + 1, d: hk.getUTCDate(),
               h: row.hour_known ? hk.getUTCHours() : null,
               male: row.sex !== "f"};
      try{ localStorage.setItem(BIRTH_KEY, JSON.stringify(birth)); }catch{}
      wCache.clear();
      track("bazi_synced", {dir: "down"});
    }
  }catch{ /* 同步唔到唔應該搞冧登入 */ }
}

/* ------------------------------------------------- the screenshot habit ---
   People who want to send a building to a friend photograph the screen,
   because nothing told them the link carries the building with it. A
   screenshot loses the score the moment it is cropped, and the friend cannot
   tap through to anything.

   There is no way to detect a screenshot on the mobile web — iOS Safari and
   Android Chrome expose no such event, and every trick claiming otherwise is
   guesswork. So this does not pretend to detect one. It offers the share at
   the moment someone is plainly studying a building and has not yet found the
   button, and on a desktop it also takes the actual screenshot keys, which
   are a real signal.

   Shown at most three times ever, never again once they use it, and never to
   someone who has already shared. */
const NUDGE_KEY = "shareNudge";
let nudgeTimer = null, nudgeFor = null;

const nudgeState = () => {
  try{ return JSON.parse(localStorage.getItem(NUDGE_KEY)) || {n:0}; }
  catch{ return {n:0}; }
};
const nudgeSave = v => { try{ localStorage.setItem(NUDGE_KEY, JSON.stringify(v)); }catch{} };

function hideNudge(){
  clearTimeout(nudgeTimer);
  document.getElementById("sharenudge").hidden = true;
}

function showNudge(o, why){
  if(curView !== "building") return;
  const st = nudgeState();
  if(st.done || st.n >= 3) return;
  nudgeFor = o;
  document.getElementById("sharenudge").hidden = false;
  nudgeSave({...st, n: st.n + 1});
  track("share_nudge_shown", {why});
}

/* Restarted every time a building is opened; cancelled the moment they share,
   dismiss, or close the sheet. */
function armNudge(o){
  if(IS_TRIAL)return;
  hideNudge();
  const st = nudgeState();
  if(st.done || st.n >= 3) return;
  nudgeTimer = setTimeout(() => showNudge(o, "dwell"), 9000);
}

addEventListener("keydown", e => {
  const shot = e.key === "PrintScreen" ||
               ((e.metaKey && e.shiftKey) && ["3","4","5"].includes(e.key));
  if(shot && nudgeFor !== null) showNudge(nudgeFor, "screenshot_key");
});

/* ---------------------------------------------------- 三種分享 ---
   三個情境，三段唔同嘅文字。之前一段用晒，所以將一幢樓傳俾人嗰陣會問
   「你屋企幾多分？」—— 問錯咗人：對方收到嘅係呢幢樓，佢想知嘅係點解係
   呢個分數。每段都用同一個結構：講緊乜 → 撳入去會見到乜 → 呢個係乜嚟。 */


/* 個百分位表 round 咗做整數，所以 83–89 分全部變 100%、21 分變 0%。
   「贏全港 100% 住宅」即係連自己都贏埋，講唔通；「贏全港 0%」一樣咁
   荒謬。兩頭都改成講範圍 —— 呢句係會傳去 WhatsApp 俾陌生人睇嘅，
   一句講唔通嘅嘢就夠拉低成個分數嘅可信度。 */
/* 由「贏幾多 %」換成「頭／尾幾多 %」。高分嗰邊講「頭」，低分嗰邊講
   「尾」—— 一幢贏 15% 嘅樓，講「頭 85%」係誤導，佢實際喺尾嗰 15%。 */
const topPct = v => {
  const p = buildInfo && buildInfo.pct && buildInfo.pct[Math.round(v)];
  if(p == null) return null;
  return p >= 50 ? {dir: "頭", n: Math.max(1, 100 - p)}
                 : {dir: "尾", n: Math.max(1, p)};
};

const beats = score => {
  const p = buildInfo && buildInfo.pct && buildInfo.pct[Math.round(score)];
  if(p == null) return "";
  if(p >= 100) return "喺全港最高嗰 1% 之內";
  if(p <= 0)   return "喺全港最低嗰 1% 之內";
  return `贏全港 ${p}% 住宅`;
};

   全港所有 80 分嘅樓共用一張，所以入面冇可能有樓名 —— 收到嘅人見到

/* 幾時應該分享張圖，幾時應該分享條 link。

   電話：收到嘅人喺 WhatsApp／IG 度，一張大圖即刻睇到，唔使撳。張卡贏。

   OG 卡，unfurl 出嚟一樣有圖，但撳得入去。 */
const cardBeatsLink = () =>

// Matching buildings, straight from the search index — it already carries name,
// district, score and coordinates, so no extra download is needed to answer
// "show me the good ones here".
const MATCH_LIMIT = 150;
let homesOnly = true;      // a property search should not open with warehouses
function matches(){
  if(!searchIndex) return null;
  // 命卦篩選：八宅以向論，所以睇嘅係向首八方。d8 係 null 嘅樓唔係冇
  // 坐向，係我哋推唔準佢長軸（conf < 0.6）—— 唔應該攞嚟同人講「合你」。
  const okDir = guaOn ? guaDirSet : null;
  const okReg = (guaOn && !districtFilter) ? guaRegions : null;
  return searchIndex.filter(o =>
    (!districtFilter || o.district === districtFilter) &&
    passesFilter(o.total) &&
    (!homesOnly || o.res !== 0) &&
    (!okReg || okReg.has(o.district)) &&
    (!okDir || (o.d8 != null && okDir.has(o.d8))));
}

/* 由樓宇清單整返一層屋苑出嚟。

   之前撳一個區就直接掉幾千幢樓出嚟，但人搵樓唔係咁搵嘅 —— 佢哋諗嘅係
   「長安邨點？」唔係「第 437 幢點？」。而屋苑呢一層我哋本來有齊資料
   （678 版頁），只係喺 app 入面完全入唔到。 */
function estatesIn(list){
  const g = new Map();
  for(const o of list){
    if(!o.est || !o.res) continue;
    const e = g.get(o.est) || {name: o.est, n: 0, sum: 0, top: null};
    e.n++; e.sum += o.total || 0;
    if(!e.top || (o.total || 0) > e.top.total) e.top = o;
    g.set(o.est, e);
  }
  return [...g.values()].map(e => ({...e, avg: e.sum / e.n}))
    .sort((a, b) => b.avg - a.avg);
}

/* ---------- 一層一層撳落去 ----------

   開咗八字，全港夾你嘅樓有兩千幾幢，一個區都成七百幢。掉一條七百行嘅
   清單出嚟，等於冇篩過 —— 而且同一個屋苑啲樓形一樣，夾你分就一樣,
   愉景灣蔚陽會一口氣霸住十四行。

   所以分三層：區 → 屋苑／大廈 → 逐座。每層都揀得少，每層都返得轉頭。

   分組用屋苑名，冇屋苑名就用樓名減走座數 —— 房委會個登記冊得公營房屋,
   84,720 幢入面得 13,578 幢有屋苑名，剩返嘅私樓（龍珠島花園、Paloma
   Cove 嗰啲）淨係得個樓名。減唔走座數就當佢自己一幢。 */
const BLOCK_TAIL = new RegExp(
  "(?:\\s*第?[0-9０-９A-ZＡ-Ｚa-zａ-ｚ一二三四五六七八九十百]{1,8}[－–—-]?" +
  "[0-9０-９A-ZＡ-Ｚ一二三四五六七八九十百]{0,8}座" +
  "|\\s*(?:Block|Tower|Blk|Phase)\\s*[0-9０-９A-Za-z]{1,4}" +
  "|\\s+[0-9０-９]{1,3})$", "i");

function groupOf(o){
  if(o.est) return {key: "e:" + o.est, name: o.est};
  const n = clean(o.tc) || clean(o.en);
  if(!n) return null;
  const base = n.replace(BLOCK_TAIL, "").trim();
  return base && base !== n ? {key: "n:" + base, name: base} : null;
}

function groupsIn(list){
  const g = new Map();
  for(const o of list){
    const k = groupOf(o);
    const key = k ? k.key : "s:" + o.id;
    let e = g.get(key);
    if(!e){
      e = {key, solo: !k, rows: [],
           name: k ? k.name : (clean(o.tc) || clean(o.en) || "未命名樓宇")};
      g.set(key, e);
    }
    e.rows.push(o);
  }
  for(const e of g.values()){
    e.rows.sort((x, y) => (y._fit ?? -1) - (x._fit ?? -1) || (y.total || 0) - (x.total || 0));
    e.best = e.rows[0];
    e.fit = e.best._fit;
    e.n = e.rows.length;
    e.top = Math.max(...e.rows.map(r => r.total || 0));
    if(e.n === 1) e.solo = true;          // 得一座就唔使再撳多一層
  }
  return [...g.values()].sort((x, y) =>
    (y.fit ?? -1) - (x.fit ?? -1) || (y.top || 0) - (x.top || 0));
}

function renderMatches(list){
  // 開咗八字就按「夾你」排，唔係按九運分排 —— 兩個答唔同問題，而開咗
  // 八字嘅人問嘅係嗰個。冇形嘅數據（例如冇高度）就跌返去九運分。
  const personal = guaOn && myWeights() && elemData;
  const nCount = personal ? counted().length : 0;
  let groups = null, groupName = null;
  if(personal){
    for(const o of list) o._fit = houseFit(o);
    list = [...list].sort((a, b) =>
      (b._fit ?? -1) - (a._fit ?? -1) || (b.total || 0) - (a.total || 0));
    // 揀咗一個屋苑就淨係睇嗰個屋苑；未揀就睇屋苑一層，唔係逐幢。
    if(groupSel){
      const g = groupsIn(list).find(x => x.key === groupSel);
      if(g){ list = g.rows; groupName = g.name; } else groupSel = null;
    }
    if(!groupSel) groups = groupsIn(list);
  }
  const shown = list.slice(0, MATCH_LIMIT);
  const ests = (districtFilter && !personal) ? estatesIn(list) : [];
  const estBlock = ests.length ? `
    <div class="estwrap">
      <p class="fhd">區內屋苑　<span>${ests.length} 個</span></p>
      <div class="estlist">${ests.slice(0, 40).map(e => `
        <button class="estrow" data-e="${esc(e.name)}">
          <span class="ep" style="background:${colorFor(e.avg)};color:${inkOn(e.avg)}">${num(e.avg,0)}</span>
          <span class="en2"><b>${esc(e.name)}</b>${e.n} 座</span><i>›</i>
        </button>`).join("")}</div>
      ${ests.length > 40 ? `<p class="bznote">仲有 ${ests.length - 40} 個，喺下面嘅樓宇清單度搵得到。</p>` : ""}
    </div>` : "";
  const where = groupName || districtFilter || "全港";
  const what  = band === "all" ? "所有評分" : chipLabel();
  // The list can only show buildings that carry a name; the map and the
  // district bubbles count every matching footprint. Saying both numbers
  // avoids the two looking like a contradiction.
  const mapped = districtFilter
    ? bandCount(districtData.find(d=>d.tc===districtFilter) || {})
    : districtData.reduce((n,d)=>n+bandCount(d), 0);
  const unnamed = Math.max(0, mapped - list.length);

function updateChipCounts(){

  const total = {};
  for(const a of districtData)
    for(const [k,v] of Object.entries(a.bands||{})) total[k]=(total[k]||0)+v;
  const sum = Object.values(total).reduce((x,y)=>x+y,0);
  document.querySelectorAll("#filters .chip[data-band]").forEach(c=>{
    const b=c.dataset.band;
    const n = b==="all" ? sum
            : b==="good+" ? (total.good||0)+(total.best||0)

}

   本來六頁，一頁一個功能。行完之後人識咗六個掣，但仲未掂過個地圖 ——
   而呢個 app 嘅價值要喺地圖度先感受到。收藏／分享同會員好處唔值得各佔

   開戶口擺喺最後一版，唔擺喺最頭：最後一版講八字，而要登記先睇到嘅嘢

   唔肯開就撳交叉或者下面條字，一樣入得去。呢個唔係收費牆。 */

// A shared link has to land somewhere meaningful, otherwise sharing is
// pointless: the recipient gets a generic map and never finds what was sent.
function unpack(str){
  return (str || "").split(";").map(pair=>{
    const [lat,lon] = pair.split(",").map(Number);
    return (isFinite(lat) && isFinite(lon)) ? {lat, lon} : null;
  }).filter(Boolean);
}

async function openDeepLink(){
  const q = new URLSearchParams(location.search);

  const estate=q.get('estate');
  const one = unpack(q.get('b'))[0];
  if(estate || one){
    document.getElementById('intro').classList.add('hide');
    try{localStorage.setItem('seenIntro','1');}catch{}
    await memberReady;
    if(one){
      if(!q.has('intent'))track('open_shared',{what:'building'});
      await openJourneyBuilding({...one,id:q.get('bid')},q.get('intent')==='personal');
    }else await openEstateJourney(estate,q.get('intent')==='personal');
    return true;
  }

  const many = unpack(q.get("list"));
  if(many.length){
    track("open_shared", {what: "list", count: many.length});
    localStorage.setItem("seenIntro","1");
    document.getElementById("intro").classList.add("hide");
    // Coordinates alone carry no names; the search index fills them in.
    await ensureIndex();
    sharedList = many.map(pt=>{
      let best=null, bd=Infinity;
      for(const o of searchIndex){
        const d=(o.lat-pt.lat)**2+(o.lon-pt.lon)**2;
        if(d<bd){ bd=d; best=o; }
      }
      // A link can be truncated in transit; say so rather than rendering a
      // scoreless row that looks like a broken building.
      return (best && bd < 1e-7) ? best
           : {tc:"搵唔到呢個位置嘅樓宇", en:null, ...pt, total:null, missing:true};
    });
    const missing = sharedList.filter(o=>o.missing).length;
    sharedList = sharedList.filter(o=>!o.missing);
    if(missing) setTimeout(()=>toast(`${missing} 個樓盤未能識別，連結可能唔完整`), 1200);
    if(!sharedList.length){ sharedList = null; return false; }
    const lat = many.reduce((a,p)=>a+p.lat,0)/many.length;
    const lon = many.reduce((a,p)=>a+p.lon,0)/many.length;
    map.setView([lat,lon], 14);
    showFavs(); openSheet();
    return true;
  }

  const d = q.get("d"), g = q.get("g");
  if(d || g){
    track("open_shared", {what: "filter"});
    if(g && BANDS[g] !== undefined){
      band = g;
      document.querySelectorAll("#filters .chip[data-band]")
        .forEach(x=>x.classList.toggle("on", x.dataset.band===g));
    }
    if(d){
      districtFilter = d;
      const chip = document.getElementById("btnDistrict");
      chip.innerHTML = '<b>地區</b>' + d + ' <span class="caret">▾</span>';
      chip.classList.add("on");
    }
    return false;            // let the normal flow render the filtered view
  }
  return false;
}

      try{
        const addresses=await trialAddressSuggestions(q,signal);if(!active())return;
        const results=[...local.filter(r=>r.rank>=60).slice(0,6),...addresses,...local.filter(r=>r.rank<60).slice(0,3)];
        render(results,results.length?'可以加埋門牌號碼，搵得更準。':'未搵到。試下街道加門牌、屋苑全名，或者用地圖揀樓。');

    },300);
  };

  out.onkeydown=e=>{const bs=[...out.querySelectorAll('button')],i=bs.indexOf(document.activeElement);if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();bs[Math.max(0,Math.min(bs.length-1,i+(e.key==='ArrowDown'?1:-1)))]?.focus();}if(e.key==='Escape')input.focus();};
}

function trialReportEntry(o){
 const anchor=sheetBody.querySelector('.journey');if(!anchor||document.getElementById('fullBuildingReport'))return;
 const block=document.createElement('section');block.className='report-entry';block.innerHTML=`<h3>了解呢座樓</h3><div class="place-diagram"><div><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M2 44L23 7l15 24 8-15 16 28Z" fill="#93b79b"/></svg><b>附近嘅山</b><small>${dirTC(o.mt_dir)}方 · ${num(o.mt_d,0)} 米</small></div><div><svg viewBox="0 0 64 48" aria-hidden="true"><path d="M2 17q8-10 16 0t16 0t16 0t14 0M2 30q8-10 16 0t16 0t16 0t14 0M2 43q8-10 16 0t16 0t16 0t14 0" fill="none" stroke="#6ba9b1" stroke-width="5"/></svg><b>附近嘅水</b><small>${dirTC(o.wt_dir)}方 · ${num(o.wt_d,0)} 米</small></div></div><p>分數之外，睇清楚原因同實際資料。</p><div class="feature-cards"><button id="fullBuildingReport"><b>環境與九運報告</b><small>山水、坐向、年代、逐項計分 →</small></button><button id="fullPersonalReport"><b>點解同我夾／唔夾？</b><small>五行、八宅、實際數字及比重 →</small></button>${o.est?'<button id="fullEstateReport"><b>屋苑航空圖與資料</b><small>逐座排名、人口、管理及其他資料 →</small></button>':''}<button id="fullMethodReport"><b>評分方法與限制</b><small>包括咩、未計咩、數據出處 →</small></button></div>`;
 const actions=document.getElementById('resultRemember')||document.getElementById('resultActions');actions?actions.after(block):anchor.append(block);
 document.getElementById('fullBuildingReport').onclick=()=>trialFullBuilding(o);
 document.getElementById('fullPersonalReport').onclick=()=>birth?trialBuildingAnalysis(o,birth):trialPersonForm('self',o);
 document.getElementById('fullEstateReport')?.addEventListener('click',()=>trialArticle('/estate/'+encodeURIComponent(o.est),()=>trialBuilding(o)));
 document.getElementById('fullMethodReport').onclick=()=>trialArticle('/method',()=>trialBuilding(o));
}

 body.querySelector('.ppgs')?.replaceChildren(document.createTextNode('登入免費睇逐項配對原因。測試資料只留喺此裝置。'));

async function trialBaziReport(id='self',back=trialProfile){
 await Promise.all([ensureBazi(),loadElements(),districtData.length?Promise.resolve():loadDistricts(),memberReady]);
 const person=trialPeople().find(p=>p.id===id);if(!person)return trialPersonForm(id);
 const previous=birth;let html,snapshot;
 try{birth=person;trialReportPeople=[person];html=bzResult();snapshot=bzSnapshot;}finally{birth=previous;trialReportPeople=null;}
 trialScreen('完整八字分析',html);const content=trialReportLayout(`${person.name}嘅完整分析`,back);
 content.querySelector('.famcta')?.remove(); // Family management has its own persistent destination.
 content.querySelectorAll('.gs').forEach(e=>{if(/換部電話|存低呢個結果/.test(e.textContent))e.textContent='免費登入睇詳細解釋；測試資料只留喺此裝置。';});
 const bind=(id,fn)=>content.querySelector('#'+id)?.addEventListener('click',fn);
 bind('bzEdit',()=>trialPersonForm(id));bind('bzLogin',trialSignIn);
 bind('bzDel',()=>{trialScreen('移除出生資料',`<h2>移除${esc(person.name)}嘅出生資料？</h2><p>只影響呢部裝置嘅試用資料。</p><button class="pbtn" id="confirmLocalRemove">移除</button><button class="jmap" id="cancelLocalRemove">保留，返回</button>`);document.getElementById('cancelLocalRemove').onclick=()=>trialBaziReport(id,back);document.getElementById('confirmLocalRemove').onclick=()=>{if(id==='self'){localStorage.removeItem(BIRTH_KEY);birth=null;}else trialWrite('people',trialRead('people').filter(p=>p.id!==id));trialProfile();};});
 bind('bzShare',()=>trialShareAnalysis(snapshot,()=>trialBaziReport(id,back)));
 bind('bzGoList',()=>trialRankedBuildings(content.querySelector('#bzPickD').value,[person],()=>trialBaziReport(id,back)));
 bind('bzSee',()=>{trialMapPeople=[person];guaOn=true;refreshGuaDirs();loadBuildings();drawDistricts();trialMap();});
 content.querySelectorAll('.area').forEach(b=>b.onclick=()=>trialUser?trialRankedBuildings(b.dataset.d,[person],()=>trialBaziReport(id,back)):trialSignIn());
}
async function trialRankedBuildings(district,people=trialPeople().filter(famOn),back=trialProfile){
 await Promise.all([ensureBazi(),loadElements(),ensureIndex()]);const source=searchIndex.filter(o=>o.res!==0&&(!district||o.district===district));
 const scored=source.map(o=>{const values=people.map(p=>fitOf(o,p));return {o,score:values.length&&values.every(x=>x!=null)?Math.round(values.reduce((a,b)=>a+b,0)/values.length):null};}).filter(x=>x.score!=null).sort((a,b)=>b.score-a.score);let limit=30;
 const render=()=>{trialScreen('按配對搵樓',`<button class="jmap" id="rankBack">‹ 返回</button><h2>${esc(district||'全港')}・最夾你哋嘅樓</h2><p class="mcount">計緊 ${people.map(p=>esc(p.name||'我')).join('、')}。多人分數取平均，入樓座睇每人分數。</p><p>有 ${scored.length} 座可計算；未有坐向時只計五行環境。</p><ul class="trial-results">${scored.slice(0,limit).map(({o,score},i)=>`<li><button data-rank="${i}"><b>${score} 分 · ${esc(trialName(o))}</b><small>${esc(o.district)} · 環境 ${num(o.total,0)} 分 →</small></button></li>`).join('')}</ul>${scored.length>limit?'<button class="pbtn" id="rankMore">睇更多</button>':''}`);document.getElementById('rankBack').onclick=back;document.getElementById('rankMore')?.addEventListener('click',()=>{limit+=30;render();});sheetBody.querySelectorAll('[data-rank]').forEach(b=>b.onclick=()=>openJourneyBuilding(scored[+b.dataset.rank].o,false));};render();
}
function trialProfileDetails(){
 trialMapPeople=null;const people=trialPeople();if(!people.length)return;
 const region=document.createElement('section');region.className='report-card';region.innerHTML=`<h3>一齊住，點樣揀？</h3><p>剔選今次一齊計嘅人，唔會刪除生日。</p><div class="family-checks">${people.map(p=>`<label><input type="checkbox" data-count-person="${p.id}" ${famOn(p)?'checked':''}> ${esc(p.name)}</label>`).join('')}</div><div id="familyDirectionSummary"></div><button class="pbtn" id="familyRanked">按我哋嘅配對搵樓 →</button><button class="jmap" id="familyInvite">邀請屋企人自己試 →</button>`;
 sheetBody.querySelector('#hubAdd').after(region);
 const update=()=>{const ps=people.filter(famOn),rows=ps.map(p=>{const g=guaOf(p),hc=bzMod.hotCold(p.y,p.m,p.d,p.h??12,0);return {g,hc,dirs:bzMod.goodDirs(g)};});const shared=rows.length?rows[0].dirs.filter(d=>rows.every(r=>r.dirs.includes(d))):[];document.getElementById('familyDirectionSummary').innerHTML=`<p><b>計緊 ${ps.length} 個人</b></p>${rows.length?`<p>寒熱命：${[...new Set(rows.map(r=>r.hc.type))].join('、')}；喜用：${[...new Set(rows.flatMap(r=>r.hc.like))].join('、')}。</p><p>${shared.length?'共同吉方：'+shared.join('、')+'。':'未有共同吉方。可以逐個比較，唔好只睇平均分。'}</p>`:'<p>請至少揀一位，再睇配對。</p>'}`;document.getElementById('familyRanked').disabled=!ps.length;};
 region.querySelectorAll('[data-count-person]').forEach(c=>c.onchange=()=>{toggleFam(c.dataset.countPerson);update();});update();
 document.getElementById('familyRanked').onclick=()=>trialRankedBuildings(null,people.filter(famOn));document.getElementById('familyInvite').onclick=()=>trialShareAnalysis(null,trialProfile);
}
function trialShareAnalysis(snapshot,back){
 const text=snapshot?`我嘅八字揀樓：${snapshot.type}，喜${snapshot.likes.join('、')}。最夾嘅地區：${snapshot.areas.slice(0,3).map(a=>a.tc+' '+a.fit+' 分').join('、')}。`:'一齊試下香港風水地圖，輸入自己生日，睇邊座樓夾自己。';
 const url=location.origin+'/';trialScreen('分享預覽',`<h2>${snapshot?'分享八字揀樓卡':'邀請朋友及家人'}</h2><div class="share-preview"><h3>香港風水地圖</h3><p>${esc(text)}</p></div><p class="trial-note">唔包括生日、姓名或家人資料。朋友要輸入自己生日，先睇到自己結果。</p><button class="pbtn" id="analysisShare">分享</button><button class="pbtn" id="analysisCopy">複製內容與連結</button>${snapshot?'<button class="pbtn" id="analysisImage">下載八字揀樓卡</button>':''}<button class="jmap" id="analysisShareBack">返回</button>`);
 document.getElementById('analysisShareBack').onclick=back;document.getElementById('analysisCopy').onclick=()=>trialCopyShare(text+'\n'+url);document.getElementById('analysisShare').onclick=async()=>{if(!navigator.share)return trialCopyShare(text+'\n'+url);try{await navigator.share({title:'香港風水地圖',text,url});}catch(e){if(e.name!=='AbortError')trialCopyShare(text+'\n'+url);}};
 document.getElementById('analysisImage')?.addEventListener('click',async()=>{try{const m=await cardBits(),blob=await m.baziCard({...snapshot,mark:brandMark});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='八字揀樓卡.png';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);}catch{toast('圖片暫時未能產生，請用複製分享。');}});
}

 trialScreen('朋友分享嘅清單',`<h2>朋友嘅心水樓</h2><p>共 ${rows.length} 座，逐座睇評分。唔會改你自己嘅收藏。</p><ul class="trial-results">${rows.map((o,i)=>`<li><button data-shared-place="${i}">${esc(trialName(o))}<small>環境 ${num(o.total,0)} 分 →</small></button></li>`).join('')}</ul><button class="jmap" id="sharedHome">返回搵樓</button>`);
 sheetBody.querySelectorAll('[data-shared-place]').forEach(b=>b.onclick=()=>openJourneyBuilding(rows[+b.dataset.sharedPlace],false));document.getElementById('sharedHome').onclick=trialHome;

function trialListTools(){
 const section=document.createElement('section');section.className='report-card';let lists=trialRead('lists');
 if(!lists.length){lists=[{id:'default',name:'我的收藏',rows:favs.slice()}];trialWrite('lists',lists);}else if(lists.some(l=>!l.id)){lists=lists.map((l,i)=>({...l,id:l.id||'saved-'+i}));trialWrite('lists',lists);}
 const active=trialRead('active_list','default');

 sheetBody.querySelector('#openShortlistCompare').after(section);
 document.getElementById('saveNamedList').onclick=()=>{const name=document.getElementById('newListName').value.trim();if(!name)return toast('請填清單名稱');const row={id:'list-'+Date.now(),name,rows:[]};if(trialWrite('lists',[...lists,row])){trialWrite('active_list',row.id);favs=[];saveFavs();toast('清單已建立，可以開始收藏樓座');trialFavorites();}};
 document.getElementById('shareAllFavs')?.addEventListener('click',()=>trialShareCollection(favs,lists.find(l=>l.id===active)?.name||'我的收藏'));
 section.querySelectorAll('[data-local-list]').forEach(b=>b.onclick=()=>{saveFavs();const l=trialRead('lists')[+b.dataset.localList];trialWrite('active_list',l.id);favs=l.rows.slice();saveFavs();trialFavorites();});

function trialShareCollection(rows,name){
 const url=shareUrl({list:pack(rows)}),text=rows.map(trialName).join('、');trialScreen('分享清單',`<h2>${esc(name)}</h2><p>${rows.length} 座樓 · 只分享樓座，唔包括生日或筆記。</p><ul>${rows.map(o=>`<li>${esc(trialName(o))}</li>`).join('')}</ul><button class="pbtn" id="collectionShare">分享</button><button class="pbtn" id="collectionCopy">複製連結</button><label for="shareURL">分享連結</label><input id="shareURL" class="trial-search" readonly value="${esc(url)}"><button class="jmap" id="collectionBack">返回心水樓</button>`);document.getElementById('collectionCopy').onclick=()=>trialCopyShare(url);document.getElementById('collectionShare').onclick=()=>doShare(name,text,url,'list');document.getElementById('collectionBack').onclick=trialFavorites;
}

let finishTrialBoot;
const trialBootWait=new Promise(resolve=>{finishTrialBoot=resolve;});
let trialNavRequest=0;
function trialNavigate(action){const request=++trialNavRequest;trialBootWait.then(()=>{if(request===trialNavRequest)action();});}
if(IS_TRIAL){
  new MutationObserver(()=>{sheetBody.scrollTop=0;}).observe(sheetBody,{childList:true});
  document.body.insertAdjacentHTML('beforeend','<div id="trialBrand">香港風水地圖</div><nav id="trialNav" aria-label="主要功能"><button id="trialNavHome">⌂ 搵樓</button><button id="trialNavCompare">♡ 心水樓</button><button id="trialNavProfile">♧ 我和家人</button></nav>');
  document.getElementById('trialNavHome').onclick=()=>trialNavigate(()=>{history.replaceState(null,'',location.pathname);trialHome();});

}

map.whenReady(async ()=>{
  try{
  await loadBuildStamp();      // must precede any data fetch: it sets the token
  await loadTileIndex();
  saveFavs();
  await loadDistricts();
  if(IS_TRIAL && new URLSearchParams(location.search).has('compare')){await trialSharedCompare().catch(()=>toast('比較連結暫時開唔到'));return;}
  let handled=false;
  try{handled=await openDeepLink();}catch{journeyFailure("deep_link_load");handled=true;}
  loadElements();
  if(!handled){loadBuildings();if(IS_TRIAL&&new URLSearchParams(location.search).get('member')==='1'){await memberReady;await trialProfile();}}
  }finally{finishTrialBoot();}
});
/* 電腦版一開就攤開個清單。

   同一個組件喺電話度係打橫冚晒成個底部嘅一條：58px 高、100% 闊、喺拇指
   正下方，想唔見到都難。喺 1440px 嘅 mon 度，同一條變成右下角一塊
   390×58 嘅小牌，佔成個screen 2% —— 而人隻眼喺左上角個搜尋欄同中間幅
   地圖度，冇理由望向嗰個角。唔見到佢，剩返嘅路就只有喺地圖度carry住
   scroll wheel 放大四五次。

   電腦版「撳過一幢樓」嘅轉換率 23.8%，得電話版 51.3% 一半，最大嫌疑
   就喺呢度。

   電話唔跟住做：細screen度未望清楚幅地圖就俾一版清單冚住，係更差。
   電腦screen夠闊，攤開之後仲有千零 px 畀地圖，所以冇代價。 */
/* 側欄要企喺篩選列下面，而篩選列幾高要睇佢換咗幾多行 —— 闊度、字體
   大細、語言都會影響。所以量返佢，唔好估。 */
(function railTop(){
  const f = document.getElementById("filters");
  if(!f) return;
  const set = () => document.documentElement.style.setProperty(
    "--rail-top", (f.getBoundingClientRect().bottom + 8) + "px");
  set();
  addEventListener("resize", set);
  if(window.ResizeObserver) new ResizeObserver(set).observe(f);
})();

setTimeout(()=>{
  const wide = matchMedia("(min-width:760px)").matches;
  if(!IS_TRIAL && (wide || localStorage.getItem("seenIntro"))) openSheet();

},600);
