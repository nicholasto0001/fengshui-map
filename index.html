<style>
  /* hidden 屬性要贏得過所有嘢。瀏覽器預設嘅 [hidden]{display:none} 係最低
     優先級，任何一條寫咗 display 嘅 class 都打得贏佢 —— 呢個檔案已經中過
     三次：#updatebar、#sharenudge，同埋介紹最後一頁嗰個 Google 掣
     （.gbtn{display:flex} 令佢喺第一頁就同「繼續」掣黐埋一齊出）。
     所以呢度一次過解決，唔好再逐個補。 */
  [hidden]{display:none !important}

  :root{
    color-scheme: light;
    --bg:#f4f3f0; --card:#ffffff; --line:#e3e2dd;
    --ink:#0b0b0b; --ink2:#55534e; --ink3:#86847d;
    --brand:#1b4f8f;
    /* 三個 element 各自嘅顏色。首頁卡、樓宇頁四個 part、八字表格嘅
       三行，全部共用呢三隻 —— 顏色一致，人就唔使每次重新讀字。
         風水 = 地（深綠，同「大吉」同一隻）
         大運 = 時（金啡，同飛星／元運嗰邊呼應）
         八字 = 人（品牌紅） */
    --e1:#0f6354; --e1b:#e6f0ed;
    --e2:#9a6f1f; --e2b:#f6efdf;
    --e3:#a7161e; --e3b:#fbe9e9;
    /* diverging: red = below average, neutral hinge, teal = above */
    --s1:#a01f1f; --s2:#d76f6f; --s3:#e6e4de; --s4:#4da79a; --s5:#0f6354;
    --shadow: 0 2px 10px rgba(0,0,0,.10), 0 1px 3px rgba(0,0,0,.06);
    --safe-b: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Noto Sans HK","PingFang HK","Microsoft JhengHei",sans-serif;
    color:var(--ink); background:var(--bg); overflow:hidden;
  }
  #map{position:fixed; inset:0; background:#dfe6ea}

  /* ---------- top search ---------- */
  #top{
    position:fixed; z-index:600; top:0; left:0; right:0;
    padding:10px 10px 0; display:flex; gap:8px; align-items:flex-start;
    pointer-events:none;
  }
  #searchwrap{flex:1; min-width:0; pointer-events:auto; max-width:560px}
  .searchbar{
    display:flex; align-items:center; gap:8px; background:var(--card);
    border-radius:26px; box-shadow:var(--shadow); padding:0 6px 0 14px; height:48px;
  }
  .searchbar svg{flex:0 0 18px; opacity:.5}
  #q{
    flex:1; min-width:0; border:0; outline:0; background:transparent;
    font:inherit; font-size:16px; height:100%; color:var(--ink);
  }
  #q::placeholder{color:var(--ink3)}
  /* type="search" 令瀏覽器自己畫多一個清除掣，同我哋 #clear 並排 ——
     搜尋框入面兩個 ×，睇落似壞咗。 */
  #q::-webkit-search-cancel-button{-webkit-appearance:none; display:none}
  #q::-webkit-search-decoration{-webkit-appearance:none}
  #clear{
    border:0; background:transparent; font-size:20px; color:var(--ink3);
    width:34px; height:34px; border-radius:50%; cursor:pointer; display:none;
  }
  #clear:hover{background:var(--bg)}
  #results{
    margin:6px 0 0; padding:6px; list-style:none; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); max-height:46vh; overflow-y:auto; display:none;
  }
  #results.show{display:block}
  #results li{padding:10px 12px; border-radius:10px; cursor:pointer}
  #results li:active,#results li:hover{background:var(--bg)}
  #results .nm{font-weight:600; font-size:14.5px}
  #results .ad{color:var(--ink3); font-size:12.5px; margin-top:1px}
  #results .pill{
    float:right; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums;
    color:#fff; border-radius:999px; padding:2px 9px; margin-left:8px;
  }
  #results .grp{
    display:flex; justify-content:space-between; align-items:baseline;
    padding:6px 12px 8px; margin:0 0 2px; cursor:default;
    font-weight:700; font-size:15px; color:var(--ink);
    border-bottom:1px solid var(--line);
  }
  #results .grp span{font-weight:500; font-size:12.5px; color:var(--ink3)}
  #results .empty{color:var(--ink3); font-size:13.5px; padding:10px 12px; cursor:default}

  /* ---------- right buttons ---------- */
  #tools{display:flex; gap:8px; pointer-events:auto}
  .tbtn{
    width:48px; height:48px; border-radius:50%; border:0; background:var(--card);
    box-shadow:var(--shadow); cursor:pointer; display:grid; place-items:center;
    font-size:19px; color:var(--ink2); padding:0;
  }
  .tbtn:active{background:var(--bg)}
  /* 工具列由兩粒變三粒（加咗分享），喺五吋屏幕度會逼到搜尋框，
     個 placeholder 斷咗做「搵屋苑、大廈、」。細粒啲就兩樣都擺得落,
     42px 仍然大過 44px 觸控下限嘅九成，而且呢三粒都唔係主要動作。 */
  @media (max-width:1023px){
    #tools{gap:6px}
    .tbtn{width:42px; height:42px; font-size:17px}
  }
  .tbtn.on{background:var(--brand); color:#fff}

  /* ---------- filter chips ----------
     Directly under the search bar, where filters live in every map app people
     already use. Scrolls sideways on a phone rather than wrapping to a second
     row and eating the map. */
  #filters{
    position:fixed; z-index:590; top:64px; left:0; right:0;
    display:flex; gap:7px; padding:6px 10px 2px;
    overflow-x:auto; scrollbar-width:none; -webkit-overflow-scrolling:touch;
  }
  #filters::-webkit-scrollbar{display:none}
  /* 釘喺 filter 條下面，地圖之上 —— 唔使捲、唔使撳都見到。 */
  #maphint{
    position:fixed; z-index:589; top:var(--rail-top, 104px); left:10px; right:10px;
    margin:0; padding:6px 12px; border-radius:999px;
    background:rgba(255,255,255,.93); backdrop-filter:blur(6px);
    box-shadow:0 1px 6px rgba(0,0,0,.10);
    font-size:12px; line-height:1.5; color:var(--ink2); text-align:center;
    pointer-events:none;
  }
  #maphint b{color:var(--ink)}
  /* 呢條嘢講緊地圖上面啲圈，所以要浮喺地圖上面，唔可以壓住兩邊嘅欄。
     左邊避開 --rail（側欄），右邊喺 1360px 以上再避開詳細資料欄。 */
  @media (min-width:1024px){
    #maphint{
      /* 頂列（搜尋欄同右上角三個工具掣）佔住 14–62，所以要落一行。 */
      left:calc(var(--rail) + 28px); right:28px; width:auto;
      max-width:520px; margin-inline:auto; top:76px;
    }
  }
  @media (min-width:1360px){
    #maphint{right:calc(360px + 28px)}
  }
  .chip{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    border:0; border-radius:999px; padding:8px 13px; cursor:pointer;
    font:inherit; font-size:13px; font-weight:600; color:var(--ink2);
    background:var(--card); box-shadow:var(--shadow); white-space:nowrap;
  }
  .chip i{width:9px; height:9px; border-radius:50%; display:block; flex:0 0 9px}
  .chip.on{color:#fff; background:var(--ink)}
  .chip.on i{box-shadow:0 0 0 2px rgba(255,255,255,.55)}
  .chip .cnt{font-weight:500; opacity:.7; font-variant-numeric:tabular-nums}

  .chip-sep{flex:0 0 1px; width:1px; background:var(--line); margin:6px 2px; align-self:stretch}
  .dchip{color:var(--ink); gap:5px}
  .dchip b{font-size:10.5px; font-weight:700; color:var(--ink3); letter-spacing:.04em}
  .dchip.on b{color:rgba(255,255,255,.7)}
  .dchip .caret{opacity:.5; font-size:10px}
  .dchip.on{background:var(--brand); color:#fff}
  .dchip.on .caret{opacity:.8}

  .favchip .hrt{color:#d64545; font-size:14px; line-height:1}
  .favchip.on{background:#d64545; color:#fff}
  .favchip.on .hrt{color:#fff}

  /* ---------- save + share ---------- */
  .actions{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:0 0 16px}
  .act{
    display:flex; align-items:center; justify-content:center; gap:7px;
    border:1px solid var(--line); background:var(--card); border-radius:12px;
    padding:13px; font:inherit; font-size:14.5px; font-weight:600;
    color:var(--ink); cursor:pointer; min-height:48px;
  }
  .act:active{background:var(--bg); transform:scale(.985)}
  .act.saved{background:#fdecec; border-color:#f2c9c9; color:#a01f1f}
  .act .ico{font-size:17px; line-height:1}
  .act.primary{background:var(--brand); border-color:var(--brand); color:#fff}

  .sharebar{
    display:flex; align-items:center; gap:10px; background:#eef4fb;
    border:1px solid #d6e4f4; border-radius:12px; padding:12px 13px; margin:0 0 14px;
  }
  .sharebar div{flex:1; min-width:0}
  .sharebar b{display:block; font-size:13.5px; color:#12467e; margin-bottom:2px}
  .sharebar span{font-size:12px; color:#2a5f9e; line-height:1.45}
  .sharebar button{
    flex:0 0 auto; border:0; background:var(--brand); color:#fff; font:inherit;
    font-size:13px; font-weight:700; padding:10px 16px; border-radius:999px; cursor:pointer;
  }

  .shared-note{
    background:#fff8e8; border:1px solid #f0dcae; border-radius:12px;
    padding:12px 14px; margin:0 0 14px;
  }
  .shared-note b{display:block; font-size:14px; color:#6b4c10; margin-bottom:3px}
  .shared-note span{font-size:12.5px; color:#7a5c22; line-height:1.5}

  /* ---------- district picker, rendered inside the sheet ---------- */
  .dpick{list-style:none; margin:0 0 14px; padding:0}
  .dpick li{
    display:grid; grid-template-columns:1fr auto 14px; align-items:center; gap:10px;
    padding:13px 10px; cursor:pointer; border-radius:12px; border-bottom:1px solid #f2f1ed;
  }
  .dpick li:active{background:#eceae3}
  .dpick li.sel{background:var(--bg)}
  .dpick .dn{font-size:15px; font-weight:600}
  .dpick .dc{font-size:13px; color:var(--ink3); font-variant-numeric:tabular-nums}
  .dpick .chev2{color:var(--ink3); font-size:17px}

  /* ---------- match list ---------- */
  .mlist{list-style:none; margin:0 0 14px; padding:0}
  /* 一行至少 56px 高 —— 44pt 係 Apple 由第一代 iPhone 用到今日嘅最細觸控
     目標，一張要用手指篤嘅清單值得畀多過最低要求。 */
  .mlist li{
    display:grid; grid-template-columns:46px 1fr auto; align-items:center; gap:13px;
    min-height:56px; padding:11px 8px; border-radius:10px; cursor:pointer;
    border-bottom:1px solid #f4f3ef;
  }
  .mlist li:hover,.mlist li:active{background:var(--bg)}
  .mlist .sc{
    width:46px; height:46px; border-radius:50%; display:grid; place-items:center;
    font-size:16px; font-weight:700; font-variant-numeric:tabular-nums;
  }
  .mlist .nm{font-size:17px; font-weight:600; line-height:1.3}
  .mlist .mt{font-size:13.5px; color:var(--ink3); margin-top:2px}
  /* 左邊個大數係九運格局分，呢個係「啱唔啱你」。兩個一定要分得開,
     唔係人哋以為我哋改咗個評分。 */
  .mlist .emore{display:inline-block; margin-top:2px; font-size:12px; color:var(--ink3);
                opacity:.8}
  .mlist .fitb{display:inline-block; margin-inline-start:4px; padding:1px 7px;
    border-radius:999px; background:var(--card2,#f3f1ec); border:1px solid var(--line);
    font-size:12px; font-weight:600; color:var(--ink); vertical-align:1px}
  .mlist .go{color:var(--ink3); font-size:17px}
  .mcount{font-size:14.5px; color:var(--ink3); margin:0 0 12px; line-height:1.55}
  .homes{
    display:flex; align-items:center; gap:8px; margin:0 0 14px; cursor:pointer;
    font-size:13px; color:var(--ink2); user-select:none;
  }
  .homes input{width:17px; height:17px; accent-color:var(--brand); cursor:pointer}
  .mmore{font-size:11.5px; color:var(--ink3); text-align:center; margin:2px 0 14px}

  /* ---------- layer menu ---------- */
  #layers{
    position:fixed; z-index:620; top:112px; right:10px; background:var(--card);
    border-radius:14px; box-shadow:var(--shadow); padding:6px; display:none; width:186px;
  }
  #layers.show{display:block}
  #layers button{
    display:block; width:100%; text-align:left; border:0; background:transparent;
    font:inherit; font-size:14px; padding:10px 12px; border-radius:10px; cursor:pointer; color:var(--ink);
  }
  #layers button:hover{background:var(--bg)}
  #layers button.sel{background:var(--bg); font-weight:600}
  #layers button.sel::after{content:"✓"; float:right; color:var(--brand)}
  #layers .lgh{margin:6px 12px 3px; font-size:11px; font-weight:650; color:var(--ink3);
               letter-spacing:.03em}
  #layers .lgh:first-child{margin-top:2px}
  #layers button i{display:block; font-style:normal; font-size:11.5px; color:var(--ink3);
                   font-weight:400; margin-top:1px}
  #layers{width:auto; min-width:150px}

  /* ---------- basemap treatment ----------
     The Lands Department topographic sheet is drawn for reading terrain, not
     for sitting under a choropleth: strong greens, contour hatching and road
     fills all compete with the building colours. Desaturating and lifting it
     toward white turns it into a quiet ground plane. */
  .muted-base{filter:saturate(.35) brightness(1.1) contrast(.92)}
  .muted-sat{filter:saturate(.7) brightness(1.04)}
  .leaflet-highlight-pane path{filter:drop-shadow(0 1px 3px rgba(0,0,0,.35))}

  /* ---------- status toast ---------- */
  #toast{
    position:fixed; z-index:610; top:116px; left:50%; transform:translateX(-50%);
    background:rgba(20,20,20,.86); color:#fff; border-radius:999px;
    padding:7px 16px; font-size:13px; box-shadow:var(--shadow);
    pointer-events:none; opacity:0; transition:opacity .18s; max-width:88vw;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  #toast.show{opacity:1}

  #updatebar{
    position:fixed; z-index:700; left:50%; transform:translateX(-50%);
    top:calc(112px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; gap:10px;
    background:var(--ink); color:#fff; border-radius:999px; padding:9px 9px 9px 18px;
    box-shadow:0 3px 14px rgba(0,0,0,.28); font-size:13.5px; font-weight:600;
  }
  #updatebar button{
    border:0; background:#fff; color:var(--ink); font:inherit; font-weight:700;
    padding:7px 15px; border-radius:999px; cursor:pointer;
  }
  #updatebar .x{
    background:transparent; color:rgba(255,255,255,.65); font-size:17px;
    padding:4px 8px; font-weight:400;
  }

  /* Same shape as the update bar, in the brand blue so the two never read as
     the same message. It sits above the sheet at every snap point. */
  #sharenudge{
    position:fixed; z-index:700; left:12px; right:12px;
    top:calc(112px + env(safe-area-inset-top, 0px));
    display:flex; align-items:center; gap:10px;
    background:#1b4f8f; color:#fff; border-radius:16px; padding:11px 10px 11px 15px;
    box-shadow:0 3px 14px rgba(0,0,0,.28); font-size:13px; font-weight:600;
    line-height:1.35;
  }
  #sharenudge .txt{flex:1; font-weight:600}
  #sharenudge button{
    border:0; background:#fff; color:#1b4f8f; font:inherit; font-weight:700;
    padding:8px 14px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  #sharenudge .x{
    background:transparent; color:rgba(255,255,255,.7); font-size:17px;
    padding:4px 6px; font-weight:400;
  }
  /* 平板：一欄版面，置中係啱嘅。 */
  @media (min-width:560px) and (max-width:1023px){
    #sharenudge{left:50%; right:auto; transform:translateX(-50%); max-width:480px}
  }
  /* 電腦：有咗側欄之後，「視窗中間」就係地圖中間 —— 一條藍色橫額浮喺
     地圖正中，遮住人哋睇緊嘅嘢。跟返側欄擺，地圖就乾淨。 */
  @media (min-width:1024px){
    #sharenudge{
      left:14px; right:auto; transform:none;
      width:var(--rail); max-width:var(--rail);
      top:calc(112px + env(safe-area-inset-top, 0px));
    }
  }


  /* 開場卡入面嘅說明。字細過主要指示，但係真真正正俾人睇嘅內容 —— 唔係
     藏起身嘅文字，Google 會罰嗰啲。 */
  .about{
    margin-top:22px; padding-top:18px; border-top:1px solid var(--line);
    font-size:13.5px; line-height:1.7; color:var(--ink3);
  }
  .about p{margin:0 0 9px}
  .about b{color:var(--ink2); font-weight:650}
  .about a{color:#1b4f8f; font-weight:600}


  /* ---------- 第一次用嘅四頁介紹 ----------
     scroll-snap 做橫掃：原生慣性、原生回彈、鍵盤同輔助工具都用得，
     自己寫手勢係做唔到咁順嘅。 */
  .pager{
    display:flex; overflow-x:auto; scroll-snap-type:x mandatory;
    scroll-behavior:smooth; -webkit-overflow-scrolling:touch;
    overscroll-behavior-x:contain; scrollbar-width:none;
    margin:0 -22px;
    flex:1 1 auto; min-height:0;
  }
  .pager::-webkit-scrollbar{display:none}
  .pg{
    flex:0 0 100%; scroll-snap-align:center; scroll-snap-stop:always;
    padding:0 22px; box-sizing:border-box; color:var(--ink2);
    /* 矮機（SE 667）萬一仲係唔夠位，捲嘅係呢一版嘅文字，唔係成張卡 */
    overflow-y:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;
    display:flex; flex-direction:column; justify-content:safe center;
  }
  .pg::-webkit-scrollbar{display:none}
  .introfoot{flex:none}
  .introact{display:flex; flex-direction:column; min-height:104px}
  /* 44px = #intro 嘅 padding 上下；46px = .card 嘅 padding 上下（26+20） */
  .introtop{
    display:flex; flex-direction:column;
    height:min(calc(100dvh - 44px - 46px), 620px); min-height:330px;
  }
  .pg .ill{
    display:block; width:100%; max-width:300px; height:auto; margin:0 auto 18px;
    color:var(--ink2);
    /* 矮機度張圖會食晒啲位，逼到文字同掣落 fold 下面。封個頂，
       SVG 有 viewBox，縮細唔會變形。 */
    max-height:20dvh; flex:0 1 auto; min-height:118px;
  }
  .pg h1{font-size:23px; line-height:1.3; letter-spacing:-.02em; margin:0 0 8px; color:var(--ink)}
  .pg p{font-size:15px; line-height:1.65; margin:0; color:var(--ink2)}
  .pg p + p{margin-top:11px}
  .pg p b{color:var(--ink); font-weight:650}
  /* 六版教學逐版教一個功能，行完之後用家識咗六個掣，但唔知件嘢係乜。
     第一版補一句講清楚成個產品 —— 之後五版先至讀得成一件事而唔係一張
     功能清單。 */
  .pg .what{margin-top:14px; padding:11px 13px; border-radius:11px;
    background:var(--card); border:1px solid var(--line); font-size:14px;
    line-height:1.6; color:var(--ink2)}
  .pg .what b{color:var(--ink)}
  .pg .what u{text-decoration:none; color:var(--brand); font-weight:650}

  .dots{display:flex; justify-content:center; gap:8px; margin:16px 0 14px}
  /* .card button 係全寬藍色大掣，同樣 specificity 但排喺後面，所以會贏。
     加多一層 .card 令呢個規則贏返。 */
  .card .dots button{
    width:8px; height:8px; min-height:0; padding:0; border:0; border-radius:50%;
    background:var(--line); color:inherit; font-size:0;
    cursor:pointer; transition:width .22s, background .22s;
  }
  .card .dots button.on{width:22px; border-radius:4px; background:var(--ink)}

  /* 最後一頁係開戶口。免費 app 嘅慣例做法：教完先問，唔肯就一個交叉閂咗佢。
     唔攔路，但亦唔會乜都唔問 —— 呢一刻佢啱啱睇完「收藏」做到乜,
     係全程最容易明白開戶口有咩用嘅一刻。 */
  .card{position:relative}
  .pg .joinwhy{list-style:none; margin:16px 0 0; padding:0; text-align:left}
  .pg .joinwhy li{
    position:relative; padding:0 0 0 26px; margin:0 0 9px;
    font-size:14.5px; line-height:1.5; color:var(--ink2);
  }
  .pg .joinwhy li::before{
    content:"✓"; position:absolute; left:4px; top:0; color:#0f6354; font-weight:700;
  }
  /* 交叉要夠大隻先撳得中 —— 44px 係 Apple 由第一代 iPhone 用到而家嘅最細
     觸控目標，而呢個掣偏偏就係唔想撳錯嗰個。 */
  .card .xbtn{
    position:absolute; top:8px; right:8px; z-index:2;
    width:44px; height:44px; min-height:44px; padding:0;
    border:0; background:transparent; color:var(--ink3);
    font-size:26px; line-height:1; cursor:pointer; border-radius:50%;
  }
  .card .xbtn:active{background:var(--line)}
  .card .linkbtn{
    background:transparent; border:0; color:var(--ink2); font-size:14.5px;
    font-weight:500; min-height:44px; width:100%; padding:0; margin:4px 0 0;
    cursor:pointer; text-decoration:underline; text-underline-offset:3px;
  }
  .card .gbtn{margin-top:0}

  /* 「戴頭盔」收埋，撳咗先展開 —— 唔可以冇，但亦唔應該喺第一眼就擋住個人。 */
  .fine{margin:6px 0 0}
  .fine summary{
    list-style:none; cursor:pointer; font-size:12.5px; color:var(--ink3);
    display:flex; align-items:center; justify-content:center; gap:5px;
    min-height:44px; user-select:none;
  }
  .fine summary::-webkit-details-marker{display:none}
  .fine summary .cv{transition:transform .2s; font-size:13px; line-height:1}
  .fine[open] summary .cv{transform:rotate(180deg)}
  .fine-body{
    font-size:12.5px; line-height:1.7; color:var(--ink3);
    border-top:1px solid var(--line); padding-top:12px;
  }
  .fine-body p{margin:0 0 9px}
  .fine-body b{color:var(--ink2)}
  .fine-body a{color:#1b4f8f}

  /* 八字。同「收藏」一樣係一個篩選 —— 撳落去，地圖同清單只剩返合你
     命卦嘅樓。所以佢應該住喺篩選列，唔應該另外開個 tab。 */
  .guachip .gi{color:#8a6d3b; font-size:13px; margin-inline-end:4px}
  .chip.guachip.on{background:#3d2f18; color:#fff; border-color:#3d2f18}
  .chip.guachip.on .gi{color:#e3c489}

  /* 清單頂嗰條命卦橫額。撳落去返去睇成個盤 —— 所以佢係一個掣，唔係
     一段字。 */
  .guaband{
    display:flex; align-items:center; gap:12px; width:100%;
    min-height:60px; padding:12px 14px; margin:0 0 14px;
    background:#3d2f18; color:#fff; border:0; border-radius:14px;
    font:inherit; text-align:start; cursor:pointer;
  }
  .guaband .gg2{
    font-size:22px; font-weight:700; line-height:1; flex:none;
    width:40px; height:40px; border-radius:50%; background:rgba(255,255,255,.12);
    display:grid; place-items:center; color:#e3c489;
  }
  .guaband span:not(.gg2){flex:1; font-size:13px; line-height:1.55; opacity:.9}
  .guaband b{display:block; font-size:15.5px; font-weight:650; opacity:1; margin:0 0 2px}
  .guaband i{font-style:normal; font-size:20px; opacity:.6; flex:none}

  /* 電腦版清單頂嗰個完整八字區塊。 */
  .bzmore{
    width:100%; min-height:44px; margin:12px 0 0; background:transparent;
    border:0; color:var(--ink3); font:inherit; font-size:13px; cursor:pointer;
    text-align:start; padding:0;
  }
  .guahr{border-top:1px solid var(--line); margin:14px 0 4px}

  /* 未接數據嗰截權重。唔刪走佢 —— 佢係總分嘅一部分，刪咗就係講大話;
     但亦都唔可以扮量過。 */
  .wbar .wpend{opacity:.45; background-image:repeating-linear-gradient(
    45deg, transparent, transparent 4px, rgba(255,255,255,.35) 4px, rgba(255,255,255,.35) 8px)}
  .pend{font-size:12px; color:var(--ink3); line-height:1.65; margin:8px 0 0}

  /* 五行。顏色係傳統對應：木青、火赤、土黃、金白（用灰金）、水黑（用深藍）。
     唔用彩虹 —— 呢五隻色本身就係五行嘅意思，唔係裝飾。 */
  .wx-木{--wx:#2f7d4f} .wx-火{--wx:#b3352c} .wx-土{--wx:#a07a2c}
  .wx-金{--wx:#7d7a6e} .wx-水{--wx:#2b4a7a}

  .bzh{font-size:15px; font-weight:650; color:var(--ink); margin:24px 0 10px;
       letter-spacing:-.01em}
  .wxbox{display:flex; align-items:center; gap:14px; margin:18px 0 0;
         background:var(--card2,#f3f1ec); border:1px solid var(--line);
         border-radius:16px; padding:14px 16px}
  /* 個標籤本來塞咗入個圈度，擠到隻字冇位。移咗出嚟擺喺圈上面。 */
  .wxbox .wxgw{flex:none; display:flex; flex-direction:column; align-items:center; gap:4px}
  .wxbox .wxgl{font-size:11px; font-weight:600; color:var(--ink3); letter-spacing:.04em}
  .wxbox .wxg{
    width:52px; height:52px; border-radius:50%; display:grid;
    place-items:center; font-size:26px; font-weight:700; color:#fff;
    background:var(--wx,#57544d);
  }
  .wxbox .wxt{font-size:14px; line-height:1.65; color:var(--ink2)}
  .wxbox .wxt b{color:var(--ink); font-weight:650}

  .wxbars{background:var(--card); border:1px solid var(--line);
          border-radius:14px; padding:13px 15px}
  .wxr{display:grid; grid-template-columns:22px 1fr 76px; align-items:center;
       gap:10px; margin:0 0 9px}
  .wxr:last-child{margin:0}
  .wxr u{text-decoration:none; font-size:15px; font-weight:650; color:var(--wx,var(--ink2))}
  .wtrack{background:var(--line); border-radius:5px; height:10px; overflow:hidden}
  .wtrack i{display:block; height:100%; border-radius:5px; background:var(--wx,#999)}
  .wxr em{font-style:normal; font-size:13px; color:var(--ink3); text-align:end;
          font-variant-numeric:tabular-nums}
  .wxr em b{display:inline-block; min-width:18px; margin-inline-start:6px;
            color:var(--ink2); font-weight:600}

  .srcbox{background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:12px 14px; margin:0 0 9px}
  .srcbox .sl{margin:0; font-size:16px; font-weight:600; color:var(--ink)}
  .srcbox .sl b{font-weight:700; color:var(--wx,var(--ink))}
  .srcbox .ss{margin:5px 0 0; font-size:12.5px; line-height:1.6; color:var(--ink3)}
  .tag{font-size:11.5px; font-weight:600; padding:2px 8px; border-radius:999px;
       margin-inline-start:7px; vertical-align:2px}
  .tag.ok{background:#e4f0e9; color:#0f6354}
  .tag.no{background:#f6e7e7; color:#a01f1f}

  /* 地區先，樓宇後。撳一個區入去先至見到入面啲樓 —— 一開就掉幾千幢樓
     出嚟，人係揀唔到嘅。 */
  /* 屋苑呢一層。之前撳個區就直接掉幾千幢樓出嚟 —— 但人搵樓諗嘅係
     「長安邨點？」，唔係「第 437 幢點？」。 */
  .estwrap{margin:14px 0 4px}
  .estwrap .fhd span{color:var(--ink3); font-weight:500}
  .estlist{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:7px;
           margin:8px 0 0}
  .estrow{display:flex; align-items:center; gap:9px; padding:9px 11px; width:100%;
          background:var(--card); border:1px solid var(--line); border-radius:12px;
          font:inherit; text-align:start; cursor:pointer; color:var(--ink)}
  .estrow:active{background:var(--card2,#f3f1ec)}
  .estrow .ep{width:30px; height:30px; border-radius:50%; flex:none; display:grid;
              place-items:center; font-size:13px; font-weight:700; font-variant-numeric:tabular-nums}
  .estrow .en2{flex:1; min-width:0; font-size:11.5px; color:var(--ink3); line-height:1.4}
  .estrow .en2 b{display:block; font-size:14px; font-weight:600; color:var(--ink);
                 white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .estrow i{font-style:normal; color:var(--ink3); flex:none}
  .backrow{background:transparent; border:0; font:inherit; font-size:14px; color:var(--ink2);
           padding:0 0 10px; cursor:pointer; min-height:36px}

  /* 未登入：見到有邊幾個區，但入唔到去。唔係遮住晒 —— 要先見到有嘢
     喺度，先會覺得值得登記。 */
  .area.lock{opacity:.72}
  .area.lock i{font-size:14px; opacity:.8}
  .gate{background:linear-gradient(135deg,#3d2f18,#5a4622); color:#fff;
        border-radius:16px; padding:18px 18px 16px; margin:12px 0 0}
  .gate .gh{margin:0 0 8px; font-size:18px; font-weight:650}
  .gate .gs{margin:0 0 8px; font-size:13.5px; line-height:1.65; opacity:.88}
  .gate .gs b{color:#e3c489}
  .gate .gf{margin:9px 0 0; font-size:12px; opacity:.7; text-align:center}
  /* .dark 都要寫埋，唔係就會輸俾下面嗰條 `.pbtn.dark{background:#3d2f18}`
     —— 兩條同分數，後面嗰條贏底色，但贏唔到文字色，結果深啡字寫喺深啡
     底上面，成個掣隱形。個掣仲撳得，但冇人知佢喺度。 */
  .gate .pbtn, .gate .pbtn.dark{background:#fff; color:#3d2f18}

  /* ---- 會員解鎖：三個 tab ------------------------------------------
     人唔會睇一大幅字。呢度嘅規矩係：每一 pane 一個主視覺 + 三幾句,
     術語一律用完先喺括號入面標返個正名。 */
  .mwrap{margin:20px 0 0; border:1px solid var(--line); border-radius:16px;
         background:var(--card); overflow:hidden}
  .mtabs{display:flex; border-bottom:1px solid var(--line); background:var(--card2,#f3f1ec)}
  .mtab{flex:1; min-height:46px; border:0; background:transparent; cursor:pointer;
        font:inherit; font-size:13.5px; font-weight:600; color:var(--ink3);
        padding:0 4px; border-bottom:2px solid transparent}
  .mtab.on{color:var(--ink); background:var(--card); border-bottom-color:var(--e1)}
  .mpane{display:none; padding:15px 15px 17px}
  .mpane.on{display:block}
  .mp1{margin:0 0 10px; font-size:14px; line-height:1.7; color:var(--ink2)}
  .mp1 b{color:var(--ink); font-weight:650}
  .msub{font-size:11.5px; color:var(--ink3); line-height:1.6; margin:8px 0 0}

  /* 九宮格 —— 八宅本身就係咁畫，唔使我哋發明一個新圖。 */
  .g9{display:grid; grid-template-columns:repeat(3,1fr); gap:5px; margin:2px 0 10px}
  .g9 div{border-radius:10px; padding:8px 4px; text-align:center; min-height:62px;
          display:flex; flex-direction:column; justify-content:center; gap:1px}
  .g9 u{text-decoration:none; font-size:13px; font-weight:700; color:var(--ink)}
  .g9 b{font-size:12px; font-weight:650}
  .g9 i{font-style:normal; font-size:10.5px; color:var(--ink3); line-height:1.35}
  .g9 .ok{background:#e9f2ee; border:1px solid #c7ded4}
  .g9 .ok b{color:#0f6354}
  .g9 .no{background:#faeeee; border:1px solid #e8cccc}
  .g9 .no b{color:#a01f1f}
  .g9 .me{background:#3d2f18; border:1px solid #3d2f18}
  .g9 .me u,.g9 .me b{color:#fff}
  .g9 .me i{color:#d9c9a8}
  .g9 .best{outline:2px solid var(--e1); outline-offset:-2px}

  /* 一句一行嘅建議。唔用 bullet point 符號 —— 用個五行色點。 */
  .tips{list-style:none; margin:10px 0 0; padding:0}
  .tips li{display:flex; gap:9px; align-items:flex-start; padding:7px 0;
           border-top:1px solid var(--line); font-size:13.5px; line-height:1.65;
           color:var(--ink2)}
  .tips li:first-child{border-top:0}
  .tips li s{text-decoration:none; flex:none; width:7px; height:7px; border-radius:50%;
             background:var(--wx,var(--ink3)); margin-top:7px}
  .tips li b{color:var(--ink); font-weight:650}

  /* 樓層：兩派並列。重點唔係邊派啱，係邊幾層兩派都話好。 */
  .flr{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0 0}
  .flr > div{background:var(--card2,#f3f1ec); border:1px solid var(--line);
             border-radius:12px; padding:10px 11px}
  .flr .fn2{font-size:12px; font-weight:700; color:var(--ink2); margin:0 0 5px}
  .flr .fv{font-size:15px; font-weight:650; color:var(--ink); line-height:1.5;
           font-variant-numeric:tabular-nums}
  .flr .fs2{font-size:10.5px; color:var(--ink3); margin:4px 0 0; line-height:1.45}
  /* 電話度兩欄迫到串樓層斷三行。層數先係重點，寧願佔多啲高度都要佢
     一行讀得晒。 */
  @media (max-width:430px){ .flr{grid-template-columns:1fr} }
  .agree{margin:9px 0 0; background:#e9f2ee; border:1px solid #c7ded4;
         border-radius:12px; padding:11px 12px}
  .agree p{margin:0; font-size:13px; line-height:1.6; color:#0f6354}
  .agree p b{font-size:16px; font-weight:700; font-variant-numeric:tabular-nums}

  /* 一個數字擺大啲，跟住一句解釋。比一段字有效好多。 */
  .bignum{display:flex; align-items:baseline; gap:10px; margin:10px 0 0;
          padding:11px 13px; background:var(--card2,#f3f1ec);
          border:1px solid var(--line); border-radius:12px}
  /* 只放大最外層嗰個數。入面段字都有 <b>，唔寫 > 就連佢哋一齊變 28px,
     搞到第二個數字同主角打架。 */
  .bignum > b{font-size:28px; font-weight:750; letter-spacing:-.03em; color:var(--ink);
            line-height:1; font-variant-numeric:tabular-nums}
  .bignum span b{color:var(--ink); font-weight:700}
  .bignum span{font-size:12.5px; line-height:1.6; color:var(--ink2)}

  .whywrap{margin:12px 0 0}
  .why{margin:0 0 8px; font-size:13.5px; line-height:1.7; color:var(--ink2);
       background:var(--card); border:1px solid var(--line); border-radius:12px;
       padding:11px 13px}
  .why b{font-weight:650}

  .arealist{display:flex; flex-direction:column; gap:8px}
  .area{
    display:flex; align-items:center; gap:12px; width:100%; padding:12px 14px;
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    font:inherit; text-align:start; cursor:pointer; color:var(--ink);
  }
  .area:active{background:var(--card2,#f3f1ec)}
  .area .ab{width:38px; height:38px; border-radius:50%; flex:none; display:grid;
            place-items:center; background:var(--wx,#888); color:#fff;
            font-size:17px; font-weight:700}
  .area .an{flex:1; font-size:12.5px; color:var(--ink3); line-height:1.45}
  .area .an b{display:block; font-size:16px; font-weight:650; color:var(--ink)}
  .area .asub{color:var(--ink3); opacity:.75; font-size:11.5px}
  /* 個人榜同全港榜答唔同問題，而佢哋經常唔同答案 —— 唔講清楚，人哋會
     以為我哋推緊爛樓。所以擺喺清單正下面，唔係擺落聲明度。 */
  .clash{background:var(--card2,#f3f1ec); border:1px solid var(--line);
         border-radius:14px; padding:12px 14px; margin-top:10px;
         font-size:12.5px; line-height:1.55; color:var(--ink3)}
  .clash b{color:var(--ink)}
  .area .ac{font-size:16px; font-weight:650; font-variant-numeric:tabular-nums}
  .area .ac em{font-style:normal; font-size:11.5px; color:var(--ink3); margin-inline-start:2px}
  .area i{font-style:normal; font-size:19px; color:var(--ink3); flex:none}

  .regs{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:8px}
  .reg{background:var(--card); border:1px solid var(--line); border-radius:14px;
       padding:12px 14px}
  .reg b{display:block; font-size:16px; font-weight:650; color:var(--wx,var(--ink))}
  .reg span{font-size:12.5px; color:var(--ink3)}

  /* 八字嘅入口。之前得篩選列上面一個細細嘅「✦ 八字」掣，同另外七個掣
     排埋一齊 —— 用家開咗個 app 都唔知有呢個功能。所以總覽度擺一張
     講得清楚嘅卡，寫明入面係咩，唔係淨係得兩個字。 */
  /* 人話解釋 —— 唔用術語，任何人讀得明。 */
  /* 試食：第一段照睇，跟住嗰啲矇咗 —— 佢見到入面係咩質地，
     先至決定值唔值得解鎖。一隻字都唔俾睇嘅話，冇人會撳。 */
  .blurwrap{position:relative; max-height:132px; overflow:hidden;
    filter:blur(4px); opacity:.55; user-select:none; pointer-events:none;
    -webkit-mask-image:linear-gradient(#000 35%, transparent);
    mask-image:linear-gradient(#000 35%, transparent)}
  .gate-tight{margin-top:-14px}
  .bzplain{font-size:14.5px; line-height:1.75; color:var(--ink2); margin:0 0 10px}
  .bzplain b{color:var(--ink); font-weight:700}
  /* 術語同出處全部收埋喺最尾：大部分人唔會睇，想睇嘅撳開就有。 */
  .bzdeep{margin:26px 0 0; border:1px solid var(--line); border-radius:14px;
    background:var(--card); overflow:hidden}
  .bzdeep > summary{list-style:none; cursor:pointer; display:flex;
    justify-content:space-between; align-items:center; gap:10px;
    padding:14px 15px; min-height:52px; font-size:15px; font-weight:700; color:var(--ink)}
  .bzdeep > summary::-webkit-details-marker{display:none}
  .bzdeep > summary .chev{color:var(--ink3); font-size:12px; transition:transform .2s}
  .bzdeep[open] > summary{border-bottom:1px solid var(--line)}
  .bzdeep[open] > summary .chev{transform:rotate(180deg)}
  .bzdeep > :not(summary){padding-inline:15px}
  .bzdeep > .bzh:first-of-type{margin-top:14px}
  .bznow{background:#3d2f18; color:#f3ece0; border-radius:16px;
    padding:16px 15px 15px; margin:0 0 14px}
  .bznow .bnh{font-size:18px; font-weight:800; color:#fff; margin:0 0 6px}
  .bznow .bns{font-size:13px; line-height:1.6; color:#d8cdb8; margin:0 0 13px}
  .bznow .bns b{color:#e3c489}
  .bnrow{display:flex; gap:7px; margin:0 0 10px}
  .bnrow select{flex:1 1 0; min-width:0; font:inherit; font-size:16px;
    padding:11px 9px; border-radius:11px; border:0; background:#fffdf8;
    color:var(--ink)}
  .bnsex{display:flex; gap:7px; margin:0 0 12px}
  .bnsex button{flex:1 1 0; font:inherit; font-size:15px; font-weight:650;
    min-height:46px; border-radius:11px; border:1.5px solid rgba(255,255,255,.35);
    background:transparent; color:#f3ece0; cursor:pointer}
  .bnsex button.on{background:#fffdf8; color:#3d2f18; border-color:#fffdf8}
  .bznow .pbtn{width:100%}
  .bznow .bnf{font-size:11.5px; color:#b6a98f; margin:9px 0 0; text-align:center}
  .bzcta{
    display:flex; align-items:center; gap:13px; width:100%; margin:16px 0 0;
    padding:15px 16px; border:0; border-radius:16px; cursor:pointer;
    background:linear-gradient(135deg,#3d2f18,#5a4622); color:#fff;
    font:inherit; text-align:start;
  }
  .bzcta .bzi{
    width:42px; height:42px; border-radius:50%; flex:none; display:grid;
    place-items:center; background:rgba(227,196,137,.18); color:#e3c489;
    font-size:19px;
  }
  .bzcta .bzx{flex:1; font-size:13px; line-height:1.55; opacity:.88}
  .bzcta .bzx b{display:block; font-size:16.5px; font-weight:650; opacity:1; margin:0 0 3px}
  .bzcta i{font-style:normal; font-size:20px; opacity:.55; flex:none}
  .bzcta:active{opacity:.9}

  /* 要人哋交出生日期之前，要講得出交咗之後我哋實際做啲乜。
     唔係一句「我哋會幫你計」，係逐步寫出嚟，連幢數都寫埋。 */
  .whyme{background:var(--card); border:1px solid var(--line); border-radius:14px;
         padding:14px 16px; margin:14px 0 4px}
  .whyme>p:first-child{font-size:14px; font-weight:650; color:var(--ink); margin:0 0 8px}
  .whyme ol{margin:0; padding-inline-start:20px; font-size:13px; line-height:1.7;
            color:var(--ink3)}
  .whyme ol b{color:var(--ink)}
  .whyme .wm2{font-size:12.5px; color:var(--ink3); margin:10px 0 0; line-height:1.6}

  /* ---- 逐幢樓嘅個人分析 ----
     九運嗰半係人人一樣嘅，呢半係你自己嘅。兩者要一眼睇得出唔同,
     所以呢格有自己嘅底色同標題，唔係接落去嘅另一段字。 */
  .pp{background:var(--card); border:1px solid var(--line); border-radius:16px;
      padding:15px 16px; margin:16px 0 0}
  .pp .fhd{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap; margin:0 0 10px}
  .pp .fhd span{font-size:11.5px; font-weight:500; color:var(--ink3); letter-spacing:.02em}
  .ppq{font-size:13px; line-height:1.6; color:var(--ink3); margin:0 0 12px}
  .ppscore{display:flex; align-items:center; gap:13px}
  .ppn{width:52px; height:52px; border-radius:50%; flex:none; display:grid;
       place-items:center; font-size:21px; font-weight:700}
  .ppv{font-size:16px; font-weight:650; margin:0}
  .ppvs{font-size:12.5px; line-height:1.55; color:var(--ink3); margin:2px 0 0}
  .ppd{display:grid; grid-template-columns:auto 1fr; gap:8px 14px; margin:14px 0 0;
       font-size:13px; line-height:1.6}
  .ppd dt{color:var(--ink3); white-space:nowrap}
  .ppd dd{margin:0; color:var(--ink)}
  .ppdt{color:var(--ink3); font-size:12.5px}
  .ppd .ppok{color:#1d6b4f} .ppd .ppno{color:#a01f1f}
  .ppnote{font-size:11.5px; line-height:1.6; color:var(--ink3); margin:12px 0 0}

  /* 見到有嘢喺度，但讀唔到 —— 淨係講「登入有嘢睇」冇人信。 */
  .ppwrap{position:relative; margin-top:12px}
  .ppblur{filter:blur(5px); opacity:.5; user-select:none; pointer-events:none;
          max-height:190px; overflow:hidden}
  .ppgate{position:absolute; inset:auto 0 0; padding:16px 14px 2px;
          background:linear-gradient(to bottom, transparent, var(--card) 38%)}
  .ppgh{font-size:15px; font-weight:650; margin:0 0 4px}
  .ppgs{font-size:12.5px; line-height:1.6; color:var(--ink3); margin:0 0 12px}

  /* 成家嗰格。個人分上面再加一層，所以要企喺個人分下面但睇得出係另一件事。 */
  .fam{border-top:1px solid var(--line); margin-top:14px; padding-top:13px}
  .famh{display:flex; align-items:baseline; gap:6px; font-size:14px; font-weight:650;
        margin:0 0 10px}
  .famh b{font-size:19px} .famh span{font-size:11.5px; font-weight:500; color:var(--ink3)}
  .faml{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:7px}
  .faml li{display:flex; align-items:center; gap:10px}
  .fn{width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center;
      font-size:14px; font-weight:700}
  .fnm{flex:1; font-size:14px; line-height:1.3}
  .fnm em{display:block; font-style:normal; font-size:11.5px; color:var(--ink3)}
  .ftag2{font-size:11px; color:#a01f1f; background:#fbeceb; border-radius:999px;
         padding:2px 8px; white-space:nowrap}
  .famadd{display:block; width:100%; margin-top:13px; padding:11px 14px; cursor:pointer;
          background:var(--bg); border:1px dashed var(--line); border-radius:12px;
          font:inherit; font-size:13px; color:var(--ink2); text-align:start}
  .famadd:active{opacity:.6}

  .famlist{list-style:none; margin:14px 0 0; padding:0; display:flex;
           flex-direction:column; gap:8px}
  .famlist li{background:var(--card); border:1px solid var(--line); border-radius:13px}
  .famlist .fi{width:34px; height:34px; border-radius:50%; flex:none; display:grid;
               place-items:center; background:var(--bg); border:1px solid var(--line);
               font-size:14px; font-weight:650; color:var(--ink2)}
  .fedit{background:transparent; border:0; font:inherit; font-size:13px;
         color:var(--ink3); cursor:pointer; padding:6px 2px}
  .famform input[type=text]{width:100%; padding:11px 13px; font:inherit; font-size:16px;
    border:1px solid var(--line); border-radius:11px; background:var(--card); color:var(--ink)}
  .fmhint{font-size:11.5px; color:var(--ink3); margin:5px 0 0}

  /* 改同刪擺埋一齊，但改要行先 —— 撳錯咗想改返嘅人多過想刪嘅人。 */
  .bzfoot{display:flex; gap:10px; align-items:center; justify-content:center;
          flex-wrap:wrap; margin-top:18px}
  .bzedit{background:transparent; border:1px solid var(--line); border-radius:999px;
          font:inherit; font-size:13px; color:var(--ink2); padding:9px 16px;
          cursor:pointer; min-height:38px}
  .bzedit:active{opacity:.6}

  /* ---------- 電腦版右欄 ----------

     1512 × 900 入面，左邊側欄佔 460，其餘成千 pixel 全部係地圖 —— 得個睇字。
     而我哋手上嘅嘢（航空平面圖、屋苑逐座、每個區量出嚟嘅形）喺手機度要
     scroll 好耐先見到，喺電腦度根本擺得落同時睇。

     1360px 以下唔出：再窄就會逼到個地圖剩返一條，三欄變咗冇一欄夠用。 */
  #side{display:none}
  @media (min-width:1360px){
    #side{
      display:block; position:fixed; z-index:390;
      top:14px; right:14px; width:360px; max-height:calc(100dvh - 28px);
      overflow-y:auto; overscroll-behavior:contain;
      background:var(--card); border:1px solid var(--line); border-radius:18px;
      box-shadow:0 10px 34px rgba(0,0,0,.10);
      padding:16px 16px 18px;
    }
    #side[hidden]{display:none}
    /* 地圖嘅工具掣唔可以俾右欄冚住。 */
    #tools{margin-inline-end:374px}
    /* 呢兩格搬咗上右欄，左欄唔使再擺多次。 */
    .dtop{display:none}
  }
  .sidehd{display:flex; align-items:baseline; gap:8px; margin:0 0 3px}
  .sidehd b{font-size:17px; font-weight:650}
  .sidehd span{font-size:11.5px; color:var(--ink3)}
  .sidesub{font-size:12.5px; color:var(--ink3); margin:0 0 12px; line-height:1.5}
  .planimg{width:100%; border-radius:12px; border:1px solid var(--line);
           display:block; background:var(--bg)}
  .plancap{font-size:11.5px; color:var(--ink3); margin:6px 0 0; line-height:1.5}
  .sideblocks{list-style:none; margin:12px 0 0; padding:0;
              display:flex; flex-direction:column; gap:6px}
  .sideblocks li{display:flex; align-items:center; gap:9px; padding:7px 9px;
                 border-radius:10px; cursor:pointer}
  .sideblocks li:hover{background:var(--bg)}
  .sideblocks li.here{background:var(--bg); outline:1px solid var(--line)}
  .sideblocks .bs{width:30px; height:30px; border-radius:50%; flex:none; display:grid;
                  place-items:center; font-size:13px; font-weight:700}
  .sideblocks .bn{flex:1; font-size:13.5px; line-height:1.3}
  .sideblocks .bf{font-size:11.5px; color:var(--ink3)}
  .sidewx{display:flex; gap:6px; margin:10px 0 0}
  .sidewx div{flex:1; text-align:center; background:var(--bg); border:1px solid var(--line);
              border-radius:10px; padding:8px 4px}
  .sidewx u{display:block; text-decoration:none; font-size:15px; font-weight:700}
  .sidewx span{font-size:11px; color:var(--ink3)}

  .famrow{cursor:pointer; border-radius:10px; padding:3px 6px; margin-inline:-6px}
  .famrow:hover{background:var(--bg)}
  .famrow.off{opacity:.45}
  .famrow.off .fnm b{text-decoration:line-through; text-decoration-thickness:1px}
  .fsw{width:20px; flex:none; text-align:center; font-size:14px; color:var(--good,#1d6b4f)}

  /* 加屋企人係第二個最重要嘅動作（第一個係入自己八字），所以佢要有自己
     一格，唔好變成一行字跟喺最尾。 */
  .famcta{background:linear-gradient(135deg,#3d2f18,#5a4622); color:#fff;
          border-radius:16px; padding:16px 17px; margin:18px 0 6px}
  .famcta.has{background:var(--card); color:var(--ink); border:1px solid var(--line)}
  .fch{font-size:16.5px; font-weight:650; margin:0 0 5px}
  .fcs{font-size:13px; line-height:1.6; opacity:.85; margin:0 0 13px}
  .famcta.has .fcs{opacity:1; color:var(--ink3)}
  .famcta .pbtn{width:100%}
  .famcta:not(.has) .pbtn{background:#fff; color:#3d2f18}

  /* 一個淨係得個 🔒 嘅圖示，冇人知佢係「登入就睇到」定係「你冇資格」。
     實測有人以為已經睇完 —— 所以寫字，唔用圖示。 */
  .lockpill{display:inline-block; background:#3d2f18; color:#fff; font-size:11px;
            font-weight:650; padding:4px 9px; border-radius:999px; white-space:nowrap;
            font-style:normal}
  .lockbar{background:var(--card); border:1px solid var(--line); border-radius:13px;
           padding:12px 14px; margin:10px 0 2px; font-size:12.5px; line-height:1.65;
           color:var(--ink3)}
  .lockbar b{color:var(--ink)}

  .famli{display:flex; align-items:stretch; gap:0; padding:0; overflow:hidden}
  .famli.off{opacity:.45}
  .famli.off .fnm b{text-decoration:line-through; text-decoration-thickness:1px}
  .fopen{flex:1; display:flex; align-items:center; gap:11px; background:transparent;
         border:0; font:inherit; text-align:start; color:var(--ink); cursor:pointer;
         padding:11px 4px 11px 13px}
  .fopen .go{color:var(--ink3); font-size:17px}
  .fsw2{flex:none; width:48px; background:transparent; border:0; border-inline-start:1px solid var(--line);
        font:inherit; font-size:15px; color:var(--good,#1d6b4f); cursor:pointer}
  .fsw2[aria-pressed="false"]{color:var(--ink3)}
  .famsum{background:var(--card); border:1px solid var(--line); border-radius:14px;
          padding:14px 16px; margin:14px 0 4px}
  .fsh{font-size:14px; font-weight:650; margin:0 0 9px}
  .fsl{font-size:13px; line-height:1.7; color:var(--ink3); margin:0}
  .fsl b:first-child{color:var(--ink3); display:inline-block; min-width:64px}
  .fsn{font-size:12.5px; line-height:1.7; color:var(--ink3); margin:11px 0 0;
       padding-top:11px; border-top:1px solid var(--line)}
  .fsn b{color:var(--ink)}

  /* 加咗屋企人之後，畫面一定要睇得出唔同咗 —— 唔係人哋會以為冇 save 到。 */
  .famnote{background:#f3f7fd; border:1px solid #d6e2f3; border-radius:12px;
           padding:11px 13px; margin:10px 0 8px; font-size:12.5px; line-height:1.65;
           color:var(--ink3)}
  .famnote b{color:#1b4f8f}

  /* 唔係為咗爬蟲而收埋嘅連結 —— 佢哋真係有用，而且真係俾人睇。
     收埋連結係 cloaking，Google 會罰。 */
  .sitelinks{margin:22px 0 0; padding-top:18px; border-top:1px solid var(--line)}
  .sitelinks .slh{font-size:12px; font-weight:650; color:var(--ink3);
                  letter-spacing:.04em; margin:0 0 10px}
  .sitelinks ul{list-style:none; margin:0; padding:0; display:grid; gap:8px}
  .sitelinks a{display:block; padding:11px 13px; border-radius:12px;
               background:var(--card); border:1px solid var(--line);
               color:var(--ink3); text-decoration:none; font-size:12.5px;
               line-height:1.55}
  .sitelinks a b{display:block; color:var(--ink); font-size:14.5px;
                 font-weight:650; margin-bottom:2px}
  .sitelinks a:hover{background:var(--bg)}
  @media (min-width:700px){ .sitelinks ul{grid-template-columns:1fr 1fr} }

  /* 唔識風水嘅人一入嚟見到一地分數同「九運」兩隻字，係完全唔知發生咩事。
     呢格要喺佢撳任何嘢之前，用人話講完：個分係乜、點解有兩個。 */
  .howto{background:var(--card); border:1px solid var(--line); border-radius:16px;
            padding:15px 16px; margin:16px 0 0}
  /* 條問題先係重點 —— 之前得 12px 灰字，比下面三段解釋細，
     次序啱啱倒轉。 */
  .tlh{font-size:21px; font-weight:800; color:var(--ink); letter-spacing:-.02em;
       line-height:1.35; margin:0 0 6px}
  /* 三樣嘢摺埋：summary 一行，解釋撳落去先出。一開就攤三段淺灰字，
     人只會見到一牆嘢，結果乜都唔睇。 */
  .tlrow{margin:0; border-top:1px solid var(--line)}
  .tlrow > summary{list-style:none; cursor:pointer; display:flex; align-items:center;
    gap:10px; padding:11px 0; min-height:46px}
  .tlrow > summary::-webkit-details-marker{display:none}
  .tln{width:22px; height:22px; border-radius:50%; flex:none; display:grid;
       place-items:center; background:var(--ink); color:#fff;
       font-size:12px; font-weight:700}
  .tlrow:nth-of-type(1) .tln{background:var(--e1)}
  .tlrow:nth-of-type(2) .tln{background:var(--e2)}
  .tlrow:nth-of-type(3) .tln{background:var(--e3)}
  .tlrow:nth-of-type(1) .tlk{color:var(--e1); background:var(--e1b)}
  .tlrow:nth-of-type(2) .tlk{color:var(--e2); background:var(--e2b)}
  .tlrow:nth-of-type(3) .tlk{color:var(--e3); background:var(--e3b)}
  /* 標題下面一條三色 bar —— 一眼就知「呢度有三樣嘢」，唔使讀先明。 */
  .tlbar{display:flex; gap:3px; margin:0 0 12px}
  .tlbar i{flex:1 1 0; height:5px; border-radius:3px}
  .tlbar i:nth-child(1){background:var(--e1)}
  .tlbar i:nth-child(2){background:var(--e2)}
  .tlbar i:nth-child(3){background:var(--e3)}
  .tlrow b{font-size:16px; font-weight:700; color:var(--ink)}
  .tlrow .chev{margin-inline-start:auto; color:var(--ink3); font-size:12px;
    transition:transform .2s}
  .tlrow[open] > summary .chev{transform:rotate(180deg)}
  .tlrow em{display:block; font-style:normal; font-size:13px; line-height:1.65;
            color:var(--ink3); padding:0 0 12px 32px}
  .tlrow u{text-decoration:none; color:var(--ink2); font-weight:600}
  .tlmore{margin-top:2px; border-top:1px solid var(--line)}
  .tlmore > summary{list-style:none; cursor:pointer; display:flex;
    justify-content:space-between; align-items:center; padding:12px 0;
    min-height:46px; font-size:13.5px; font-weight:650; color:var(--brand)}
  .tlmore > summary::-webkit-details-marker{display:none}
  .tlmore .chev{color:var(--ink3); font-size:12px; transition:transform .2s}
  .tlmore[open] > summary .chev{transform:rotate(180deg)}
  .tlmore .tlnote:first-of-type{border-top:0; padding-top:0}
  .tlnote{font-size:12.5px; line-height:1.65; color:var(--ink3);
          margin:0 0 11px; padding-top:11px; border-top:1px solid var(--line)}
  .tlnote b{color:var(--ink)}
  .tlwhat{margin-top:11px; border-top:1px solid var(--line); padding-top:10px}
  .tlwhat summary{display:flex; justify-content:space-between; align-items:center;
                  cursor:pointer; font-size:13px; font-weight:600; color:var(--ink2);
                  list-style:none}
  .tlwhat summary::-webkit-details-marker{display:none}
  .tlwhat[open] .chev{transform:rotate(180deg)}
  .tlwhat .chev{transition:transform .15s; color:var(--ink3)}
  .tlwhat p{font-size:12.5px; line-height:1.7; color:var(--ink3); margin:9px 0 0}
  .tlwhat p b{color:var(--ink)}

  .tagline{font-size:13.5px; font-weight:600; color:var(--gold,#8a6d2f); margin:-2px 0 6px;
           letter-spacing:.01em}

  .bzform{margin:6px 0 0}
  .bzform label{display:block; font-size:13.5px; color:var(--ink3); margin:14px 0 6px}
  .bzrow{display:flex; gap:8px}
  .bzform select{
    flex:1; min-width:0; height:52px; padding:0 10px; font:inherit; font-size:17px;
    color:var(--ink); background:var(--card); border:1px solid var(--line);
    border-radius:12px; appearance:none; text-align:center;
    background-image:linear-gradient(45deg,transparent 50%,var(--ink3) 50%),
                     linear-gradient(135deg,var(--ink3) 50%,transparent 50%);
    background-position:calc(100% - 16px) 24px, calc(100% - 11px) 24px;
    background-size:5px 5px, 5px 5px; background-repeat:no-repeat;
  }
  .bzsex{display:flex; gap:8px}
  .bzsex button{
    flex:1; height:52px; font:inherit; font-size:17px; font-weight:600;
    background:var(--card); color:var(--ink2); border:1px solid var(--line);
    border-radius:12px; cursor:pointer; min-height:52px;
  }
  .bzsex button.on{background:#3d2f18; color:#fff; border-color:#3d2f18}

  .pillars{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:4px 0 0}
  .pil{background:var(--card2,#f3f1ec); border:1px solid var(--line);
       border-radius:12px; padding:10px 4px; text-align:center}
  .pil u{display:block; text-decoration:none; font-size:11.5px; color:var(--ink3); margin:0 0 5px}
  .pil b{display:block; font-size:21px; font-weight:650; letter-spacing:.06em; line-height:1.35}
  .guabox{
    display:flex; align-items:center; gap:14px; margin:16px 0 0;
    background:#3d2f18; color:#fff; border-radius:16px; padding:15px 17px;
  }
  .guabox .gg{font-size:30px; font-weight:700; line-height:1; flex:none}
  .guabox .gt{font-size:13.5px; line-height:1.6; opacity:.92}
  .guabox .gt b{color:#e3c489}
  .dirs{display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0}
  .dirs span{
    font-size:13px; padding:6px 11px; border-radius:999px;
    background:var(--card2,#f3f1ec); border:1px solid var(--line); color:var(--ink2);
  }
  .dirs span b{color:var(--ink); font-weight:650}
  .dirs span.best{background:#f0e6d2; border-color:#ddcba4}
  .bznote{font-size:12.5px; color:var(--ink3); line-height:1.7; margin:14px 0 0}
  .bzdel{
    width:100%; min-height:44px; margin:14px 0 0; background:transparent;
    border:0; color:var(--ink3); font:inherit; font-size:13.5px;
    text-decoration:underline; text-underline-offset:3px; cursor:pointer;
  }

  /* 由地圖行去 678 版詳細資料頁嗰道門。
     做到同清單一行一樣嘅樣，因為佢做緊同一件事：撳落去，見多啲。 */
  .deepwrap{margin:18px 0 0}
  .deep{
    display:flex; align-items:center; gap:10px; width:100%;
    min-height:56px; padding:11px 14px; margin:8px 0 0;
    background:var(--card2,#f3f1ec); border:1px solid var(--line);
    border-radius:14px; text-decoration:none; color:var(--ink);
  }
  .deep span{flex:1; font-size:13.5px; line-height:1.5; color:var(--ink3)}
  .deep b{display:block; font-size:16px; font-weight:650; color:var(--ink); margin:0 0 2px}
  .deep i{font-style:normal; font-size:20px; color:var(--ink3); flex:none}
  .deep:active{background:var(--line)}

  /* ---------- 會員 ----------
     Apple 嘅內文標準係 17pt。呢個 app 之前喺 13–13.5px，對「好大年紀都
     識用」嚟講太細，所以清單同資料嗰啲字推上 16–17px，所有撳得嘅嘢最少
     44px 高 —— 44pt 係 Apple 由第一代 iPhone 用到而家嘅最細觸控目標。 */
  .acct{
    display:flex; align-items:center; gap:12px; width:100%;
    min-height:56px; padding:10px 14px; margin:0 0 14px;
    background:var(--card2,#f3f1ec); border:1px solid var(--line);
    border-radius:14px; text-align:left; font:inherit; cursor:pointer;
  }
  .acct .av{
    width:34px; height:34px; border-radius:50%; flex:none; object-fit:cover;
    background:#1b4f8f; color:#fff; display:grid; place-items:center;
    font-size:16px; font-weight:700;
  }
  .acct .ai{font-size:16px; font-weight:650; color:var(--ink); flex:1}
  .acct-out{flex-wrap:wrap}
  .acct-out .ai{flex:0 0 auto}
  .acct-out .as{font-size:13.5px; color:var(--ink3); flex:1 0 100%; margin-top:-2px}
  .acct-out .ag{color:var(--ink3); font-size:20px; line-height:1}
  .aout{
    border:0; background:transparent; color:var(--ink3);
    font:inherit; font-size:14px; padding:10px 4px; min-height:44px; cursor:pointer;
  }

  .ltabs{display:flex; gap:8px; overflow-x:auto; margin:0 0 14px; padding-bottom:2px;
         -webkit-overflow-scrolling:touch; scrollbar-width:none}
  .ltabs::-webkit-scrollbar{display:none}
  .ltab{
    flex:none; min-height:38px; padding:8px 15px; border-radius:999px;
    border:1px solid var(--line); background:var(--card); color:var(--ink2);
    font:inherit; font-size:15px; font-weight:600; cursor:pointer; white-space:nowrap;
  }
  .ltab.on{background:var(--ink); color:#fff; border-color:var(--ink)}
  .ltab-new{color:var(--ink3); font-size:18px; padding:8px 14px}

  .signin{padding:8px 2px 4px}
  .si-h{font-size:24px; font-weight:700; letter-spacing:-.02em; margin:0 0 6px}
  .si-s{font-size:16px; color:var(--ink2); margin:0 0 22px; line-height:1.55}
  /* Google 規定用佢自己個掣、佢自己個 logo、佢自己嗰句字，唔可以自己砌。 */
  .gbtn{
    display:flex; align-items:center; justify-content:center; gap:11px;
    width:100%; min-height:52px; border-radius:13px;
    background:#fff; color:#1f1f1f; border:1px solid #dadce0;
    font:inherit; font-size:17px; font-weight:600; cursor:pointer;
    box-shadow:0 1px 2px rgba(0,0,0,.06);
  }
  .gbtn:active{background:#f4f4f4}
  /* 呢個剔本來淨係一個淨色空方格，貼住段字 —— 有人睇成係一張載唔到嘅圖,
     亦都睇唔出成行撳得。所以整成一格卡，有底有邊，撳落去成格有反應。 */
  .si-opt{
    display:flex; gap:12px; align-items:flex-start;
    margin:22px 0 0; padding:13px 14px; min-height:44px; cursor:pointer;
    background:var(--card); border:1px solid var(--line); border-radius:13px;
  }
  .si-opt:active{background:var(--bg)}
  .si-opt:has(input:checked){border-color:#1b4f8f; background:#f3f7fd}
  .si-opt input{width:22px; height:22px; margin:1px 0 0; flex:none; accent-color:#1b4f8f}
  .si-opt span{font-size:16px; color:var(--ink); line-height:1.45}
  .si-opt i{display:block; font-style:normal; font-size:13.5px; color:var(--ink3); margin-top:2px}
  .si-legal{font-size:13.5px; color:var(--ink3); line-height:1.6; margin:18px 0 0}
  .si-legal a{color:#1b4f8f}

  .picklist{list-style:none; margin:12px 0 0; padding:0}
  .picklist li{
    display:flex; align-items:center; justify-content:space-between;
    min-height:56px; padding:14px 4px; border-bottom:1px solid var(--line);
    font-size:17px; cursor:pointer;
  }
  .picklist li b{color:#0f6354; font-size:18px}
  .picklist .newl{color:#1b4f8f; font-weight:600; border-bottom:0}

  /* toast 上面嗰個動作 */
  .tact{
    margin-left:12px; border:0; background:transparent; color:#7fb0e8;
    font:inherit; font-weight:700; padding:6px 2px; cursor:pointer;
  }

  /* ---------- bottom sheet ---------- */
  /* Three snap points, the way every native map app behaves. Opening a
     building used to fill the screen, leaving no map to steer by — half is
     the default so the building and its surroundings stay visible together. */
  #sheet{
    position:fixed; z-index:640; left:0; right:0; bottom:0;
    background:var(--card); border-radius:18px 18px 0 0; box-shadow:0 -3px 18px rgba(0,0,0,.14);
    /* Never taller than the space under the filter row: at full height the
       sheet used to bury the grade chips, so you could see results but not
       change what you were filtering by. dvh, not vh, so a phone's collapsing
       address bar does not push the bottom off screen. */
    height:calc(100dvh - 124px); display:flex; flex-direction:column;
    transform:translateY(calc(100% - 58px));
    transition:transform .3s cubic-bezier(.32,.72,0,1);
    touch-action:none;
  }
  #sheet[data-state="half"]{transform:translateY(45%)}
  #sheet[data-state="full"]{transform:translateY(0)}
  #sheet.dragging{transition:none}
  #grip{
    flex:0 0 auto; padding:8px 16px 10px; cursor:grab; user-select:none;
    touch-action:none;
  }
  #grip:active{cursor:grabbing}
  #grip .bar{width:40px; height:5px; border-radius:3px; background:#d5d3cb; margin:0 auto 8px}
  /* 返回擺喺同一個位，唔好散落每一頁入面 —— 人搵返回掣嗰陣係望同一個
     角落，唔係逐頁搵。標題照舊置中，所以返回掣係絕對定位，唔會推歪佢。 */
  .griprow{position:relative; display:flex; align-items:center; justify-content:center;
           min-height:22px}
  #griptext{font-size:13.5px; color:var(--ink2); text-align:center;
            padding-inline:56px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #gripback{position:absolute; inset-inline-start:0; top:50%; transform:translateY(-50%);
            background:transparent; border:0; font:inherit; font-size:13.5px;
            color:var(--ink2); cursor:pointer; padding:6px 10px 6px 0; min-height:34px;
            display:flex; align-items:center; max-width:52%}
  #gripback span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  #gripback:active{opacity:.55}
  #sheetbody{
    flex:1 1 auto; overflow-y:auto; overscroll-behavior:contain;
    padding:0 16px calc(22px + var(--safe-b));
    -webkit-overflow-scrolling:touch; touch-action:pan-y;
  }
  .bname{font-size:19px; font-weight:700; margin:0 0 2px; line-height:1.25}
  .ben{font-size:12.5px; color:var(--ink3); margin:0 0 14px}
  .scorerow{display:flex; align-items:center; gap:14px; margin-bottom:16px}
  .bigscore{
    width:76px; height:76px; flex:0 0 76px; border-radius:50%; display:grid; place-items:center;
    font-size:27px; font-weight:700; font-variant-numeric:tabular-nums;
    box-shadow:0 2px 8px rgba(0,0,0,.14);
  }
  /* The verdict is the thing people read first; as plain text it disappeared. */
  .verdict{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 5px;
    padding:4px 13px; border-radius:999px; line-height:1.3;
  }
  .vsub{font-size:12.5px; color:var(--ink3); margin:0}
  .bars{margin-bottom:16px}
  .bars .r{display:grid; grid-template-columns:64px 1fr 38px; align-items:center; gap:10px; margin:6px 0}
  .bars .lb{font-size:13px; color:var(--ink2)}
  .bars .tk{background:#edebe4; border-radius:4px; height:11px}
  /* The mid-band colour is deliberately low-chroma, which is right on the map
     but leaves a bar almost invisible against its track. A hairline gives every
     value a defined edge whatever its colour. */
  .bars .fl{height:11px; border-radius:0 4px 4px 0; box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
  .bars .vl{text-align:right; font-size:13px; font-variant-numeric:tabular-nums}
  .fhd{
    font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:var(--ink3); margin:0 0 8px;
  }
  .ftag{
    display:inline-block; padding:2px 8px; border-radius:999px; background:#eceae4;
    color:#55534e; font-size:11.5px; font-weight:600; letter-spacing:.02em;
  }
  dl.facts{display:grid; grid-template-columns:auto 1fr; gap:6px 14px; margin:0 0 16px}
  dl.facts dt{color:var(--ink3); font-size:15px}
  dl.facts dd{margin:0; font-size:16px; font-variant-numeric:tabular-nums}
  .gmaps{
    display:block; text-align:center; text-decoration:none; font-size:14px; font-weight:600;
    color:var(--brand); border:1px solid var(--line); border-radius:12px; padding:11px; margin-bottom:14px;
  }
  .gmaps:active{background:var(--bg)}
  /* ---------- explanatory block ----------
     Previously one dense paragraph. Split into labelled rows so each fact can
     be read on its own instead of being hunted for inside a block of text. */
  .note-block{border-top:1px solid var(--line); margin-top:4px; padding-top:14px}
  .note-block h4{
    font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    color:var(--ink3); margin:0 0 10px;
  }
  .note-row{display:grid; grid-template-columns:52px 1fr; gap:10px; margin-bottom:9px}
  .note-row .k{
    font-size:11.5px; font-weight:600; color:var(--ink2); text-align:right;
    font-variant-numeric:tabular-nums; padding-top:1px;
  }
  .note-row .v{font-size:12.5px; color:var(--ink2); line-height:1.55}
  .note-foot{
    font-size:11.5px; color:var(--ink3); line-height:1.6; margin:14px 0 0;
    padding-top:12px; border-top:1px dashed var(--line);
  }
  .note-foot b{color:var(--ink2); font-weight:600}

  /* ---------- method explanation ----------
     Collapsed by default: it is reference material, not something to read on
     every building. Opened, it walks the four steps with this building's own
     numbers filled in, so the figures above stop being arbitrary. */
  .method{border-top:1px solid var(--line); margin-top:4px}
  .method>summary{
    list-style:none; cursor:pointer; padding:14px 2px; display:flex;
    align-items:center; justify-content:space-between;
    font-size:13.5px; font-weight:600; color:var(--ink2);
  }
  .method>summary::-webkit-details-marker{display:none}
  .method .chev{color:var(--ink3); font-size:12px; transition:transform .18s}
  .method[open] .chev{transform:rotate(180deg)}
  .method-body{padding:0 0 4px}

  .step{display:grid; grid-template-columns:24px 1fr; gap:11px; margin-bottom:20px}
  .sn{
    width:24px; height:24px; border-radius:50%; background:var(--brand); color:#fff;
    display:grid; place-items:center; font-size:12px; font-weight:700;
  }
  .sb h5{font-size:14px; margin:2px 0 6px; color:var(--ink)}
  .sb p{font-size:12.5px; line-height:1.65; color:var(--ink2); margin:0 0 8px}
  .sb p.mine{
    background:var(--bg); border-radius:8px; padding:8px 10px; font-size:12.5px;
    color:var(--ink); margin:8px 0 0;
  }

  table.mwds{border-collapse:collapse; width:100%; margin:10px 0; font-size:12px}
  table.mwds th{
    text-align:left; font-weight:600; color:var(--ink3); font-size:10.5px;
    letter-spacing:.05em; padding:0 8px 5px 0; border-bottom:1px solid var(--line);
  }
  table.mwds td{padding:4px 8px 4px 0; color:var(--ink2); border-bottom:1px solid #f2f1ed}
  table.mwds td:last-child{text-align:right; font-variant-numeric:tabular-nums; padding-right:0}
  table.mwds tr.hit td{background:#fff5e6; color:var(--ink); font-weight:700}
  table.mwds tr.hit td:first-child{border-radius:6px 0 0 6px; padding-left:7px}
  table.mwds tr.hit td:last-child{border-radius:0 6px 6px 0; padding-right:7px}
  table.mwds tr.zero td{color:var(--ink3)}

  .wbar{display:flex; gap:3px; margin-top:10px; height:40px}
  .wbar div{
    border-radius:6px; background:var(--brand); color:#fff; display:grid; place-content:center;
    font-size:12px; font-weight:700; text-align:center; min-width:0; overflow:hidden;
  }
  .wbar div:nth-child(2){background:#5f8fb8}
  .wbar div:nth-child(3){background:#a8c4d6; color:var(--ink2)}
  .wbar span{display:block; font-size:10px; font-weight:500; opacity:.9}

  .limits{background:var(--bg); border-radius:12px; padding:13px 14px; margin-bottom:14px}
  .limits h5{font-size:13px; margin:0 0 8px; color:var(--ink)}
  .limits ul{margin:0 0 9px; padding-left:17px}
  .limits li{font-size:12.5px; line-height:1.6; color:var(--ink2); margin-bottom:3px}
  .limits p{font-size:12px; line-height:1.6; color:var(--ink3); margin:0}
  .build{
    font-size:10.5px; color:var(--ink3); text-align:center; margin:14px 0 0;
    font-variant-numeric:tabular-nums; letter-spacing:.02em;
  }
  .build-inline{color:var(--ink3); font-variant-numeric:tabular-nums}
  .src{font-size:11px; line-height:1.6; color:var(--ink3); margin:0; padding-top:11px;
       border-top:1px dashed var(--line)}

  /* ---------- 理氣 block ---------- */
  .liqi{
    background:linear-gradient(180deg,#fbf9f4,#f7f4ec); border:1px solid #ece6d8;
    border-radius:14px; padding:14px 15px; margin:0 0 16px;
  }
  .liqi-hd{
    font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
    color:#9b8b63; margin-bottom:6px;
  }
  .liqi-now{
    display:inline-block; font-size:17px; font-weight:700; margin:0 0 4px;
    padding:3px 12px; border-radius:999px; line-height:1.35;
  }
  .liqi-now.t-good{background:#0f6354; color:#fff}
  .liqi-now.t-mid {background:#e6e4de; color:#3a3833}
  .liqi-now.t-bad {background:#a01f1f; color:#fff}
  .liqi-sub{font-size:12.5px; color:var(--ink2); margin:0}
  .liqi-warn{
    font-size:11px; color:var(--ink3); line-height:1.5; margin:11px 0 0;
    padding-top:9px; border-top:1px dashed #e0d7c2;
  }
  .liqi-none{background:var(--bg); border-color:var(--line)}
  .liqi-none .liqi-hd{color:var(--ink3)}

  /* legend inside sheet */
  .bigscore.pctbox{display:flex; flex-direction:column; align-items:center;
    justify-content:center; line-height:1.05; gap:1px}
  .bigscore.pctbox small{font-size:11px; font-weight:600; opacity:.85}
  .bigscore.pctbox b{font-size:24px; font-weight:800; letter-spacing:-.02em}
  .vsub .raw{color:var(--ink3); font-size:12px}
  /* 三樣入面計咗幾多樣 —— 一眼睇到仲爭邊一樣。 */
  .pt{display:flex; align-items:center; gap:9px; font-size:18px; font-weight:750;
    color:var(--ink); margin:26px 0 4px}
  .pt .ptn{flex:0 0 26px; height:26px; border-radius:50%; display:grid;
    place-items:center; background:var(--ink); color:#fff; font-size:13px; font-weight:700}
  .pt.p2 .ptn{background:var(--e1)}
  .pt.p3 .ptn{background:var(--e2)}
  .pt.p4 .ptn{background:var(--e3)}
  .pt em{font-style:normal; font-size:13px; font-weight:500; color:var(--ink3)}
  .ptq{font-size:13px; line-height:1.65; color:var(--ink3); margin:0 0 12px}
  .ptq b{color:var(--ink2)}
  .luckrow{display:flex; gap:14px; align-items:center; padding:13px 14px;
    border:1px solid var(--line); border-radius:14px; background:var(--card)}
  .luckbig{flex:0 0 auto; text-align:center; line-height:1}
  .luckbig b{display:block; font-size:34px; font-weight:800}
  .luckbig small{display:block; font-size:11px; color:var(--ink3); margin-top:3px}
  .luckside{flex:1 1 auto; min-width:0}
  .lkb{font-size:15px; font-weight:700; margin:0 0 3px}
  .lks{font-size:12.5px; line-height:1.55; color:var(--ink3); margin:0}
  .flip{font-size:13px; line-height:1.7; margin:10px 0 0; padding:11px 13px;
    border-radius:12px}
  .flip b{display:block; margin-bottom:3px}
  .flip.good{background:#e8f2ef; color:#2c5a51}
  .flip.good b{color:#0f6354}
  .flip.bad{background:#fdf0ee; color:#7a4a44}
  .flip.bad b{color:#a01f1f}
  .lowhint{background:#fdf6e8; border:1px solid #e8d9b4; border-radius:14px;
    padding:13px 14px; margin:14px 0 0}

  /* District rows read as a report until they look pressable: a score pill,

     progress bar also misfired - a district near the median drew the neutral
     colour, which looks like an empty bar, i.e. missing data. */
  .dlist{list-style:none; margin:0 0 14px; padding:0}

    font-size:15px; font-weight:700; font-variant-numeric:tabular-nums;

  .prompt{

    border:1px solid #d6e4f4; border-radius:12px; padding:11px 13px; margin:0 0 14px;

  /* ---------- onboarding ---------- */
  #intro{
    position:fixed; inset:0; z-index:900; background:rgba(12,14,18,.62);
    display:grid; place-items:center; padding:22px; backdrop-filter:blur(3px);
  }
  #intro.hide{display:none}
  .card{
    background:var(--card); border-radius:20px; padding:26px 22px 20px; max-width:380px; width:100%;
    box-shadow:0 10px 40px rgba(0,0,0,.3);
    /* 唔可以成張卡一齊捲：咁樣「繼續」會跌落 fold 下面，而且每版跌嘅
       距離唔同，隻手指冇固定落點。改做 flex 直排 —— .pager 做可伸縮
       嘅中段（文字太長時自己捲），.introfoot 釘死喺底，所以三版嘅掣
       永遠喺同一個位。overflow:hidden 係俾 min-height:0 生效。 */
    max-height:calc(100dvh - 44px); overflow-y:auto; -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
  }
  .card h1{font-size:21px; margin:0 0 4px}
  .card .tag{font-size:13px; color:var(--ink3); margin:0 0 18px}
  .card ol{margin:0 0 18px; padding-left:20px; font-size:14.5px; line-height:1.85; color:var(--ink2)}
  .card ol b{color:var(--ink)}
  .bnsex.need button{border-color:#ffb4b4; color:#ffd7d7}
  .bnsex.need{animation:sexShake .4s}
  .bzsex.need button{border-color:var(--bad); color:var(--bad)}
  .bzsex.need{animation:sexShake .4s}
  @keyframes sexShake{0%,100%{transform:translateX(0)}
    25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

  .card .warn{font-size:11.5px; color:var(--ink3); line-height:1.5; margin:0 0 10px}
  /* 主要掣。之前呢個樣式淨係綁死喺 .card 入面，所以 sheet 度嘅掣（八字
     嗰兩個）出返個瀏覽器預設灰掣，同成個 app 格格不入。抽咗做一個
     class，.card button 照樣沿用。 */
  .card button, .pbtn{
    width:100%; border:0; background:var(--brand); color:#fff; font:inherit; font-size:16px;
    font-weight:600; padding:14px; border-radius:13px; cursor:pointer;
    min-height:52px;
  }
  .card button:active, .pbtn:active{opacity:.85}
  .pbtn.dark{background:#3d2f18}

  .leaflet-container{font:inherit}
  .leaflet-control-attribution{font-size:10px; padding:0 5px}
  .leaflet-control-zoom{display:none}
  .dmark{
    position:relative; display:grid; place-items:center; border-radius:50%;
    color:#fff; font-weight:700;
    font-size:12px; font-variant-numeric:tabular-nums; border:2px solid rgba(255,255,255,.9);
    box-shadow:0 1px 5px rgba(0,0,0,.3);
  }
  /* 個圈自己填到嗰個比例。--p 係 0–100，conic-gradient 由十二點鐘順時針
     填落去，冇填嗰截係淺色 —— 即係「呢個區入面好樓佔幾多」直接睇得出。 */
  .dmark.ring{
    background:conic-gradient(var(--fill) calc(var(--p) * 1%), rgba(255,255,255,.55) 0);
    border-color:rgba(255,255,255,.95);
  }
  .dmark.ring::after{
    content:""; position:absolute; inset:6px; border-radius:50%;
    background:#fff; box-shadow:inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .dnum{position:relative; z-index:1; font-size:12.5px; font-weight:750}
  .dlabel{
    position:absolute; left:50%; transform:translateX(-50%); top:100%; margin-top:2px;
    font-size:11px; color:#1a1a1a; white-space:nowrap; text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
    font-weight:600;
  }
  /* 平板：清單變成右下角一張卡，唔再打橫冚住成個底。 */
  @media (min-width:760px){
    #sheet{left:auto; right:14px; bottom:14px; width:390px; border-radius:18px;
           height:auto; max-height:min(78vh,720px);
           transform:translateY(calc(100% - 58px))}
    #sheet[data-state="half"],
    #sheet[data-state="full"]{transform:translateY(0)}
    #grip{padding-bottom:12px; cursor:pointer}
    #sheetbody{padding-bottom:20px}
  }

  /* ---------- 電腦版：左邊一條完整側欄 ----------

     電話同電腦唔應該係同一個版面。電話得一隻手、一個拇指、五吋屏幕,
     所以由底部推上嚟嘅 sheet 係啱嘅 —— Google Maps、Apple Maps、Uber
     全部咁做。

     但同一個設計搬去 1512 × 945 就變成浪費：一張 720px 高嘅卡貼住右下
     角，上面吊住 211px 死位；而一個搜尋框橫跨成 1512px 闊。

     電腦版嘅慣例係一條完整側欄（Google Maps、Airbnb、Zillow 都係）：
     搜尋、篩選、清單全部喺同一條直欄，由頂去到底；地圖獨佔右邊，係一
     塊乾淨矩形。眼同滑鼠唔使喺四個角之間跳嚟跳去。 */
  @media (min-width:1024px){
    :root{--rail:420px}
    #top{top:14px; left:14px; right:14px; padding:0}
    #searchwrap{flex:0 0 var(--rail); max-width:var(--rail)}
    /* 地圖樣式同定位掣屬於地圖，唔屬於側欄 —— 推去地圖右上角。 */
    #tools{margin-inline-start:auto}
    #filters{
      left:14px; right:auto; top:74px; width:var(--rail);
      padding:8px 0 2px; flex-wrap:wrap; overflow:visible;
    }
    #filters .chip-sep{display:none}
    /* 側欄由篩選下面開始。--rail-top 係由 JS 度返嚟嘅 —— 篩選列喺
       460px 闊度下會換行，寫死一個數字嘅話，字體大細一變就會有一行掣
       俾側欄冚住。 */
    #sheet{
      left:14px; right:auto; top:var(--rail-top,170px); bottom:14px;
      width:var(--rail); height:auto; max-height:none; border-radius:18px;
    }
  }
  /* 再闊啲就俾條側欄闊啲，唔係俾地圖無限大 —— 清單每行嘅字先係人睇緊嗰樣。 */
  @media (min-width:1500px){ :root{--rail:460px} }

/* Visual estate journey: one main action, with the map always available. */

.journey h1,.journey h2{font-size:29px;line-height:1.25;letter-spacing:-.03em;margin:12px 0 16px}

.journey .jscoreline{display:flex;align-items:center;gap:16px}.journey .jnumber{font-size:48px;line-height:1;font-weight:700}

.journey details{border-top:1px solid var(--line);padding:14px 0;margin-top:12px}.journey summary{font-size:17px;min-height:44px;cursor:pointer;display:list-item;padding:8px 0}.journey details p{font-size:16px;line-height:1.65}

#intro .journey{max-width:440px;padding:28px;margin:auto}#intro .journey .jscene{height:200px}#intro .journey .pbtn{width:100%}#intro .journey h1{font-size:34px}#intro .journey .jfine{font-size:14px;color:var(--ink2)}

</div>
