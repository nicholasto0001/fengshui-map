name: Daily rebuild and deploy

# Rebuilds Feng Shui scores from live CSDI data every morning and publishes
# the site to GitHub Pages. New developments appear in CSDI continuously, so a
# daily run keeps the map current without anyone touching it.

on:
  schedule:
    - cron: "0 21 * * *"   # 05:00 Hong Kong time (UTC+8)
  workflow_dispatch:        # lets you trigger a run by hand from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r pipeline/requirements.txt

      # Terrain and coastline barely change. Rebuild monthly (day 1) or when
      # the file is missing, not on every daily run.
      - name: Rebuild terrain reference
        run: |
          if [ ! -f data/terrain.json ] || [ "$(date -u +%d)" = "01" ]; then
            python pipeline/reconstruct_terrain.py
          else
            echo "terrain.json present, skipping (rebuilds on the 1st)"
          fi

      - name: Fetch district boundaries
        run: python pipeline/fetch_districts.py
        continue-on-error: true

      - name: Fetch current building stock from CSDI
        run: python pipeline/fetch_buildings.py

      - name: Fetch occupation permits (完成年份 + 用途)
        run: python pipeline/fetch_op.py
        continue-on-error: true

      - name: Fetch negative ancillary facilities
        run: python pipeline/fetch_facilities.py
        continue-on-error: true   # a CSDI outage should not block the whole run

      - name: Score
        run: python pipeline/score.py

      - name: Build map tiles, search index and district stats
        run: python pipeline/build_tiles.py

      # buildings.json / scores.json are NOT committed. They are rebuilt on every
      # run and shipped straight to Pages, so history stays small. Only the small,
      # slow-moving reference files (terrain, facilities) are tracked.
      - name: Commit reference data if it changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/terrain.json data/facilities.json data/districts.json
          if git diff --staged --quiet; then
            echo "reference data unchanged"
          else
            git commit -m "data: refresh reference layers $(date -u +%Y-%m-%d)"
            git push
          fi

      # Keep the raw pipeline outputs out of the published site — they are
      # working files, tens of MB each, and nothing on the page fetches them.
      - name: Stamp build
        run: python3 pipeline/stamp_build.py "$(git rev-parse --short HEAD)-$(date -u +%Y%m%d)"

      - name: Stage the site
        run: |
          mkdir -p _site
          cp index.html version.json _site/
          cp og.png favicon.ico apple-touch-icon.png icon-192.png icon-512.png manifest.webmanifest _site/ 2>/dev/null || true
          cp -r data _site/data
          rm -f _site/data/buildings.json _site/data/scores.json _site/data/op.json
          du -sh _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
