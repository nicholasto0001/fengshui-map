name: Build and deploy

# Two targets, and main is not the live one.
#
#   push to main        -> staging   (fengshuimap-staging.workers.dev)
#   push to production  -> live      (hkfengshuimap.com)
#   nightly cron        -> live      (the daily data refresh)
#
# A push used to reach every reader about two minutes later with nobody having
# looked at it. Now ./ship.sh is the only thing that moves the live site, and
# it only ever promotes a commit that has already been built and seen on
# staging.
#
# Every deploy rebuilds the data and hands the result straight to Cloudflare,
# so nothing generated is ever committed — a fresh 33 MB of tiles per day would
# bury the repository within a month.
#
# The slow part is crawling CSDI for 213k buildings (~25 min). That result is
# cached per day, so the first run each day pays for it and every push
# afterwards deploys in a couple of minutes.

on:
  push:
    branches: [main, production]
  schedule:
    - cron: "0 21 * * *"      # 05:00 Hong Kong time
  workflow_dispatch:
    inputs:
      live:
        description: "上線去 hkfengshuimap.com（唔剔就只係上 staging）"
        type: boolean
        default: false
      refresh:
        description: "Re-crawl CSDI even if today's cache is usable"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  # Staging and live queue separately, so checking something on staging cannot
  # hold up a fix to the live site.
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # A schedule always fires on the default branch, so the nightly data
          # refresh would otherwise carry whatever happens to be sitting on
          # main straight to the live site. It builds the live branch instead:
          # new data, reviewed code.
          ref: ${{ github.event_name == 'schedule' && 'production' || github.ref }}

      - name: Decide where this is going
        id: target
        run: |
          # Anything that is not the production branch or the nightly refresh
          # goes to staging. Defaulting the other way is how a site ends up
          # live by accident.
          if [ "${{ github.ref }}" = "refs/heads/production" ] || \
             [ "${{ github.event_name }}" = "schedule" ] || \
             [ "${{ github.event.inputs.live }}" = "true" ]; then
            echo "env=" >> "$GITHUB_OUTPUT"
            echo "where=live · hkfengshuimap.com" >> "$GITHUB_OUTPUT"
          else
            echo "env=--env staging" >> "$GITHUB_OUTPUT"
            echo "where=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r pipeline/requirements.txt

      # Restore and save are split deliberately. actions/cache only writes its
      # cache in a post step that is skipped when the job fails, so one broken
      # deploy forced the next run to re-crawl CSDI from scratch — 23 minutes
      # thrown away for a fault that had nothing to do with the data.
      - name: Restore the CSDI crawl
        id: crawlcache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/buildings.json
            data/op.json
          key: csdi-${{ github.run_id }}
          restore-keys: csdi-

      - name: Decide whether to crawl
        id: fresh
        run: |
          # Re-crawl when asked, when nothing was restored, or when the cached
          # crawl is from an earlier day.
          if [ "${{ github.event.inputs.refresh }}" = "true" ] || [ ! -f data/buildings.json ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          elif [ "$(date -u -r data/buildings.json +%F)" != "$(date -u +%F)" ]; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          else
            echo "stale=false" >> "$GITHUB_OUTPUT"
            echo "reusing crawl from $(date -u -r data/buildings.json)"
          fi

      # Terrain and the coastline do not move; monthly is ample.
      - name: Rebuild terrain reference
        if: github.event_name == 'schedule'
        run: |
          if [ ! -f data/terrain.json ] || [ "$(date -u +%d)" = "01" ]; then
            python pipeline/reconstruct_terrain.py
          else
            echo "terrain.json present, rebuilt on the 1st"
          fi

      - name: Crawl CSDI
        if: steps.fresh.outputs.stale == 'true'
        run: |
          python pipeline/fetch_buildings.py
          python pipeline/fetch_op.py
          python pipeline/fetch_districts.py
          python pipeline/fetch_facilities.py

      # Saved as soon as the crawl lands, before anything downstream can fail.
      - name: Save the CSDI crawl
        if: steps.fresh.outputs.stale == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/buildings.json
            data/op.json
          key: csdi-${{ github.run_id }}

      # Outside the CSDI cache gate on purpose. These are two plain file
      # downloads, not a 213k-record crawl, and that cache only carries
      # buildings.json and op.json — so riding on it meant every push on a day
      # the crawl was already cached deployed with no 樓齡 records and no
      # 房委會 register at all: 元運 silently back from 30.3% to 23.5%, and the
      # official use class gone, which is what keeps a substation from being
      # graded as a home.
      #
      # They get their own cache, restored before and saved after, purely as a
      # fallback: a government server having a slow minute took down a whole
      # deploy once, and shipping without the data is worse than shipping
      # yesterday's copy of it.
      - name: Restore the registers
        uses: actions/cache/restore@v4
        with:
          path: |
            data/bd_age.json
            data/housing.json
          key: registers-${{ github.run_id }}
          restore-keys: registers-

      - name: Fetch the age and housing registers
        run: |
          for name in fetch_bd_age fetch_housing; do
            case "$name" in
              fetch_bd_age)  f=data/bd_age.json ;;
              fetch_housing) f=data/housing.json ;;
            esac
            if python "pipeline/$name.py"; then continue; fi
            if [ -s "$f" ]; then
              echo "::warning::$name failed; using the cached $f from $(date -u -r "$f")"
            else
              echo "::error::$name failed and there is no cached $f to fall back to"
              exit 1
            fi
          done

      - name: Save the registers
        uses: actions/cache/save@v4
        with:
          path: |
            data/bd_age.json
            data/housing.json
          key: registers-${{ github.run_id }}

      - name: Score and tile
        run: |
          python pipeline/score.py
          python pipeline/build_tiles.py
          python pipeline/make_sitemap.py

      - name: Assemble the site
        run: bash build.sh
        env:
          GITHUB_SHA: ${{ github.sha }}

      # wrangler-action@v3 bundles Wrangler 3.90, which predates the stable
      # `assets` config — it still expected `experimental_assets`, so it could
      # not read wrangler.jsonc at all. Calling wrangler directly pins the
      # current major instead of whatever the action happens to ship.
      - name: Deploy to Cloudflare (${{ steps.target.outputs.where }})
        id: deploy
        run: |
          set -o pipefail
          npx --yes wrangler@4 deploy ${{ steps.target.outputs.env }} 2>&1 | tee deploy.log
          # workers.dev addresses are per Cloudflare account, so the address
          # cannot be written down in advance — it is read back from what
          # wrangler actually published.
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          {
            echo "### ${{ steps.target.outputs.where }}"
            [ -n "$URL" ] && echo "$URL" || echo "(no workers.dev address in the output)"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Promoting from the button has to move the live branch too, or the
      # nightly refresh — which builds that branch — would quietly put the old
      # code back the next morning.
      - name: Mark this commit as the live one
        if: github.event.inputs.live == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git push --force origin HEAD:production

      # Recorded once so ship.sh can show it, and nobody has to go digging
      # through a build log to find out where to look before shipping.
      # Both a staging push and a tick-the-box live deploy run on main, so the
      # branch alone does not say which one this was — and the live run wrote
      # the production address into .staging-url. The target does say.
      - name: Remember the staging address
        if: steps.target.outputs.env != '' && steps.deploy.outputs.url != ''
        run: |
          printf '%s\n' "${{ steps.deploy.outputs.url }}" > .staging-url
          # git diff says nothing about a file git has never tracked, so the
          # first run — the one that actually had something new to record —
          # decided there was no change and skipped itself.
          git add .staging-url
          if ! git diff --staged --quiet; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "ci: staging is at ${{ steps.deploy.outputs.url }}"
            git push origin HEAD:main || echo "could not fast-forward main; skipped"
          fi

      # Only the small, slow-moving reference layers stay in the repository.
      - name: Commit reference data if it changed
        if: github.event_name == 'schedule'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/terrain.json data/facilities.json data/districts.json
          if git diff --staged --quiet; then
            echo "reference data unchanged"
          else
            git commit -m "data: refresh reference layers $(date -u +%Y-%m-%d)"
            # Onto main, where development happens — the live branch is only
            # ever moved by ship.sh, and a commit made here would be discarded
            # by the next promotion anyway.
            git push origin HEAD:main || echo "could not fast-forward main; skipped"
          fi
