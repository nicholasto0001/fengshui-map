name: Deploy site

# Publishes the site on every push. Deliberately does NOT run the data
# pipeline: the map reads scores from a public feature service at runtime, so
# a push should put the new UI online in under a minute rather than waiting
# ~25 minutes for a full CSDI crawl. The crawl belongs to daily.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Bake the commit into the page and publish it alongside, so a visitor
      # holding a cached copy can be told a newer one exists.
      - name: Stamp build
        run: python3 pipeline/stamp_build.py "$(git rev-parse --short HEAD)"

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
